<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meals">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
<title>Lazy Meal Planner</title>
<meta name="description" content="One pot, one pan, a rice cooker and a 4.2 L air fryer: how much effort have you got tonight? Plan a week, shop at LIFE, cook, track leftovers in the fridge, and see what you save.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f141a; --ink:#eef2f5; --sub:#c3cfd9; --muted:#8b99a6; --muted2:#7d8b99; --dim:#6f7f8d; --faint:#43525f;
  --mint:#7fd4a8; --warm:#e8825a; --warmsoft:#f0c3ad;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14); --line3:rgba(255,255,255,.16);
  --row-off:#2a3542; --condoff:#5d6b78;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;
  font:16px/1.5 "Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}
body.noscroll{overflow:hidden;position:fixed;left:0;right:0;top:0;bottom:0}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
h1,h2,h3{margin:0;font-size:inherit;font-weight:inherit}
a{color:var(--mint)}
button{font-family:inherit}
::-webkit-scrollbar{width:0}
@keyframes lmpUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lmpIn{from{opacity:0}to{opacity:1}}
@keyframes lmpSheet{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 22px 34px;display:none}
.wrap.on{display:block;animation:lmpIn .22s ease both}

.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.eyebrow.mint{color:var(--mint)}
.bigrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--dim)}
.kicker.mint{color:var(--mint)}
.sectionlabel{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.bignum{font-size:52px;line-height:.9;font-weight:900;letter-spacing:-.04em}
.bignum.mint{color:var(--mint);font-size:56px;letter-spacing:-.045em}
.bignumlabel{font-size:13px;color:var(--muted2);font-weight:500;margin-top:6px}
.subline{font-size:13px;color:var(--muted2);font-weight:500;margin-top:8px}
.footnote{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.55;color:var(--muted2)}
.emptynote{border-top:1px solid var(--line);padding:34px 0;font-size:14.5px;color:var(--muted2);line-height:1.6}
.emptycard{text-align:center;color:var(--muted2);padding:44px 16px;font-size:15px;line-height:1.6}
.jp{color:var(--muted2)}

.hlist{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.hlist.row3,.hlist.row2{flex-direction:row}
/* structural only — never set background/color here, or it out-specifies .cta/.varon/.stepbtn/.logbtn */
.hlist>button{flex:1;border:none;cursor:pointer;font-family:inherit}

/* ---- tonight: effort picker ---- */
.hero1{font-size:38px;line-height:1.07;font-weight:900;letter-spacing:-.03em;margin-top:6px}
.effrow{display:flex;align-items:center;gap:18px;padding:20px 4px;text-align:left;width:100%;background:var(--bg);color:var(--ink);min-height:44px}
.effrow:active{background:#151d25}
.effjp{font-size:26px;font-weight:900;color:var(--mint);min-width:62px;letter-spacing:-.02em}
.effbody{flex:1;min-width:0;display:flex;flex-direction:column}
.effen{font-size:19px;font-weight:700;color:var(--ink)}
.effsub{font-size:13.5px;color:var(--muted2);margin-top:2px}
.arrow{color:var(--faint);font-size:20px}
.fridgenudge{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted2);line-height:1.5}

/* ---- tonight: answered ---- */
.backlink{background:none;border:none;color:var(--muted2);font-size:13px;font-weight:700;padding:10px 2px;margin-left:-2px;cursor:pointer;letter-spacing:.04em;min-height:44px;display:inline-flex;align-items:center}
.hero2{font-size:36px;line-height:1.06;font-weight:900;letter-spacing:-.03em;margin-top:8px}
.herojp{font-size:15px;margin-top:6px;font-weight:500}
.herowhy{font-size:15px;color:var(--sub);margin-top:20px;line-height:1.55;max-width:320px}
.herocta{margin-top:26px}
.herocta.hlist{flex-direction:row}
.cta{background:var(--mint);color:#0f141a;border:none;padding:17px 8px;font-size:16px;font-weight:900;cursor:pointer;letter-spacing:-.01em;width:100%}
.herocta .cta{flex:2}
.nah{background:var(--bg);color:var(--sub);border:none;padding:17px 20px;font-size:15px;font-weight:700;cursor:pointer;flex:1;white-space:nowrap}
.altrow{display:flex;align-items:center;gap:14px;padding:15px 4px;text-align:left;width:100%;background:var(--bg);color:var(--ink);min-height:44px}
.altrow:active{background:#151d25}
.altbody{flex:1;min-width:0;display:flex;flex-direction:column}
.altn{font-size:16px;font-weight:700;color:var(--ink)}
.altmeta{font-size:12.5px;color:var(--muted2);margin-top:1px}
.altbadge{font-size:12px;font-weight:700}
.altbadge.mint{color:var(--mint)}
.altbadge.muted{color:var(--muted2)}

/* ---- week ---- */
.stepbtn{width:46px;height:46px;font-size:24px;font-weight:700;color:var(--mint);background:var(--bg)}
.varon{background:var(--ink);color:#0f141a;padding:12px 6px;font-size:12.5px;font-weight:700;line-height:1.3}
.varoff{background:var(--bg);color:var(--muted2);padding:12px 6px;font-size:12.5px;font-weight:700;line-height:1.3}
.ghostbtn{width:100%;margin-top:14px;background:none;border:1px solid var(--line3);color:var(--ink);padding:15px;font-size:15px;font-weight:700;cursor:pointer}
.ghostbtn:active{background:#151d25}
.ghostbtn.small{width:auto;margin-top:10px;padding:10px 14px;font-size:13.5px}
.dividerlist{display:flex;flex-direction:column}
.dishrow{border-top:1px solid var(--line);padding:16px 0;display:flex;gap:14px;align-items:flex-start}
.dishnum{font-size:11px;font-weight:900;color:var(--muted2);padding-top:5px;min-width:16px}
.dishmain{flex:1;min-width:0}
.dishopen{background:none;border:none;padding:2px 0;text-align:left;cursor:pointer;display:block;width:100%;min-height:44px}
.dishname{display:block;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.dishjp{display:block;font-size:12.5px;margin-top:1px}
.dishmeta{font-size:12px;color:var(--muted);margin-top:8px;font-weight:500}
.dishacts{display:flex;gap:10px;margin-top:4px}
.dishacts button{background:none;border:none;padding:12px 10px;margin-left:-10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted2);white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
.dishserv{font-size:20px;font-weight:900;color:var(--mint);letter-spacing:-.02em}
.mugitoggle{background:none;border:1px solid var(--line3);color:var(--muted2);font-size:12px;font-weight:700;padding:10px;cursor:pointer;min-height:44px}
.mugitoggle.on{color:var(--mint);border-color:var(--mint)}
.schedrow{border-top:1px solid var(--line);padding:15px 0;display:flex;gap:16px}
.schedwhen{min-width:74px;font-size:12.5px;font-weight:900;color:var(--mint);letter-spacing:.02em;padding-top:2px}
.schedwhat{flex:1;font-size:14px;line-height:1.55;color:var(--sub)}

/* ---- shop ---- */
.progtrack{height:3px;background:var(--line);margin-top:18px}
.progfill{height:3px;background:var(--mint);transition:width .3s ease}
.clearlink{background:none;border:none;color:var(--muted2);font-size:12.5px;font-weight:700;padding:12px 0;cursor:pointer;min-height:44px}
.ghead2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:26px 0 2px}
.shoprow{width:100%;border:none;border-top:1px solid var(--line);background:none;display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;text-align:left}
.checkbox{width:20px;height:20px;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;color:#0f141a;font-size:12px;font-weight:900;flex:0 0 20px}
.checkbox.on{border-color:var(--mint);background:var(--mint)}
.shopmain{flex:1;min-width:0}
.shopn{display:block;font-size:15.5px;font-weight:700;color:var(--ink)}
.shopn.strike{text-decoration:line-through}
.shopjp{display:block;font-size:12px;margin-top:1px}
.shopamt{text-align:right}
.shopqty{display:block;font-size:14px;font-weight:700;color:var(--sub)}
.shopcost{display:block;font-size:12px;color:var(--muted2)}
details.detailsblock{margin-top:24px}
details.detailsblock summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;color:var(--ink);cursor:pointer;list-style:none;font-size:14.5px;border-top:1px solid var(--line);padding-top:18px}
details.detailsblock summary::-webkit-details-marker{display:none}
details.detailsblock summary::after{content:"▾";color:var(--muted2);font-size:13px;flex:0 0 auto}
details.detailsblock[open] summary::after{content:"▴"}
.detailsnote{color:var(--muted2);font-size:13px;line-height:1.55;margin:10px 0}
.pricerow{display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px;border-bottom:1px solid var(--line);padding:6px 0}
.pricerow:last-of-type{border-bottom:none}
.pricename{flex:1;min-width:0}
.priceunit{color:var(--muted2);font-size:12.5px;white-space:nowrap}
.pricerow input{width:82px;min-height:44px;background:var(--bg);border:1px solid var(--line3);color:var(--ink);font:15px inherit;padding:4px 8px;border-radius:0}

/* ---- fridge ---- */
.linklike{background:none;border:none;color:var(--muted2);font-size:12px;font-weight:700;cursor:pointer;padding:12px 0;white-space:nowrap;min-height:44px}
.fridgerow{border-top:1px solid var(--line);padding:16px 0;display:flex;gap:14px;align-items:flex-start}
.fridgemain{flex:1;min-width:0}
.fridgename{font-size:17px;font-weight:700;color:var(--ink)}
.fridgejp{font-size:12.5px;margin-top:1px}
.fridgeage{font-size:12.5px;font-weight:700;margin-top:9px}
.fridgeage.mint{color:var(--mint)}
.fridgeage.warm{color:var(--warm)}
.fridgeacts{display:flex;gap:10px;margin-top:4px}
.fridgeacts button{background:none;border:none;padding:12px 10px;margin-left:-10px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.fridgeacts button:first-child{color:var(--mint)}
.fridgeacts button:last-child{color:var(--muted2)}
.fridgedots{display:flex;gap:4px;padding-top:4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--row-off);display:inline-block}
.dot.mint{background:var(--mint)}
.dot.warm{background:var(--warm)}
.dot.on{background:var(--mint)}
.containerrow{border-top:1px solid var(--line);padding:16px 0;font-size:14px;line-height:1.6;color:var(--sub)}
.condgrid{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border-top:1px solid var(--line);padding-top:1px}
.condbtn{background:var(--bg);border:none;padding:13px;cursor:pointer;color:var(--condoff);font-size:13px;font-weight:700;flex:1 1 auto;min-height:44px}
.condbtn.on{color:var(--mint)}

/* ---- saved ---- */
.hlist.row2 input{flex:1;min-width:0;background:var(--bg);border:none;color:var(--ink);font:700 17px inherit;padding:15px 14px;outline:none}
.logbtn{background:var(--bg);border:none;color:var(--mint);font-size:14px;font-weight:900;padding:15px 20px;cursor:pointer;white-space:nowrap}
.logrow2{border-top:1px solid var(--line);padding:14px 0;display:flex;align-items:center;gap:12px}
.logd{font-size:12.5px;color:var(--muted2);min-width:44px;font-weight:700}
.logspent{font-size:14px;color:var(--sub);min-width:56px;font-weight:700}
.logbar{flex:1;height:6px;background:rgba(255,255,255,.07);display:block}
.logbar>span{display:block;height:6px;background:var(--mint)}
.logsaved{font-size:14px;font-weight:900;color:var(--mint)}
.logdel{background:none;border:none;color:var(--muted2);font-size:15px;cursor:pointer;padding:0;min-width:44px;min-height:44px}

/* ---- tab bar ---- */
nav#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;border-top:1px solid var(--line);
  background:rgba(15,20,26,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding-bottom:env(safe-area-inset-bottom);z-index:10;max-width:560px;margin:0 auto}
.tabbtn{flex:1;background:none;border:none;padding:11px 2px 15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.tabbtn.on{color:var(--mint)}
.tabjp{font-size:15px;font-weight:700;line-height:1}
.taben{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* ---- sheet ---- */
#sheet-overlay{position:fixed;inset:0;background:rgba(7,9,11,.7);display:none;align-items:flex-end;z-index:30}
#sheet-overlay.show{display:flex;animation:lmpIn .2s ease both}
.sheetcard{width:100%;max-width:560px;margin:0 auto;max-height:82vh;overflow-y:auto;background:#0f141a;
  border-top:1px solid var(--line3);padding:22px 22px calc(34px + env(safe-area-inset-bottom));
  animation:lmpSheet .3s cubic-bezier(.2,.8,.2,1) both}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.sheettitle{min-width:0}
.sheetname{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.sheetjp{font-size:13.5px;margin-top:3px}
.closeb{background:none;border:none;color:var(--muted2);font-size:20px;cursor:pointer;padding:0;line-height:1}
.sheetfacts{display:flex;gap:20px;margin-top:20px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.factv{font-size:16px;font-weight:900;color:var(--ink);letter-spacing:-.01em}
.factk{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-top:3px}
.sheetwarn{margin-top:16px;padding-left:12px;border-left:2px solid var(--warm);font-size:13.5px;line-height:1.55;color:var(--warmsoft)}
.sheeting{font-size:14.5px;line-height:1.65;color:var(--sub);margin-top:8px}
.sheetconds{font-size:13px;line-height:1.6;color:var(--muted2);margin-top:8px}
.flexbtn{margin-top:16px;background:none;border:1px solid var(--line3);color:var(--ink);padding:11px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.sheetcard>.cta{margin-top:24px}

/* ---- cook mode ---- */
#cook-overlay{position:fixed;inset:0;background:#0f141a;display:none;flex-direction:column;z-index:40;overflow:hidden}
#cook-overlay.show{display:flex;animation:lmpIn .2s ease both}
.cookhead{padding:calc(20px + env(safe-area-inset-top)) 22px 0;display:flex;align-items:center;gap:14px}
.quitb{background:none;border:none;color:var(--muted2);font-size:13px;font-weight:700;cursor:pointer;padding:0}
.stepdots{flex:1;display:flex;gap:4px}
.stepdots .dot{width:auto;flex:1;height:3px;border-radius:0}
.wakeb{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;padding:0;white-space:nowrap}
.wakeb.on{color:var(--mint)}
.cookbody{flex:1;overflow-y:auto;padding:34px 22px 22px}
.stepnum{font-size:70px;line-height:.85;font-weight:900;color:rgba(255,255,255,.09);letter-spacing:-.05em;margin-top:18px}
.steptext{font-size:22px;line-height:1.45;font-weight:500;letter-spacing:-.01em;margin-top:-16px}
.portionhint{font-size:14.5px;color:var(--muted2);margin-top:14px;line-height:1.6}
.portstepper{display:flex;align-items:center;gap:1px;margin-top:28px;background:var(--line3)}
.portstepper button{width:56px;height:56px;background:#0f141a;border:none;color:var(--mint);font-size:26px;font-weight:700;cursor:pointer}
.portval{flex:1;background:#0f141a;height:56px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.cookfoot{background:#0f141a;padding-bottom:calc(34px + env(safe-area-inset-bottom))}
.cookfoot.hlist{flex-direction:row;padding-top:1px}
.backb{background:#0f141a;border:none;color:var(--muted2);padding:19px 24px;font-size:15px;font-weight:700;cursor:pointer}
.cookfoot .cta{flex:1;padding:19px}

/* ---- toast ---- */
#toast{position:fixed;left:22px;right:22px;bottom:calc(100px + env(safe-area-inset-bottom));max-width:516px;margin:0 auto;
  background:var(--ink);color:#0f141a;padding:13px 16px;font-size:13.5px;font-weight:700;display:none;
  align-items:center;justify-content:space-between;gap:12px;z-index:50}
#toast.show{display:flex;animation:lmpUp .2s ease both}
#toast button{background:none;border:none;color:inherit;font:900 13px inherit;cursor:pointer;text-decoration:underline;white-space:nowrap}

button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
</style>
</head>
<body>
<noscript><p style="padding:24px;text-align:center">This app needs JavaScript to run — please enable it.</p></noscript>

<h1 class="vh">Lazy Meal Planner</h1>
<main id="main">
<div class="wrap tab" id="tab-tonight"></div>
<div class="wrap tab" id="tab-week"></div>
<div class="wrap tab" id="tab-shop"></div>
<div class="wrap tab" id="tab-fridge"></div>
<div class="wrap tab" id="tab-save"></div>
</main>

<nav id="tabbar" aria-label="Sections"></nav>
<div id="sheet-overlay" role="dialog" aria-modal="true" aria-label="Dish details" onclick="if(event.target===this)closeSheet()"></div>
<div id="cook-overlay" role="dialog" aria-modal="true" aria-label="Cook mode"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ CONDIMENT CORE ============ */
const CONDS = {
  soy:{n:"Soy sauce",jp:"国産しょうゆ（濃口）",p:322}, mirin:{n:"Mirin",jp:"本みりん 1L",p:416},
  sake:{n:"Cooking sake",jp:"料理酒 1L",p:225}, mentsuyu:{n:"Mentsuyu (3x)",jp:"めんつゆ 3倍濃縮",p:330},
  sesame:{n:"Sesame oil",jp:"ごま油",p:480},
  torigara:{n:"Chicken stock powder",jp:"鶏ガラスープの素",p:320}, dashi:{n:"Hondashi",jp:"ほんだし",p:350},
  roux:{n:"Curry roux",jp:"カレールー",p:320}, miso:{n:"Miso",jp:"味噌",p:425},
  mayo:{n:"Kewpie mayo",jp:"マヨネーズ",p:280}, garlic:{n:"Garlic paste",jp:"おろし生にんにく お徳用",p:376},
  ginger:{n:"Ginger paste",jp:"おろし生しょうが お徳用",p:376}, oil:{n:"Cooking oil",jp:"サラダ油",p:450},
  katakuriko:{n:"Potato starch",jp:"片栗粉",p:200},
  panko:{n:"Panko breadcrumbs",jp:"パン粉",p:150},
  pepper:{n:"Black pepper",jp:"ブラックペッパー",p:130},
  ponzu:{n:"Ponzu",jp:"ポン酢",p:342}
};
/* ============ INGREDIENTS ============ */
const ING = {
  chicken:{n:"Chicken thigh",jp:"鶏もも肉",u:"g",p:1.07,cat:"meat"},
  chickenbreast:{n:"Chicken breast",jp:"鶏むね肉",u:"g",p:1.05,cat:"meat"},
  pork:{n:"Pork komagire",jp:"豚こま切れ",u:"g",p:1.75,cat:"meat"},
  gpork:{n:"Ground pork",jp:"豚ひき肉",u:"g",p:1.95,cat:"meat"},
  bacon:{n:"Bacon",jp:"ベーコン",u:"g",p:2.5,cat:"meat"},

/* ============ RECIPES (qty per serving) ============ */
const RECIPES = [
 {id:"beansoup", tier:"A", n:"Bean & tomato soup", jp:"ミックスビーンズのトマトスープ", gear:["pot"], time:"20 min", eff:2, batch:true, cap:4, flex:true, freeze:"freezes perfectly",
  ing:[["mixedbeans",80],["cantomato",100],["onion",0.5],["carrot",0.3],["bacon",30]], rice:0.5, conds:["torigara","garlic","oil"],
  steps:["Per serving: dice half an onion and a third of a carrot small. Cut 30 g bacon into strips.","Pot on medium with 15 ml (1 tbsp) oil. Bacon in first for 1 min, then the onion and carrot for 3 min until the onion turns translucent.","Add per serving: 80 g mixed beans (drained), 100 g canned tomato, 200 ml water, 1 tsp chicken stock powder and a 1 tsp of garlic paste.","Bring to a boil, then simmer on medium-low 12 min with the lid sitting ajar. Stir once or twice.","Taste, and add salt only if it needs it. Serve with a bowl of rice. Four servings keeps 4 days in the fridge and a month in the freezer, and it is better on day two."]},
 {id:"belachan", tier:"A", n:"Belachan steamed chicken breast", jp:"よだれ鶏（ベラチャン）", gear:["pot"], time:"10 min", eff:1, batch:true, cap:4, flex:true, freeze:"slices freeze well",
  ing:[["chickenbreast",150],["cucumber",0.3],["negi",0.2]], rice:0.5, conds:["sesame","soy","ginger"],
  steps:["Per serving: 150 g chicken breast into the pot with enough cold water to cover it by 2 cm, plus 1 tsp of ginger paste and the green tops of the green onion.","Bring it to a boil, then turn the heat OFF completely and put the lid on. Leave it 15 min. Poaching off-heat is the whole trick — breast turns dry and stringy the moment it actually boils.","Check the thickest part is white all the way through. Lift it out, rest 5 min, slice 1 cm thick across the grain.","Sauce, per serving: 1 tsp of your belachan + 15 ml (1 tbsp) soy sauce + 5 ml (1 tsp) sesame oil, mixed in a small bowl.","Over rice with sliced cucumber and the white of the green onion. Make all 4 servings at once — it keeps 3 days and is genuinely good cold, so it doubles as a fridge raid. Keep the poaching water: that is chicken stock."]},
 {id:"butadaikon", tier:"A", n:"Pork & daikon simmer", jp:"豚バラ大根", gear:["pot"], time:"30 min", eff:2, batch:true, cap:4, flex:true,
  ing:[["pork",100],["daikon",150]], rice:0.5, conds:["soy","mirin","sake","ginger","sesame"],
  steps:["Per serving: peel 150 g daikon and cut into 2 cm half-moons. Cut 100 g pork bite-size.","Pot on medium, 5 ml (1 tsp) sesame oil. Pork first until it changes colour, then daikon, 2 min.","Add per serving: 200 ml water + 22 ml (1.5 tbsp) soy + 15 ml (1 tbsp) each mirin and sake + 1 tsp ginger paste.","Lid slightly ajar, medium-low, 20 min. Done when the daikon is translucent and a chopstick slides through.","Heat off, rest 10 min — daikon drinks the sauce as it cools. Keeps 3 days and improves daily."]},
 {id:"butadon", tier:"A", n:"Butadon (pork bowl)", jp:"豚丼", gear:["pan","rice"], time:"12 min", eff:1, batch:true, cap:4, crowd:"full", freeze:"topping freezes well",
  ing:[["pork",120],["onion",0.5]], rice:0.5, conds:["soy","mirin","sake","dashi","ginger"],
  steps:["Slice half an onion per serving into thin wedges.","In the pan, per serving: 100 ml water + 30 ml (2 tbsp) each of soy, mirin, and sake + half a tsp hondashi + 1 tsp ginger paste. Bring to a boil.","Add the onion, medium heat 3 min until soft and see-through.","Add 120 g pork, separating the slices with chopsticks so they do not clump. 4–5 min, spooning off the grey foam.","Over rice. Make 3–4 servings of topping at once: 3 days fridge, 1 month freezer. Identical method to gyudon at roughly half the cost — beef is the priciest protein there is."]},
 {id:"curry", tier:"A", n:"Japanese curry", jp:"カレーライス", gear:["pot","rice"], time:"30 min", eff:2, batch:true, cap:4, flex:true, freeze:"freeze without potato",
  ing:[["chicken",120],["onion",0.5],["carrot",0.3],["potato",0.8]], rice:0.5, conds:["roux","oil"],
  steps:["Cut, per serving: half an onion into thick wedges, a third of a carrot into chunky pieces, 1 small potato into quarters, 120 g chicken into bite-size pieces.","Pot on medium-high with 15 ml (1 tbsp) oil. Brown the chicken ~2 min, then add all the vegetables and stir 2 min.","Add water to just cover everything (roughly 200 ml per serving). Bring to a boil, spoon off the grey foam, then lid on and simmer on medium-low 15 min — done when a chopstick slides into a potato easily.","Turn the heat OFF. Drop in 1 roux block (25 g) per serving and stir until fully melted — adding roux off-heat stops it clumping.","Heat back on low for 5 min, stirring so the bottom does not catch, until it is thick like gravy. Serve over rice from the cooker."]},
 {id:"keema", tier:"A", n:"Keema curry", jp:"キーマカレー", gear:["pot","rice"], time:"20 min", eff:2, batch:true, cap:4, flex:true, freeze:"freezes perfectly",
  ing:[["gpork",60],["lentil",40],["onion",0.5],["cantomato",100],["fveg",50]], rice:0.5, conds:["roux","garlic","ginger","oil"],
  steps:["Dice half an onion per serving as small as you can manage. Pot or deep pan on medium with 15 ml (1 tbsp) oil, 1 tsp each garlic and ginger paste, and the onion — fry ~3 min until it turns translucent.","Add 60 g ground pork per serving. Break it apart with the spatula and fry until no pink remains.","Add 100 g canned tomato + 40 g red lentils + 50 g frozen veg + 150 ml water per serving. Simmer on medium-low 15 min, stirring now and then — the lentils collapse into the sauce and thicken it for you. Splash in more water if it tightens too far.","Heat OFF, melt in 1 roux block (25 g) per serving. Back on low ~2 min until thick.","Serve over rice. Once cool, portion into containers: 3 days fridge, 1 month freezer."]},
 {id:"nikujaga", tier:"A", n:"Nikujaga (meat & potato stew)", jp:"肉じゃが", gear:["pot"], time:"25 min", eff:2, batch:true, cap:4, flex:true,
  ing:[["pork",100],["potato",1.2],["onion",0.5],["carrot",0.3]], rice:0.5, conds:["mentsuyu"],
  steps:["Cut, per serving: 1 potato into quarters, half an onion into wedges, a third of a carrot into chunks.","Pot on medium-high, 5 ml (1 tsp) oil, brown 100 g pork per serving for about 1 min.","Add the vegetables, then water to ALMOST cover (~150 ml per serving) plus 40 ml mentsuyu per serving (ratio: 1 part mentsuyu to 4 parts water).","Bring to a boil, skim the foam, then lid slightly ajar and simmer medium-low 15–20 min until a fork goes into the potato with no resistance.","Heat off and rest 10 min before eating — it soaks up flavour as it cools. Genuinely better tomorrow."]},
 {id:"soboro", tier:"A", n:"Soboro don (meat & egg)", jp:"そぼろ丼", gear:["pan","rice"], time:"12 min", eff:1, batch:true, cap:4, flex:true, crowd:true, freeze:"soboro freezes well",
  ing:[["gpork",120],["egg",2]], rice:0.5, conds:["soy","mirin","sake","ginger"],
  steps:["Start with a COLD pan: add 120 g ground meat + 15 ml (1 tbsp) each soy, mirin, sake + 1 tsp ginger paste per serving. Mix it all together before turning on the heat — this is the no-clump trick.","Now medium heat, stirring constantly with chopsticks (2 or 3 held together work best) until the meat is fine, crumbly, and the liquid has cooked off — about 5 min. Scoop out.","Eggs: beat 2 per serving, same pan on LOW, stir gently into soft scrambled curds, ~1 min.","Rice bowl: meat over one half, egg over the other. The meat soboro keeps 3 days in the fridge, or a month in the freezer — future-you eats in 2 minutes. Cooked ground meat is the one leftover not to push past 3 days."]},
 {id:"tonjiru", tier:"A", n:"Tonjiru (pork miso soup) + rice", jp:"豚汁", gear:["pot","rice"], time:"20 min", eff:2, batch:true, cap:4,
  ing:[["pork",80],["daikon",80],["carrot",0.3],["onion",0.3],["negi",0.2]], rice:0.5, conds:["miso","dashi","sesame"],
  steps:["Cut, per serving: 80 g pork into bite-size pieces, 80 g daikon into thin quarter-slices, a third each of carrot (half-moons) and onion (wedges).","Pot on medium, 5 ml (1 tsp) sesame oil. Fry the pork first, then the vegetables, 2–3 min.","Add 300 ml water + half a tsp hondashi per serving. Simmer 10–15 min until the daikon turns translucent.","Heat OFF. Put 18 g (1 tbsp) miso per serving in a ladle, dissolve it in the ladle with some broth, then stir through — boiling miso kills its flavour, so always off-heat.","Sliced green onion on top. Serve with a bowl of rice — this is a full meal."]},
 {id:"hainan", tier:"B", cookin:true, n:"Rice-cooker Hainanese chicken rice", jp:"炊飯器カオマンガイ", gear:["rice"], time:"5 min prep", eff:1, batch:true, cap:2,
  ing:[["chickenbreast",150],["cucumber",0.3]], rice:1, conds:["torigara","ginger","garlic","sesame","soy"],
  steps:["Per serving: rinse 150 g rice (1 rice-cooker cup) in cold water, swishing with your hand, until the water runs mostly clear — about 3 changes of water. Drain, into the cooker.","Add water to just UNDER the 1-cup line (the chicken will release juice). Stir in 1 tsp (3 g) chicken stock powder + a 1 tsp each of garlic and ginger paste.","Lay the chicken breast on top. Do not stir it in. Close the lid, press cook (normal white-rice mode).","When it beeps (~50 min), lift the chicken onto a cutting board, rest it 5 min, then slice into 1 cm strips across the grain. Breast is the traditional cut for this dish, and the cooker’s gentle steam is exactly what keeps it from drying out.","Sauce: mix 15 ml (1 tbsp) soy sauce + 5 ml (1 tsp) sesame oil in a small bowl. Slice a third of a cucumber. Chicken and sauce over the rice."]},
 {id:"kimchirice", tier:"B", cookin:true, n:"Pork-kimchi rice cooker rice", jp:"豚キムチ炊き込みご飯", gear:["rice"], time:"5 min prep", eff:1, batch:true, cap:2, flex:true,
  ing:[["pork",100],["kimchi",80]], rice:1, conds:["torigara","sesame"],
  steps:["Per serving: rinse 150 g rice, drain, into the cooker. Water to just under the 1-cup line.","Stir in 1 tsp (3 g) chicken stock powder.","Pile 100 g pork and 80 g kimchi — including its juice — on top of the rice. No stirring. Press cook.","When it beeps, fluff everything together and drizzle 5 ml (1 tsp) sesame oil per serving. A dab of your belachan on top works."]},
 {id:"takikomi", tier:"B", cookin:true, n:"Chicken & mushroom takikomi gohan", jp:"炊き込みご飯", gear:["rice"], time:"7 min prep", eff:1, batch:true, cap:2,
  ing:[["chicken",80],["shimeji",50],["carrot",0.3]], rice:1, conds:["mentsuyu"],
  steps:["Per serving: rinse 150 g rice until the water runs mostly clear, drain, into the cooker.","Add water to the 1-cup line, then scoop OUT 45 ml (3 tbsp). Add 45 ml (3 tbsp) mentsuyu in its place.","Cut 80 g chicken into 2 cm pieces. Cut the tough base off the shimeji and tear the clump apart by hand. Slice a third of a carrot into thin half-moons.","Scatter chicken, shimeji, and carrot on TOP of the rice — do not stir, sitting on top is correct. Press cook.","When it beeps, fluff with the paddle and let it rest 5 min with the lid open a crack. Leftovers: press into balls while warm, wrap, freeze."]},
 {id:"tomatorice", tier:"B", cookin:true, n:"Rice-cooker tomato & tuna rice", jp:"炊飯器トマトツナご飯", gear:["rice"], time:"5 min prep", eff:1, batch:true, cap:2,
  ing:[["tomato",1],["tuna",0.5],["onion",0.25]], rice:1, conds:["torigara","soy","pepper"],
  steps:["Per serving: rinse 150 g rice, into the cooker, water to just UNDER the 1-cup line (the tomato adds liquid).","Stir in 1 tsp chicken stock powder + half a drained tuna can + a quarter onion, diced.","Core the tomato (cut a small cone out of the stem end) and sit it whole in the middle of the rice. It looks wrong; it is right.","Press cook. When it beeps, smash the tomato with the paddle and mix everything through.","Season: 5 ml (1 tsp) soy + black pepper. Freezes well in portions."]},
 {id:"afsalmon", tier:"C", n:"Air-fryer salmon set", jp:"焼き鮭定食", gear:["air","rice"], time:"3 min work", eff:0, batch:false, cap:2,
  ing:[["salmon",1],["fbroc",80]], rice:0.5, conds:["mayo"],
  steps:["Put the salted salmon fillet straight into the basket, skin side down. No oil, no seasoning — 塩鮭 is pre-salted. Frozen salted fillets cost less than the fresh counter and behave identically here.","Preheat 3 min at 180 °C, then 10–12 min. Done when the thickest part flakes apart when pushed with a fork — check through the window, because opening the drawer pauses the timer and drops the heat.","For the last 5 min, drop 80 g frozen broccoli next to it.","Plate with rice and a dab of Kewpie. The laziest real meal in Japan."]},
 {id:"afteriyaki", tier:"C", n:"Air-fryer teriyaki chicken", jp:"照り焼きチキン", gear:["air","rice"], time:"5 min work", eff:1, batch:true, cap:2,
  ing:[["chicken",150],["fbroc",80]], rice:0.5, conds:["soy","mirin","garlic"],
  steps:["Cut 150 g chicken thigh per serving into 4–5 big chunks.","Marinade, per serving: 15 ml (1 tbsp) soy + 15 ml (1 tbsp) mirin + 1 tsp garlic paste. Toss the chicken in it — 10 min minimum, overnight is better. Batch extra portions in freezer bags now, thank yourself later.","Preheat 3 min at 180 °C. Chicken in a single layer, skin up, 15 min total. Two servings fills the 4.2 L basket properly; a third would stack and steam.","At the 10-minute mark, scatter 80 g frozen broccoli around the chicken (straight from frozen).","Done when the juices run clear when you poke the thickest piece (or 75 °C inside). Rice from the cooker."]},
 {id:"karaage", tier:"C", n:"Air-fryer karaage", jp:"唐揚げ", gear:["air","rice"], time:"10 min work", eff:1, batch:true, cap:2, freeze:"freeze marinated raw",
  ing:[["chicken",150],["cabbage",50]], rice:0.5, conds:["soy","garlic","ginger","katakuriko","oil"],
  steps:["Cut 150 g chicken thigh per serving into 4 cm chunks — keep the skin on.","Marinade, per serving: 15 ml (1 tbsp) soy + 1 tsp each garlic and ginger paste. 15 min minimum. Extra portions: freeze raw in the marinade, in bags; thaw overnight in the fridge.","Tip ~15 g potato starch onto a plate. Roll each chunk until it is dusted white on every side.","Pat 5 ml (1 tsp) oil over the dusted pieces with your fingers — never aerosol spray, it strips the ceramic coating. Dry starch stays pale and floury.","Preheat 3 min at 190 °C. Single layer with gaps: 8 min, flip every piece, 5 more min. Golden outside, juices clear inside = done. Two servings is the honest limit of the 4.2 L basket.","Shredded cabbage + rice. Squeeze of mayo optional but encouraged."]},
 {id:"afroast", tier:"C", n:"Air-fryer chicken & potato roast", jp:"鶏とじゃがいものバスケットロースト", gear:["air"], time:"5 min work", eff:1, batch:true, cap:2, freeze:"freeze raw in the marinade",
  ing:[["chicken",150],["potato",1],["onion",0.5]], conds:["oil","soy","pepper"],
  steps:["Per serving: cut 150 g chicken thigh into 4 big chunks, 1 potato into 2 cm cubes, half an onion into thick wedges. Leave the potato skin on — it is where the crisp comes from.","In a bowl, toss all of it with 5 ml (1 tsp) oil, 15 ml (1 tbsp) soy sauce and a heavy grind of black pepper. Coat the potato properly or it turns leathery.","Preheat 3 min at 200 °C. Tip everything in as one layer — two servings is the honest limit of the 4.2 L basket.","200 °C for 20 min. Pull the basket out at the 10-minute mark and shake it once, then watch the potato edges go gold through the window.","Done when a chopstick slides into a potato and the chicken juices run clear. No rice needed, the potato is the carb — and the only thing to wash is the basket, which goes in the dishwasher."]},
 {id:"afbreast", tier:"C", n:"Air-fryer pepper chicken breast", jp:"鶏むね肉の胡椒焼き", gear:["air","rice"], time:"3 min work", eff:1, batch:true, cap:2,
  ing:[["chickenbreast",150],["fbroc",80]], rice:0.5, conds:["oil","pepper","soy"],
  steps:["Per serving: cut 150 g chicken breast into 3 cm slabs. Thick pieces stay juicy; thin ones turn to chalk.","Rub each piece with 5 ml (1 tsp) oil and a lot of black pepper. That is the entire prep.","Preheat 3 min at 180 °C. Breast in one layer, 12 min, flipping once at 6 min. 180 °C and not 200 °C — breast is lean and high heat dries it out.","Cut into the thickest slab to check: no pink anywhere and the juices run clear (75 °C inside). Thicker pieces want another 2–3 min — every machine runs slightly differently.","Scatter 80 g frozen broccoli around it for the last 5 min, straight from the freezer.","Rest 3 min before slicing, then 5 ml (1 tsp) soy over the top. Rice from the cooker. Breast is the cheapest protein in the shop, and this is the leanest dinner in the roster."]},
 {id:"afkatsu", tier:"C", n:"Air-fryer chicken katsu", jp:"鶏カツ", gear:["air","rice"], time:"10 min work", eff:1, batch:true, cap:1, freeze:"freeze breaded, uncooked",
  ing:[["chicken",150],["egg",0.5],["cabbage",50]], rice:0.5, conds:["katakuriko","panko","oil","mayo","soy"],
  steps:["Per serving: butterfly 150 g chicken thigh open so it lies flat and even. Even thickness is what makes or breaks a katsu.","Set out three stations: potato starch on a plate, a beaten egg in a bowl, 30 g panko on a second plate. Dust with starch, dip in egg, then press the panko on hard — pressing is what stops it falling off in the basket.","Pat 5 ml (1 tsp) oil over the crumbs with your fingers until no white powder is left. Never aerosol spray: it strips the ceramic coating, and dry panko stays pale.","Preheat 3 min at 190 °C. One cutlet, flat, with nothing touching it: 8 min, flip, 5 min more. Breaded food is the one dish that needs the basket to itself — a second serving is a second round.","Done when the crumb is deep gold and the juices run clear where you cut into the thickest part (75 °C inside). Pale crumb means it needs longer, not hotter.","Slice into 2 cm strips, shredded cabbage alongside, rice from the cooker. Mayo and soy sauce mixed 1:1 is a passable tonkatsu sauce."]},
 {id:"afgyoza", tier:"C", n:"Air-fryer frozen gyoza set", jp:"冷凍餃子（エアフライヤー）", gear:["air","rice"], time:"5 min work", eff:0, batch:false, cap:2,
  ing:[["gyoza",300],["cabbage",50]], rice:0.5, conds:["oil","soy","sesame"],
  steps:["10–12 frozen gyoza per serving, straight from the freezer into the basket, flat side down, in one layer with gaps. No thawing, no water, no lid.","Wipe about 5 ml (1 tsp) oil over the tops so the wrappers blister instead of drying out.","Preheat 3 min at 190 °C, then 10 min. No flipping, no steaming step, no pan to scrub — this is why the fryer earns its counter space.","From minute 8, watch through the window: done when the wrappers are blistered gold and the edges have gone crisp.","Dip: 15 ml (1 tbsp) soy + a drop of sesame oil, and belachan if you want fire. Shredded cabbage and rice on the side."]},
 {id:"aftofu", tier:"C", n:"Air-fryer crispy tofu with ponzu", jp:"揚げ出し豆腐風", gear:["air","rice"], time:"5 min work", eff:1, batch:false, cap:2,
  ing:[["tofu",1],["negi",0.2]], rice:0.5, conds:["katakuriko","oil","ponzu","sesame"],
  steps:["Per serving: press one block of firm tofu — wrap it in kitchen paper, sit a plate on top, leave it 10 min. Wet tofu steams, pressed tofu crisps. That is the whole recipe.","Cut it into 8 cubes and roll them in about 15 g potato starch until dusted white on every side. Handle them like eggs, they break.","Preheat 3 min at 200 °C. Cubes in one layer, not touching, with 5 ml (1 tsp) oil patted over the tops.","200 °C for 12 min, shaking the basket gently at the 8-minute mark.","Golden and firm outside means done. Onto rice, ponzu poured over, sliced green onion and a drop of sesame oil on top. Under ¥200 a serving with no meat at all."]},
 {id:"butashabu", tier:"D", n:"Pork shabu & cabbage with ponzu", jp:"豚しゃぶポン酢", gear:["pot"], time:"12 min", eff:1, kettle:true, batch:false, cap:2,
  ing:[["pork",100],["cabbage",150],["moyashi",100]], rice:0.5, conds:["ponzu","sesame"],
  steps:["Tear 150 g cabbage per serving into pieces, rinse the bean sprouts. Boil water in the pot, drop both in for 2 min, scoop out onto your plate as a bed.","Turn the heat DOWN until the water barely bubbles — a rolling boil makes pork tough; small lazy bubbles keep it tender.","Lower 100 g pork slices in one at a time. Each needs only 30–40 seconds — when no pink remains, it is done.","Lift the pork onto the cabbage bed. Pour ponzu over everything + 5 ml (1 tsp) sesame oil.","Rice on the side. No oil, no frying, and the pot only touched water — easiest washing-up in the database."]},
 {id:"curryudon", tier:"D", n:"Curry udon", jp:"カレーうどん", gear:["pot"], time:"10 min", eff:1, kettle:true, batch:false, cap:2,
  ing:[["udon",200],["pork",50],["negi",0.2]], conds:["mentsuyu","roux"],
  steps:["Pot: 300 ml water + 40 ml mentsuyu per serving. Boil, add 50 g pork slices, 1 min, skim the foam.","Frozen udon straight in, 2 min, loosen with chopsticks.","Heat OFF. Melt in 1 roux block (25 g) per serving, stirring until smooth.","Back on LOW ~1 min until it thickens — keep stirring, roux + noodles love to stick to the bottom.","Green onion on top. Warning from experience: curry udon splashes — lean over the pot."]},
 {id:"nabe", tier:"D", n:"Chicken mizutaki nabe", jp:"水炊き鍋", gear:["pot"], time:"20 min", eff:1, kettle:true, batch:true, cap:2,
  ing:[["chicken",150],["cabbage",150],["tofu",0.5],["shimeji",50]], rice:0.5, conds:["dashi","ponzu"],
  steps:["Cut, per serving: 150 g chicken into chunks, 150 g cabbage into big squares, half a tofu block into large cubes, shimeji torn apart.","Pot: 400 ml water + 1 tsp hondashi per serving. Bring to a boil.","Chicken in first. 5 min, spooning off the foam that rises.","Everything else on top. Lid on, medium, 8–10 min until the cabbage is soft.","Pour some ponzu into a small bowl and dip each bite. Night two: drop cooked rice + a beaten egg into the leftover broth, 3 min = zōsui, a free second recipe."]},
 {id:"tompasta", tier:"D", n:"One-pot tomato bacon pasta", jp:"ワンポットトマトパスタ", gear:["pot"], time:"15 min", eff:1, kettle:true, batch:false, cap:2,
  ing:[["pasta",100],["bacon",50],["cantomato",200],["onion",0.3]], conds:["torigara","garlic","oil"],
  steps:["Per serving: cut 50 g bacon into strips, dice a third of an onion.","Pot on medium, 5 ml (1 tsp) oil. Bacon + onion + 1 tsp garlic paste, fry 2 min.","Add 200 g canned tomato + 250 ml water + 1 tsp chicken stock powder per serving. Bring to a boil.","Snap 100 g pasta in half and push it in. Stir every 2 min or so — one-pot pasta sticks if ignored.","Simmer about 10 min (check 1 min before the packet time) until the pasta is done and the sauce clings. Taste; add salt if flat."]},

const EAT_OUT = 1000;
const GEARLABEL = {rice:"rice cooker", pot:"pot", pan:"pan", air:"air fryer"};
const yen = x => (x<0?"−":"")+"¥"+Math.abs(Math.round(x)).toLocaleString();
const rec = id => RECIPES.find(r=>r.id===id);
const baseMeat = r => (r.ing.find(([id])=>ING[id].cat==="meat")||[null])[0];
const keepDaysOf = r => r.ing.some(([id])=>id==="gpork") ? 3 : 4;
const cap1 = s => s.charAt(0).toUpperCase()+s.slice(1);
const EFFORTS = [
  {k:0, jp:"2分", en:"Zero effort", sub:"Open a can, or boil one pot."},
  {k:1, jp:"15分", en:"Something quick", sub:"One pot, one wash."},
  {k:2, jp:"45分", en:"Batch day", sub:"Cook once, eat four times."}
];

/* ============ STATE (persisted) ============ */
let S = {};
try { S = JSON.parse(localStorage.getItem("lmp")||"{}"); } catch(e) { S = {}; }
if (typeof S !== "object" || S === null || Array.isArray(S)) S = {};
const isObj = x => x && typeof x === "object" && !Array.isArray(x);
S.owned = isObj(S.owned) ? S.owned : {oil:true};
S.locked = Array.isArray(S.locked) ? S.locked : [];
S.bought = isObj(S.bought) ? S.bought : {};
S.protein = isObj(S.protein) ? Object.fromEntries(Object.entries(S.protein).filter(([k,v])=>typeof v==="string" && ING[v])) : {};
/* every field the log renderer touches is checked here: a bad entry used to brick the app on every load */
S.log = Array.isArray(S.log) ? S.log.filter(l=>isObj(l) && typeof l.d==="string" && Number.isFinite(l.spent) && Number.isFinite(l.meals)) : [];
S.N = Number.isInteger(S.N) && S.N>=1 && S.N<=14 ? S.N : 7;
S.v = [1,2,3].includes(S.v) ? S.v : 2;
S.tab = ["tonight","week","shop","fridge","save"].includes(S.tab) ? S.tab
  : (S.tab==="plan" ? "week" : "tonight"); /* migrate from the old tab set: plan->week, cook/anything else->tonight */
S.price = isObj(S.price) ? Object.fromEntries(Object.entries(S.price).filter(([k,v])=>ING[k] && typeof v==="number" && isFinite(v) && v>0)) : {};
S.mugi = S.mugi === true;
S.day = Number.isInteger(S.day) && S.day>=0 ? S.day : 0;
S.fridge = Array.isArray(S.fridge) ? S.fridge.filter(f=>isObj(f) && typeof f.id==="string" && !!rec(f.id) && Number.isInteger(f.portions) && f.portions>0 && Number.isInteger(f.day) && f.day>=0) : [];
/* a cooked-on day from the future would render negative ages — pull it back to today */
S.fridge.forEach(f=>{ if (f.day > S.day) f.day = S.day; });
/* legacy fields from older saves: dropped, never resurrected */
delete S.stepdone; delete S.kit; delete S.aircap;
if (S.plan !== undefined) { S.plan = Array.isArray(S.plan) ? S.plan.filter(x=>typeof x==="string") : undefined; if (S.plan && !S.plan.length) S.plan = undefined; }
function save(){ try { localStorage.setItem("lmp", JSON.stringify(S)); } catch(e) {} }
const priceOf = id => S.price[id] !== undefined ? S.price[id] : ING[id].p;

/* ============ EPHEMERAL UI STATE (not persisted — resets on load) ============ */
let U = { effort:null, heroIdx:0, sheet:null, cook:null, step:0, portions:2, toast:null, _toastTimer:null };
/* inline handlers can only see globals, and a script-scoped `let` is not one — so the panel's
   open state is written through a function, or it silently collapses on the next render */
let priceOpen = false;
function setPriceOpen(v){ priceOpen = !!v; }

/* ============ TOAST (carries a 1-level undo for anything destructive) ============ */
function flash(msg, undoFn){
  clearTimeout(U._toastTimer);
  U.toast = { msg, undo: undoFn || null };
  render();
  U._toastTimer = setTimeout(()=>{ U.toast = null; render(); }, undoFn ? 6000 : 2200);
}
function runToastUndo(){
  if (U.toast && U.toast.undo) { const fn = U.toast.undo; U.toast = null; clearTimeout(U._toastTimer); fn(); }
}

/* ============ ACTIONS ============ */
function setTab(t){ S.tab=t; save(); render(); try{ scrollTo(0,0); }catch(e){} }
function stepMeals(d){
  S.N = Math.min(14, Math.max(1, S.N+d)); save();
  if (!S.plan) { render(); return; }
  /* reshuffle when short-week mode would exclude something already picked, or when there are
     now more dishes than meals — otherwise a dish ends up at ×0 servings and ¥0 of groceries */
  const mustReshuffle = (S.N<=2 && S.plan.some(id=>{ const r = rec(id); return r && r.batch; }))
    || S.plan.length > S.N;
  plan(mustReshuffle ? true : "keep");
}
function setVariety(v){ S.v=v; save(); plan(true); }
function eligible(){ return RECIPES; }
function plan(reshuffle){
  const N = S.N, v = S.v;
  const short = N<=2;
  const k = short ? N : v===1 ? 1 : v===2 ? Math.min(3, Math.max(2, Math.ceil(N/3))) : Math.min(N, 6);
  let pool = eligible();
  if (short) pool = pool.filter(r=>!r.batch);
  else if (v===1) pool = pool.filter(r=>r.batch);
  const locked = pool.filter(r=>S.locked.includes(r.id)).slice(0,k);
  let picks = [...locked];
  let undid = false, prevPlan = null;
  if (reshuffle!=="keep" || !S.plan) {
    if (S.plan) { prevPlan = { plan:[...S.plan], bought:{...S.bought} }; undid = true; }
    S.bought = {};
    const rest = pool.filter(r=>!picks.some(p=>p.id===r.id)).sort(()=>Math.random()-.5);
    rest.sort((a,b)=> (N/k>=3 ? (b.batch?1:0)-(a.batch?1:0) : 0));
    if (v===1) rest.sort((a,b)=> (b.cap||0)-(a.cap||0));
    while (picks.length<k && rest.length) picks.push(rest.shift());
    S.plan = picks.map(r=>r.id);
  }
  save(); render();
  if (undid) flash("New week generated", ()=>{ S.plan=prevPlan.plan; S.bought=prevPlan.bought; save(); render(); });
}
function swap(id){
  let pool = eligible().filter(r=>!S.plan.includes(r.id));
  if (S.N<=2) pool = pool.filter(r=>!r.batch);
  else if (S.v===1) pool = pool.filter(r=>r.batch);
  if (!pool.length) return;
  const nu = pool[Math.floor(Math.random()*pool.length)];
  const prevPlan = [...S.plan], prevLocked = [...S.locked];
  S.plan = S.plan.map(x=>x===id?nu.id:x);
  S.locked = S.locked.filter(x=>x!==id);
  save(); render();
  flash("Swapped in "+nu.n, ()=>{ S.plan=prevPlan; S.locked=prevLocked; save(); render(); });
}
function lock(id){
  S.locked = S.locked.includes(id) ? S.locked.filter(x=>x!==id) : [...S.locked, id];
  save(); render();
}
function toggleCond(id){ S.owned[id]=!S.owned[id]; save(); render(); }
function toggleBought(id){ S.bought[id]=!S.bought[id]; save(); render(); }
function clearTicks(){
  const prevBought = {...S.bought};
  S.bought={}; save(); render();
  flash("Basket ticks cleared", ()=>{ S.bought=prevBought; save(); render(); });
}
/* every entry must exist in ING - a stale key here poisons S.protein and blanks the app */
const MEATCYCLE = ["chicken","pork","gpork"];
function ingsOf(r){ return r.ing.map(([id,q])=> (r.flex && S.protein[r.id] && id===baseMeat(r)) ? [S.protein[r.id],q] : [id,q]); }
function cycleProtein(rid){
  const r = rec(rid), b = baseMeat(r);
  const cyc = MEATCYCLE.includes(b) ? MEATCYCLE : [b, ...MEATCYCLE];
  const cur = S.protein[rid]||b, nxt = cyc[(cyc.indexOf(cur)+1)%cyc.length];
  if (nxt===b) delete S.protein[rid]; else S.protein[rid]=nxt;
  save(); render();
}
function logWeek(){
  const el = document.getElementById("spentInput");
  const v = +el.value;
  if (!v || v<0 || !isFinite(v)) return;
  S.log.push({d:simDate().toISOString().slice(0,10), spent:v, meals:S.N});
  U._clearSpent = true;
  save(); render();
  flash("Logged "+yen(v)+" for "+S.N+" meals.");
}
function delLog(i){
  const l = S.log[i]; if (!l) return;
  const before = S.log.map(x=>({...x}));
  S.log.splice(i,1); save(); render();
  flash("Removed the "+l.d.slice(5)+" week.", ()=>{ S.log = before; save(); render(); });
}
function toggleMugi(){ S.mugi = !S.mugi; save(); render(); }
function setPrice(id, v){
  v = +v;
  const it = ING[id];
  if (!it || !isFinite(v) || v<=0) { render(); return; }
  const p = it.u==="pc" ? v : v/100;
  if (Math.abs(p-it.p) < 1e-9) delete S.price[id]; else S.price[id] = p;
  save(); render();
}
function resetPrices(){
  const before = {...S.price};
  if (!Object.keys(before).length) return;
  S.price = {}; save(); render();
  flash("Prices back to defaults.", ()=>{ S.price = before; save(); render(); });
}
let wlock = null, wakeWanted = false;
async function toggleWake(){
  wakeWanted = !wakeWanted;
  try {
    if (!wakeWanted && wlock) { await wlock.release(); wlock = null; }
    else if (wakeWanted && navigator.wakeLock) {
      wlock = await navigator.wakeLock.request("screen");
      wlock.addEventListener("release", ()=>{ wlock = null; });
    }
  } catch(e) { wakeWanted = false; wlock = null; }
  render();
}
if (typeof document !== "undefined") {
  document.addEventListener("visibilitychange", async ()=>{
    if (document.visibilityState==="visible" && wakeWanted && !wlock && navigator.wakeLock) {
      try { wlock = await navigator.wakeLock.request("screen"); wlock.addEventListener("release", ()=>{ wlock = null; }); } catch(e){}
    }
  });
}

/* ---- fridge ---- */
const cloneFridge = () => S.fridge.map(f=>({...f}));
function eatFridge(i){
  const f = S.fridge[i]; if (!f) return;
  const r = rec(f.id), before = cloneFridge();
  f.portions -= 1;
  if (f.portions<=0) S.fridge.splice(i,1);

  save(); render();

}
function tossFridge(i){
  const f = S.fridge[i]; if (!f) return;
  const r = rec(f.id), before = cloneFridge();
  S.fridge.splice(i,1); save(); render();
  flash("Binned the "+r.n+". It happens.", ()=>{ S.fridge = before; save(); render(); });
}
function nextDay(){ S.day++; save(); render(); }

/* ---- tonight: effort + hero ---- */
function pickEffort(k){ U.effort=k; U.heroIdx=0; render(); }
function backToAsk(){ U.effort=null; render(); }
function nextHero(){ U.heroIdx++; render(); }
function initPortions(r, serv){ return r.cap ? Math.min(serv, r.cap) : serv; }
function openCookFromHero(rid){

}

/* ---- sheet ---- */
function openSheet(rid){ U.sheet = rid; render(); }
function closeSheet(){ U.sheet = null; render(); }

/* ---- cook mode ---- */
function startCook(rid, portions){ U.sheet=null; U.cook=rid; U.step=0; U.portions=portions; render(); }
function quitCook(){ U.cook=null; U.step=0; render(); }
function prevStep(){ if (U.step>0) U.step--; else U.cook=null; render(); }
function nextStep(){
  const r = rec(U.cook); if (!r) { U.cook=null; render(); return; }
  const last = U.step >= r.steps.length;
  if (!last) { U.step++; render(); return; }
  if (U.portions>0) S.fridge.push({id:r.id, portions:U.portions, day:S.day});
  const msg = U.portions>0 ? U.portions+" box"+(U.portions>1?"es":"")+" in the fridge. Future you is sorted." : "Eaten on the spot. Respect.";
  U.cook=null; U.step=0; U.effort=null; U.heroIdx=0;
  save(); render();
  flash(msg);
}
function portDec(){ U.portions = Math.max(0, U.portions-1); render(); }
function portInc(){ U.portions = Math.min(6, U.portions+1); render(); }

/* ============ DERIVED ============ */
function compute(){
  if (!S.plan) return null;
  const picks = S.plan.map(id=>rec(id)).filter(Boolean);
  if (!picks.length) return null;
  const N = S.N, servings = {};
  picks.forEach((r,i)=>{ servings[r.id] = Math.floor(N/picks.length) + (i < N%picks.length ? 1 : 0); });
  const g = {}; let riceGo = 0, mugiCups = 0;
  picks.forEach(r=>{
    const s = servings[r.id];
    riceGo += (r.rice||0)*s;
    if (S.mugi && !r.cookin) mugiCups += (r.rice||0)*s;
    ingsOf(r).forEach(([id,q])=>{ g[id]=(g[id]||0)+q*s; });
  });
  if (mugiCups > 0) g.mugi = (g.mugi||0) + mugiCups*50;
  let food = 0;
  const rows = Object.entries(g).map(([id,q])=>{
    const it = ING[id];
    const buy = it.u==="pc" ? Math.ceil(q) : Math.ceil(q/50)*50;
    const cost = buy*priceOf(id); food += cost;
    return {id, cat:it.cat, n:it.n, jp:it.jp, disp: it.u==="pc" ? buy+(buy>1?" pcs":" pc") : buy+" g", cost};
  });
  const needed = [...new Set(picks.flatMap(r=>r.conds))];
  return {picks, servings, N, rows, food, riceGo, mugiCups, needed};
}

function candidates(c){
  const eff = U.effort;
  const out = [];
  S.fridge.forEach((f,i)=>{ const r=rec(f.id); if (!r) return;
    out.push({kind:"fridge", r, idx:i, age:S.day-f.day, portions:f.portions, eff:0}); });
  const plan = c ? c.picks : [];
  plan.forEach(r=>out.push({kind:"cook", r, eff:r.eff, serv:c.servings[r.id]}));
  let list = out.filter(o=>o.eff<=eff);
  if (eff===2) list = out.filter(o=>o.kind==="cook"&&o.r.eff===2).concat(out.filter(o=>!(o.kind==="cook"&&o.r.eff===2)));
  else list.sort((a,b)=>(a.kind==="fridge"?-1:1)-(b.kind==="fridge"?-1:1) || b.eff-a.eff);
  if (!list.length) list = out;
  return list;
}

function gearTips(r, s){
  const t = [];
  const cp = r.cap;
  if (cp && s>cp) t.push(cp===1
    ? "This dish only works one serving at a time — do "+s+" quick rounds back-to-back."
    : "×"+s+" servings won't fit in one go — cook "+Math.ceil(s/cp)+" rounds of ~"+cp+".");
  if (r.crowd === "full") t.push("Four servings is brim-full in a 26 cm pan — if it looks like it will slop over the side, do two rounds.");
  else if (r.crowd) t.push("Doing 2+ servings at once? Split into rounds — a crowded 26 cm pan steams instead of sears.");
  return t;
}

/* ============ RENDER: Tonight ============ */
function todayMidnight(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
/* the app's own clock: real today, plus however many times "pretend it's tomorrow" was tapped.

function answeredHTML(c){

  }

function heroHTML(hero){
  const r = hero.r;
  let tag, why, cta, go;
  if (hero.kind==="fridge") {
    const kd = keepDaysOf(r), left = kd-hero.age;
    tag = 'Already cooked · <span lang="ja">冷蔵庫</span>';
    why = hero.portions+" portion"+(hero.portions>1?"s":"")+" in a box, cooked "+(hero.age===0?"today":hero.age+" day"+(hero.age>1?"s":"")+" ago")+". "+(left<=1?"Eat it today — the clock is up.":left+" days of goodwill left.");

function rhythmHTML(c){
  const bat = c.picks.filter(r=>r.batch && c.servings[r.id]>=3);
  const quick = c.picks.filter(r=>!bat.includes(r));
  const rounds = r => { if (!r.cap || c.servings[r.id]<=r.cap) return "";
    return r.cap===1 ? " One serving per run, so "+c.servings[r.id]+" quick rounds back to back."
      : " Your gear fits ~"+r.cap+" per run — "+Math.ceil(c.servings[r.id]/r.cap)+" rounds back to back."; };
  const rows = [];
  if (bat[0]) rows.push(["日 SUN", "All "+c.servings[bat[0].id]+" servings of "+bat[0].n+"."+(bat[0].freeze?" "+cap1(bat[0].freeze)+".":"")+rounds(bat[0])+" About 45 minutes."]);
  if (bat[1]) rows.push(["水 WED", "Top up with "+bat[1].n+"."+rounds(bat[1])+" About 30 minutes."]);
  bat.slice(2).forEach(r=>rows.push(["ALSO", "Batch "+r.n+" ("+c.servings[r.id]+" servings)."+rounds(r)]));

  if (!U.toast) return {show:false, html:""};
  let h = '<span>'+U.toast.msg+'</span>';
  if (U.toast.undo) h += '<button data-k="toastundo" onclick="runToastUndo()">Undo</button>';
  return {show:true, html:h};
}

/* ============ TOP-LEVEL RENDER ============ */
function render(){
  const ae = document.activeElement;
  const fk = ae && ae.dataset ? ae.dataset.k : null;
  /* tabs are replaced wholesale via innerHTML, which wipes anything half-typed.
     Keep the field being typed in, and always keep the free-text spend box. */
  const typedVal = (ae && ae.tagName==="INPUT" && fk) ? ae.value : null;
  const spentEl = document.getElementById("spentInput");
  const spentVal = spentEl ? spentEl.value : null;
  const c = compute();
  document.getElementById("tab-tonight").innerHTML = tonightHTML(c);
  document.getElementById("tab-week").innerHTML = weekHTML(c);
  document.getElementById("tab-shop").innerHTML = shopHTML(c);
  document.getElementById("tab-fridge").innerHTML = fridgeHTML();
  document.getElementById("tab-save").innerHTML = saveHTML();
  renderTabBar(c);
  ["tonight","week","shop","fridge","save"].forEach(t=>{
    document.getElementById("tab-"+t).className = "wrap tab"+(S.tab===t?" on":"");
  });
  const sh = sheetHTML(c);
  const sheetEl = document.getElementById("sheet-overlay");
  sheetEl.innerHTML = sh.html;
  sheetEl.classList.toggle("show", sh.show);
  const ck = cookHTML();
  const cookEl = document.getElementById("cook-overlay");
  cookEl.innerHTML = ck.html;
  cookEl.classList.toggle("show", ck.show);
  const ts = toastHTML();
  const toastEl = document.getElementById("toast");
  toastEl.innerHTML = ts.html;
  toastEl.classList.toggle("show", ts.show);
  document.querySelectorAll(".jp,.jpx").forEach(el=>el.setAttribute("lang","ja"));

  /* an overlay is modal: the page behind it takes no focus, no pointer, no scroll */
  const overlaid = sh.show || ck.show;
  ["main","tabbar"].forEach(id=>{
    const el = document.getElementById(id); if (!el) return;
    if (overlaid) el.setAttribute("inert",""); else el.removeAttribute("inert");
  });
  document.body.classList.toggle("noscroll", overlaid);

  /* put back what the user had typed, then where they were */
  if (U._clearSpent) { U._clearSpent = false; }
  else if (spentVal) { const el = document.getElementById("spentInput"); if (el) el.value = spentVal; }
  if (fk) {
    const el = document.querySelector('[data-k="'+fk+'"]');
    if (el) {
      if (typedVal !== null && el.tagName==="INPUT") el.value = typedVal;
      if (el.focus) el.focus();
    }
  }
  /* opening an overlay moves focus into it, or keyboard users stay stranded behind it */
  if (overlaid) {
    const box = ck.show ? cookEl : sheetEl;
    if (!box.contains(document.activeElement)) {
      const first = box.querySelector("button,input,[tabindex]");
      if (first && first.focus) first.focus();
    }
  }
}
/* Escape backs out of whatever is on top */
if (typeof document !== "undefined") {
  document.addEventListener("keydown", e=>{
    if (e.key !== "Escape") return;
    if (U.cook) { quitCook(); }
    else if (U.sheet) { closeSheet(); }
  });
}

/* last resort: a corrupt save must never leave a blank app with no way back, and must never
   leave one that fails again on every reload — so each attempt throws away strictly more */
try { render(); } catch (e) {
  delete S.plan; S.protein = {}; S.bought = {}; S.fridge = []; S.tab = "tonight";
  S.log = S.log.filter(l=>l && typeof l.d==="string" && Number.isFinite(l.spent) && Number.isFinite(l.meals));
  save();
  try { render(); } catch (e2) {
    try { localStorage.removeItem("lmp"); } catch (e3) {}
    S = {owned:{oil:true}, locked:[], bought:{}, protein:{}, log:[], N:7, v:2, tab:"tonight", price:{}, mugi:false, fridge:[], day:0};
    U = { effort:null, heroIdx:0, sheet:null, cook:null, step:0, portions:2, toast:null, _toastTimer:null };
    try { render(); } catch (e4) {
      document.getElementById("tab-tonight").className = "wrap tab on";
      document.getElementById("tab-tonight").innerHTML = '<div class="emptycard">Something went wrong, so your saved week was cleared. Reload and tap Generate my week.</div>';
    }
  }
}
</script>
