<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meals">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
<title>Lazy Meal Planner</title>
<meta name="description" content="One pot, one pan, a rice cooker and a 4.2 L air fryer: how much effort have you got tonight? Plan a week, shop at LIFE, cook it in as few rounds as the gear allows, and see what you save.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f141a; --ink:#eef2f5; --sub:#c3cfd9; --muted:#8b99a6; --muted2:#7d8b99; --dim:#6f7f8d; --faint:#43525f;
  --mint:#7fd4a8; --warm:#e8825a; --warmsoft:#f0c3ad;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14); --line3:rgba(255,255,255,.16);
  --row-off:#2a3542; --condoff:#5d6b78;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;
  font:16px/1.5 "Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}
body.noscroll{overflow:hidden;position:fixed;left:0;right:0;top:0;bottom:0}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
h1,h2,h3{margin:0;font-size:inherit;font-weight:inherit}
a{color:var(--mint)}
button{font-family:inherit}
::-webkit-scrollbar{width:0}
@keyframes lmpUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lmpIn{from{opacity:0}to{opacity:1}}
@keyframes lmpSheet{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 22px 34px;display:none}
.wrap.on{display:block;animation:lmpIn .22s ease both}

.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.eyebrow.mint{color:var(--mint)}
.bigrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--dim)}
.kicker.mint{color:var(--mint)}
.sectionlabel{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.bignum{font-size:52px;line-height:.9;font-weight:900;letter-spacing:-.04em}
.bignum.mint{color:var(--mint);font-size:56px;letter-spacing:-.045em}
.bignumlabel{font-size:13px;color:var(--muted2);font-weight:500;margin-top:6px}
.subline{font-size:13px;color:var(--muted2);font-weight:500;margin-top:8px}
.footnote{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.55;color:var(--muted2)}
.emptynote{border-top:1px solid var(--line);padding:34px 0;font-size:14.5px;color:var(--muted2);line-height:1.6}
.emptycard{text-align:center;color:var(--muted2);padding:44px 16px;font-size:15px;line-height:1.6}
.jp{color:var(--muted2)}

.hlist{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.hlist.row3,.hlist.row2{flex-direction:row}
/* structural only — never set background/color here, or it out-specifies .cta/.varon/.stepbtn/.logbtn */
.hlist>button{flex:1;border:none;cursor:pointer;font-family:inherit}

/* ---- tonight: effort picker ---- */
.hero1{font-size:38px;line-height:1.07;font-weight:900;letter-spacing:-.03em;margin-top:6px}
.effrow{display:flex;align-items:center;gap:18px;padding:20px 4px;text-align:left;width:100%;background:var(--bg);color:var(--ink);min-height:44px}
.effrow:active{background:#151d25}
.effjp{font-size:26px;font-weight:900;color:var(--mint);min-width:62px;letter-spacing:-.02em}
.effbody{flex:1;min-width:0;display:flex;flex-direction:column}
.effen{font-size:19px;font-weight:700;color:var(--ink)}
.effsub{font-size:13.5px;color:var(--muted2);margin-top:2px}
.arrow{color:var(--faint);font-size:20px}
.setupline{font-size:15px;color:var(--sub);line-height:1.6;margin-top:16px}
.setupline.mint{color:var(--mint)}
.setupline.warm{color:var(--warmsoft)}
body.cooking #toast{bottom:calc(128px + env(safe-area-inset-bottom))}

/* ---- tonight: answered ---- */
.backlink{background:none;border:none;color:var(--muted2);font-size:13px;font-weight:700;padding:10px 2px;margin-left:-2px;cursor:pointer;letter-spacing:.04em;min-height:44px;display:inline-flex;align-items:center}
.hero2{font-size:36px;line-height:1.06;font-weight:900;letter-spacing:-.03em;margin-top:8px}
.herojp{font-size:15px;margin-top:6px;font-weight:500}
.herowhy{font-size:15px;color:var(--sub);margin-top:20px;line-height:1.55;max-width:320px}
.herocta{margin-top:26px}
.herocta.hlist{flex-direction:row}
.cta{background:var(--mint);color:#0f141a;border:none;padding:17px 8px;font-size:16px;font-weight:900;cursor:pointer;letter-spacing:-.01em;width:100%}
.herocta .cta{flex:2}
.nah{background:var(--bg);color:var(--sub);border:none;padding:17px 20px;font-size:15px;font-weight:700;cursor:pointer;flex:1;white-space:nowrap}
.altrow{display:flex;align-items:center;gap:14px;padding:15px 4px;text-align:left;width:100%;background:var(--bg);color:var(--ink);min-height:44px}
.altrow:active{background:#151d25}
.altbody{flex:1;min-width:0;display:flex;flex-direction:column}
.altn{font-size:16px;font-weight:700;color:var(--ink)}
.altmeta{font-size:12.5px;color:var(--muted2);margin-top:1px}
.altbadge{font-size:12px;font-weight:700}
.altbadge.mint{color:var(--mint)}
.altbadge.muted{color:var(--muted2)}

/* ---- week ---- */
.stepbtn{width:46px;height:46px;font-size:24px;font-weight:700;color:var(--mint);background:var(--bg)}
.varon{background:var(--ink);color:#0f141a;padding:12px 6px;font-size:12.5px;font-weight:700;line-height:1.3}
.varoff{background:var(--bg);color:var(--muted2);padding:12px 6px;font-size:12.5px;font-weight:700;line-height:1.3}
.ghostbtn{width:100%;margin-top:14px;background:none;border:1px solid var(--line3);color:var(--ink);padding:15px;font-size:15px;font-weight:700;cursor:pointer}
.ghostbtn:active{background:#151d25}
.ghostbtn.small{width:auto;margin-top:10px;padding:10px 14px;font-size:13.5px}
.dividerlist{display:flex;flex-direction:column}
.dishrow{border-top:1px solid var(--line);padding:16px 0;display:flex;gap:14px;align-items:flex-start}
.dishnum{font-size:11px;font-weight:900;color:var(--muted2);padding-top:5px;min-width:16px}
.dishmain{flex:1;min-width:0}
.dishopen{background:none;border:none;padding:2px 0;text-align:left;cursor:pointer;display:block;width:100%;min-height:44px}
.dishname{display:block;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.dishjp{display:block;font-size:12.5px;margin-top:1px}
.dishmeta{font-size:12px;color:var(--muted);margin-top:8px;font-weight:500}
.dishacts{display:flex;gap:10px;margin-top:4px}
.dishacts button{background:none;border:none;padding:12px 10px;margin-left:-10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted2);white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
.dishserv{font-size:20px;font-weight:900;color:var(--mint);letter-spacing:-.02em}
.mugitoggle{background:none;border:1px solid var(--line3);color:var(--muted2);font-size:12px;font-weight:700;padding:10px;cursor:pointer;min-height:44px}
.mugitoggle.on{color:var(--mint);border-color:var(--mint)}
.schedrow{border-top:1px solid var(--line);padding:15px 0;display:flex;gap:16px}
.schedwhen{min-width:74px;font-size:12.5px;font-weight:900;color:var(--mint);letter-spacing:.02em;padding-top:2px}
.schedwhat{flex:1;font-size:14px;line-height:1.55;color:var(--sub)}

/* ---- shop ---- */
.progtrack{height:3px;background:var(--line);margin-top:18px}
.progfill{height:3px;background:var(--mint);transition:width .3s ease}
.clearlink{background:none;border:none;color:var(--muted2);font-size:12.5px;font-weight:700;padding:12px 0;cursor:pointer;min-height:44px}
.ghead2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:26px 0 2px}
.shoprow{width:100%;border:none;border-top:1px solid var(--line);background:none;display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;text-align:left}
.checkbox{width:20px;height:20px;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;color:#0f141a;font-size:12px;font-weight:900;flex:0 0 20px}
.checkbox.on{border-color:var(--mint);background:var(--mint)}
.shopmain{flex:1;min-width:0}
.shopn{display:block;font-size:15.5px;font-weight:700;color:var(--ink)}
.shopn.strike{text-decoration:line-through}
.shopjp{display:block;font-size:12px;margin-top:1px}
.shopamt{text-align:right}
.shopqty{display:block;font-size:14px;font-weight:700;color:var(--sub)}
.shopcost{display:block;font-size:12px;color:var(--muted2)}
details.detailsblock{margin-top:24px}
details.detailsblock summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;color:var(--ink);cursor:pointer;list-style:none;font-size:14.5px;border-top:1px solid var(--line);padding-top:18px}
details.detailsblock summary::-webkit-details-marker{display:none}
details.detailsblock summary::after{content:"▾";color:var(--muted2);font-size:13px;flex:0 0 auto}
details.detailsblock[open] summary::after{content:"▴"}
.detailsnote{color:var(--muted2);font-size:13px;line-height:1.55;margin:10px 0}
.pricerow{display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px;border-bottom:1px solid var(--line);padding:6px 0}
.pricerow:last-of-type{border-bottom:none}
.pricename{flex:1;min-width:0}
.priceunit{color:var(--muted2);font-size:12.5px;white-space:nowrap}
.pricerow input{width:82px;min-height:44px;background:var(--bg);border:1px solid var(--line3);color:var(--ink);font:15px inherit;padding:4px 8px;border-radius:0}

/* ---- shelf ---- */
.condgrid{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border-top:1px solid var(--line);padding-top:1px}
.condbtn{background:var(--bg);border:none;padding:13px;cursor:pointer;color:var(--condoff);font-size:13px;font-weight:700;flex:1 1 auto;min-height:44px}
.condbtn.on{color:var(--mint)}
/* ---- saved ---- */
.hlist.row2 input{flex:1;min-width:0;background:var(--bg);border:none;color:var(--ink);font:700 17px inherit;padding:15px 14px;outline:none}
.logbtn{background:var(--bg);border:none;color:var(--mint);font-size:14px;font-weight:900;padding:15px 20px;cursor:pointer;white-space:nowrap}
.logrow2{border-top:1px solid var(--line);padding:14px 0;display:flex;align-items:center;gap:12px}
.logd{font-size:12.5px;color:var(--muted2);min-width:44px;font-weight:700}
.logspent{font-size:14px;color:var(--sub);min-width:56px;font-weight:700}
.logbar{flex:1;height:6px;background:rgba(255,255,255,.07);display:block}
.logbar>span{display:block;height:6px;background:var(--mint)}
.logsaved{font-size:14px;font-weight:900;color:var(--mint)}
.logdel{background:none;border:none;color:var(--muted2);font-size:15px;cursor:pointer;padding:0;min-width:44px;min-height:44px}

/* ---- tab bar ---- */
nav#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;border-top:1px solid var(--line);
  background:rgba(15,20,26,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding-bottom:env(safe-area-inset-bottom);z-index:10;max-width:560px;margin:0 auto}
.tabbtn{flex:1;background:none;border:none;padding:11px 2px 15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.tabbtn.on{color:var(--mint)}
.tabjp{font-size:15px;font-weight:700;line-height:1}
.taben{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* ---- sheet ---- */
#sheet-overlay{position:fixed;inset:0;background:rgba(7,9,11,.7);display:none;align-items:flex-end;z-index:30}
#sheet-overlay.show{display:flex;animation:lmpIn .2s ease both}
.sheetcard{width:100%;max-width:560px;margin:0 auto;max-height:82vh;overflow-y:auto;background:#0f141a;
  border-top:1px solid var(--line3);padding:22px 22px calc(34px + env(safe-area-inset-bottom));
  animation:lmpSheet .3s cubic-bezier(.2,.8,.2,1) both}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.sheettitle{min-width:0}
.sheetname{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.sheetjp{font-size:13.5px;margin-top:3px}
.closeb{background:none;border:none;color:var(--muted2);font-size:20px;cursor:pointer;padding:0;line-height:1}
.sheetfacts{display:flex;flex-wrap:wrap;gap:14px 20px;margin-top:20px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.factv{font-size:16px;font-weight:900;color:var(--ink);letter-spacing:-.01em}
.factk{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-top:3px}
.sheetwarn{margin-top:16px;padding-left:12px;border-left:2px solid var(--warm);font-size:13.5px;line-height:1.55;color:var(--warmsoft)}
.sheeting{font-size:14.5px;line-height:1.65;color:var(--sub);margin-top:8px}
.sheetconds{font-size:13px;line-height:1.6;color:var(--muted2);margin-top:8px}
.flexbtn{margin-top:16px;background:none;border:1px solid var(--line3);color:var(--ink);padding:11px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.sheetcard>.cta{margin-top:24px}

/* ---- cook mode ---- */
#cook-overlay{position:fixed;inset:0;background:#0f141a;display:none;flex-direction:column;z-index:40;overflow:hidden}
#cook-overlay.show{display:flex;animation:lmpIn .2s ease both}
.cookhead{padding:calc(20px + env(safe-area-inset-top)) 22px 0;display:flex;align-items:center;gap:14px}
.quitb{background:none;border:none;color:var(--muted2);font-size:13px;font-weight:700;cursor:pointer;padding:0}
.stepdots{flex:1;display:flex;gap:4px}
.stepdots .dot{width:auto;flex:1;height:3px;border-radius:0}
.wakeb{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;padding:0;white-space:nowrap}
.wakeb.on{color:var(--mint)}
.cookbody{flex:1;overflow-y:auto;padding:34px 22px 22px}
.stepnum{font-size:70px;line-height:.85;font-weight:900;color:rgba(255,255,255,.09);letter-spacing:-.05em;margin-top:18px}
.steptext{font-size:22px;line-height:1.45;font-weight:500;letter-spacing:-.01em;margin-top:-16px}
.portionhint{font-size:14.5px;color:var(--muted2);margin-top:14px;line-height:1.6}
.portstepper{display:flex;align-items:center;gap:1px;margin-top:28px;background:var(--line3)}
.portstepper button{width:56px;height:56px;background:#0f141a;border:none;color:var(--mint);font-size:26px;font-weight:700;cursor:pointer}
.portval{flex:1;background:#0f141a;height:56px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.cookfoot{background:#0f141a;padding-bottom:calc(34px + env(safe-area-inset-bottom))}
.cookfoot.hlist{flex-direction:row;padding-top:1px}
.backb{background:#0f141a;border:none;color:var(--muted2);padding:19px 24px;font-size:15px;font-weight:700;cursor:pointer}
.cookfoot .cta{flex:1;padding:19px}

/* ---- toast ---- */
#toast{position:fixed;left:22px;right:22px;bottom:calc(100px + env(safe-area-inset-bottom));max-width:516px;margin:0 auto;
  background:var(--ink);color:#0f141a;padding:13px 16px;font-size:13.5px;font-weight:700;display:none;
  align-items:center;justify-content:space-between;gap:12px;z-index:50}
#toast.show{display:flex;animation:lmpUp .2s ease both}
#toast button{background:none;border:none;color:inherit;font:900 13px inherit;cursor:pointer;text-decoration:underline;white-space:nowrap}

button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
</style>
</head>
<body>
<noscript><p style="padding:24px;text-align:center">This app needs JavaScript to run — please enable it.</p></noscript>

<h1 class="vh">Lazy Meal Planner</h1>
<main id="main">
<div class="wrap tab" id="tab-tonight"></div>
<div class="wrap tab" id="tab-week"></div>
<div class="wrap tab" id="tab-shop"></div>
<div class="wrap tab" id="tab-save"></div>
</main>

<nav id="tabbar" aria-label="Sections"></nav>
<div id="sheet-overlay" role="dialog" aria-modal="true" aria-label="Dish details" onclick="if(event.target===this)closeSheet()"></div>
<div id="cook-overlay" role="dialog" aria-modal="true" aria-label="Cook mode"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ CONDIMENT CORE ============ */
const CONDS = {
  soy:{n:"Soy sauce",jp:"国産しょうゆ（濃口）",p:322}, mirin:{n:"Mirin",jp:"本みりん 1L",p:416},
  sake:{n:"Cooking sake",jp:"料理酒 1L",p:225}, mentsuyu:{n:"Mentsuyu (triple-strength)",jp:"めんつゆ 3倍濃縮",p:330},
  sesame:{n:"Sesame oil",jp:"ごま油",p:480},
  torigara:{n:"Chicken stock powder",jp:"がらスープの素 200g",p:538}, dashi:{n:"Hondashi",jp:"ほんだし",p:350},
  miso:{n:"Miso",jp:"味噌",p:425},
  mayo:{n:"Kewpie mayo",jp:"マヨネーズ",p:280}, garlic:{n:"Garlic paste",jp:"おろし生にんにく お徳用",p:376},
  ginger:{n:"Ginger paste",jp:"おろし生しょうが お徳用",p:376}, oil:{n:"Cooking oil",jp:"サラダ油",p:450},
  katakuriko:{n:"Potato starch",jp:"片栗粉",p:200},
  panko:{n:"Panko breadcrumbs",jp:"パン粉",p:150},
  pepper:{n:"Black pepper",jp:"ブラックペッパー",p:130},
  ponzu:{n:"Ponzu",jp:"ポン酢",p:342},
  cheese:{n:"Grated parmesan",jp:"粉チーズ",p:320}
};
/* ============ INGREDIENTS ============ */
const ING = {
  chicken:{n:"Chicken thigh",jp:"鶏もも肉",u:"g",p:1.07,cat:"meat"},
  chickenbreast:{n:"Chicken breast",jp:"鶏むね肉",u:"g",p:1.05,cat:"meat"},
  pork:{n:"Pork komagire",jp:"豚こま切れ",u:"g",p:1.75,cat:"meat"},
  gpork:{n:"Ground pork",jp:"豚ひき肉",u:"g",p:1.95,cat:"meat"},
  bacon:{n:"Bacon",jp:"ベーコン",u:"g",p:2.5,cat:"meat"},
  salmon:{n:"Salted salmon fillet",jp:"塩鮭切身",u:"pc",p:300,cat:"meat"},
  egg:{n:"Eggs",jp:"卵",u:"pc",p:29,cat:"other"},
  tofu:{n:"Tofu (block)",jp:"木綿豆腐",u:"pc",p:130,cat:"other"},
  kimchi:{n:"Kimchi",jp:"キムチ",u:"g",p:0.85,cat:"other"},
  onion:{n:"Onion",jp:"玉ねぎ",u:"pc",p:55,cat:"veg"},
  carrot:{n:"Carrot",jp:"にんじん",u:"pc",p:55,cat:"veg"},
  potato:{n:"Potato",jp:"じゃがいも",u:"pc",p:65,cat:"veg"},
  cabbage:{n:"Cabbage",jp:"キャベツ",u:"g",p:0.18,cat:"veg"},
  shimeji:{n:"Shimeji mushrooms",jp:"しめじ",u:"g",p:1.2,cat:"veg"},
  daikon:{n:"Daikon",jp:"大根",u:"g",p:0.2,cat:"veg"},
  negi:{n:"Green onion",jp:"長ねぎ",u:"pc",p:70,cat:"veg"},
  cucumber:{n:"Cucumber",jp:"きゅうり",u:"pc",p:60,cat:"veg"},
  cantomato:{n:"Canned tomato",jp:"カットトマト缶",u:"g",p:0.3,cat:"dry"},

const CATS = {meat:"Meat & fish · 肉・魚", veg:"Produce · 野菜", other:"Chilled · 卵・豆腐", dry:"Dry & canned · 乾物・缶", frozen:"Frozen · 冷凍"};
/* ============ RECIPES (qty per serving) ============
   Step text carries scalable quantities in braces: {150 g}, {15 ml}, {1 tsp}, {0.5 onion},
   {1 potato|potatoes}. Cook mode multiplies them by the servings in the current round, so
   the cook never does arithmetic at the stove. Anything outside braces is fixed — frying oil,
   "cover by 2 cm", per-bowl miso — because it does not grow with the batch.

   Physical fields, all checked by test.js:
   potMl   — pot dishes: the cap is COMPUTED from POT_ML (the measured working volume of the
             18 cm pot) and what one serving puts in it: solids by weight plus `liquid` ml.
             Anything in `after` goes in once the volume has cooked down.
   menu    — cook-in rice: which Tiger menu, because each has its own rice limit.
   after   — added after the cooker cycle or as a topping; not part of the cooker/plate load.
   ready   — minutes to the table, not counting side rice (the cook screen adds that).
   keep    — days in the fridge when it differs from the default (see keepDaysOf).
   minServ — the fewest servings that clear a cooker's minimum fill. */
const PLATE_RICE = "Rinse {75 g} rice until the water runs mostly clear, drain, into the inner pot, and add water to the white-rice line for {0.5 cup|cups}. Plain rice only under the plate. One cup is Tiger's ceiling with the plate in, so two servings is a full run.";
const RECIPES = [
 {id:"beansoup", tier:"A", n:"Bean & tomato soup", jp:"ミックスビーンズのトマトスープ", gear:["pot"], time:"20 min", ready:25, eff:2, batch:true, liquid:100, flex:true, freeze:"freezes perfectly",
  ing:[["mixedbeans",80],["cantomato",100],["onion",0.5],["carrot",0.3],["bacon",30]], rice:0.5, conds:["torigara","garlic","oil"],
  steps:["Dice {0.5 onion} and {0.3 carrot} small. Cut {30 g} bacon into 1 cm strips.","Pot on medium with 15 ml (1 tbsp) oil. Bacon in first for 1 min, then the onion and carrot for 3 min until the onion turns translucent.","Add {80 g} drained mixed beans, {100 g} canned tomato, {100 ml} water, {1 tsp} chicken stock powder and {1 tsp} garlic paste. It is thick on purpose — a soup base is what lets the pot hold the batch.","Bring to a boil, then simmer on medium-low 12 min with the lid ajar, stirring twice so the bottom does not catch.","Taste, and add salt only if it needs it. Loosen each bowl with 100 ml water as it reheats. Keeps 3 days in the fridge and a month in the freezer, and it is better on day two."]},
 {id:"belachan", tier:"A", n:"Belachan steamed chicken breast", jp:"よだれ鶏（ベラチャン）", gear:["pot"], time:"10 min", ready:35, eff:1, batch:true, liquid:170, freeze:"slices freeze well",
  ing:[["chickenbreast",150],["cucumber",0.3],["negi",0.2]], after:["cucumber","negi"], rice:0.5, conds:["sesame","soy","ginger"],
  steps:["Lay {150 g} chicken breast in the pot in one layer. Add cold water to cover it by 2 cm, {1 tsp} ginger paste and the green tops of a green onion.","Bring it to a boil, then turn the heat OFF completely and put the lid on. Leave it 15 min. Poaching off-heat is the whole trick — breast turns dry and stringy the moment it actually boils.","Check the thickest part is white all the way through. Lift it out, rest 5 min, slice 1 cm thick across the grain.","Sauce: {1 tsp} belachan + {15 ml} soy sauce + {5 ml} sesame oil, mixed in a small bowl.","Over rice with sliced cucumber and the white of the green onion. It keeps 3 days and is good cold. Keep the poaching water: that is chicken stock."]},
 {id:"butadaikon", tier:"A", n:"Pork & daikon simmer", jp:"豚バラ大根", gear:["pot"], time:"30 min", ready:45, eff:2, batch:true, liquid:250, flex:true,
  ing:[["pork",100],["daikon",150]], rice:0.5, conds:["soy","mirin","sake","ginger","sesame"],
  steps:["Peel {150 g} daikon and cut into 2 cm half-moons. Cut {100 g} pork bite-size.","Pot on medium, 5 ml (1 tsp) sesame oil. Pork first until it changes colour, then the daikon, 2 min.","Add {200 ml} water, {20 ml} soy sauce, {15 ml} mirin, {15 ml} sake and {1 tsp} ginger paste.","Lid slightly ajar, medium-low, 20 min. Done when the daikon is translucent and a chopstick slides through.","Heat off, rest 10 min — daikon drinks the sauce as it cools. Keeps 3 days and improves daily."]},
 {id:"butadon", tier:"A", n:"Butadon (pork bowl)", jp:"豚丼", gear:["pot","rice"], time:"12 min", ready:15, eff:1, batch:true, liquid:155, freeze:"topping freezes well",
  ing:[["pork",120],["onion",0.5]], rice:0.5, conds:["soy","mirin","sake","dashi","ginger"],
  steps:["Slice {0.5 onion} into thin wedges.","In the pot: {100 ml} water, {20 ml} soy sauce, {20 ml} mirin, {15 ml} sake, {0.5 tsp} hondashi and {1 tsp} ginger paste. Bring to a boil.","Add the onion, medium heat 3 min until soft and see-through.","Add {120 g} pork, separating the slices with chopsticks so they do not clump. 4–5 min, spooning off the grey foam.","Over rice. The topping keeps 3 days in the fridge and a month in the freezer — freeze it with some of its sauce."]},
 {id:"curry", tier:"A", n:"Japanese curry", jp:"カレーライス", gear:["pot","rice"], time:"30 min", ready:35, eff:2, batch:true, liquid:170, flex:true, freeze:"freeze without potato",
  ing:[["chicken",120],["onion",0.5],["carrot",0.3],["potato",0.6],["roux",25]], after:["roux"], rice:0.5, conds:["oil"],
  steps:["Cut {0.5 onion} into thick wedges, {0.3 carrot} into chunky pieces, {0.6 potato|potatoes} into big chunks and {120 g} chicken into bite-size pieces.","Pot on medium-high with 15 ml (1 tbsp) oil. Brown the chicken ~2 min, then add all the vegetables and stir 2 min.","Add {170 ml} water. It will not quite cover everything, and that is right: the vegetables give off water and the pot has to hold it. Boil, spoon off the grey foam, then lid on and simmer on medium-low 15 min, stirring once — done when a chopstick slides into a potato easily.","Turn the heat OFF. Drop in {1 roux block|roux blocks} ({25 g}) and stir until fully melted — adding roux off-heat stops it clumping.","Heat back on low for 5 min, stirring so the bottom does not catch, until it is thick like gravy. Over rice. Keeps 3 days; to freeze, fish the potato out first."]},
 {id:"keema", tier:"A", n:"Keema curry", jp:"キーマカレー", gear:["pot","rice"], time:"20 min", ready:30, eff:2, batch:true, liquid:150, freeze:"freezes perfectly",
  ing:[["gpork",60],["lentil",40],["onion",0.5],["cantomato",100],["fveg",50],["roux",25]], after:["roux"], rice:0.5, conds:["garlic","ginger","oil"],
  steps:["Dice {0.5 onion} as small as you can manage. Pot on medium with 15 ml (1 tbsp) oil, {1 tsp} each garlic and ginger paste, and the onion — fry ~3 min until it turns translucent.","Add {60 g} ground pork. Break it apart with the spatula and fry until no pink remains.","Add {100 g} canned tomato, {40 g} red lentils, {50 g} frozen veg and {150 ml} water. Simmer on medium-low 15 min, stirring now and then — the lentils collapse into the sauce and thicken it for you. Splash in more water if it tightens too far.","Heat OFF, melt in {1 roux block|roux blocks} ({25 g}). Back on low ~2 min until thick.","Serve over rice. Once cool, portion into boxes: 3 days in the fridge, a month in the freezer."]},
 {id:"nikujaga", tier:"A", n:"Nikujaga (meat & potato stew)", jp:"肉じゃが", gear:["pot"], time:"25 min", ready:40, eff:2, batch:true, liquid:125, flex:true,
  ing:[["pork",100],["potato",1],["onion",0.5],["carrot",0.3]], rice:0.5, conds:["mentsuyu"],
  steps:["Cut {1 potato|potatoes} into quarters, {0.5 onion} into wedges and {0.3 carrot} into chunks.","Pot on medium-high, 5 ml (1 tsp) oil. Brown {100 g} pork for about 1 min.","Add the vegetables, then {100 ml} water and {25 ml} mentsuyu (1 part mentsuyu to 4 parts water). It only comes halfway up — nikujaga steams under the lid rather than swimming.","Bring to a boil, skim the foam, then lid on and simmer medium-low 15–20 min, turning everything over once, until a fork goes into the potato with no resistance.","Heat off and rest 10 min before eating — it soaks up flavour as it cools. Keeps 3 days, and it is better tomorrow."]},
 {id:"soboro", tier:"A", n:"Soboro don (meat & egg)", jp:"そぼろ丼", gear:["pan","rice"], time:"12 min", ready:15, eff:1, batch:true, cap:4, crowd:true, freeze:"the meat freezes well",
  ing:[["gpork",120],["egg",2]], rice:0.5, conds:["soy","mirin","sake","ginger"],
  steps:["Start with a COLD pan: add {120 g} ground pork, {15 ml} soy sauce, {15 ml} mirin, {15 ml} sake and {1 tsp} ginger paste. Mix it all together before turning on the heat — this is the no-clump trick.","Now medium heat, stirring constantly with 3 or 4 chopsticks held together until the meat is fine and crumbly and the liquid has cooked off — about 5 min, longer for a big batch. Scoop it into a box.","The egg is made fresh at each meal, never batched — scrambled egg turns watery in the fridge. When you eat: beat 2 eggs, pan on LOW, stir gently into soft curds, about 1 min.","Rice bowl: meat over one half, egg over the other. The meat keeps 3 days in the fridge or a month in the freezer. Cooked ground meat is the one leftover not to push past 3 days."]},
 {id:"tonjiru", tier:"A", n:"Tonjiru (pork miso soup) + rice", jp:"豚汁", gear:["pot","rice"], time:"20 min", ready:25, eff:2, batch:true, liquid:200,
  ing:[["pork",80],["daikon",80],["carrot",0.3],["onion",0.3],["negi",0.2]], after:["negi"], rice:0.5, conds:["miso","dashi","sesame"],
  steps:["Cut {80 g} pork into bite-size pieces, {80 g} daikon into thin quarter-slices, {0.3 carrot} into half-moons and {0.3 onion} into wedges.","Pot on medium, 5 ml (1 tsp) sesame oil. Fry the pork first, then the vegetables, 2–3 min.","Add {200 ml} water and {0.5 tsp} hondashi. Simmer 10–15 min until the daikon turns translucent. It is thicker than a finished soup on purpose — the rest of the water goes in at the bowl.","Heat OFF. For tonight's bowl: ladle out a portion, add 100 ml hot water, and dissolve 18 g (1 tbsp) miso in it. Boiling miso kills its flavour, so miso never goes in the pot you are keeping.","Box the rest without miso — it keeps 3 days. At each meal reheat a portion with 100 ml water until steaming, then stir in the miso and top with sliced green onion. Serve with rice."]},
 {id:"hainan", tier:"B", plate:true, n:"Rice-cooker Hainanese chicken rice", jp:"炊飯器カオマンガイ", gear:["rice"], time:"5 min prep", ready:60, eff:1, batch:true, cap:2,
  ing:[["chickenbreast",150],["cucumber",0.3]], after:["cucumber"], rice:0.5, conds:["torigara","ginger","garlic","sesame","soy"],
  steps:[PLATE_RICE,"Rub {150 g} chicken breast, left whole, with {1 tsp} chicken stock powder, {1 tsp} garlic paste and {1 tsp} ginger paste. Lay it flat on the cooking plate — spread out, not stacked.","Slide the plate in above the rice, lid down, press white rice. When it beeps (about 50 min), lift the plate straight out — never leave it in on keep-warm.","Rest the chicken 5 min. Tip the juices from the plate over the rice and fold them through with the paddle: that is where the chicken-rice flavour comes from. Slice the chicken 1 cm thick across the grain and check it is white all the way through.","Sauce: {15 ml} soy sauce + {5 ml} sesame oil. Slice {0.3 cucumber|cucumbers}. Chicken and sauce over the rice."]},
 {id:"kimchirice", tier:"B", plate:true, n:"Pork-kimchi mazegohan", jp:"豚キムチ混ぜご飯", gear:["rice"], time:"5 min prep", ready:55, eff:1, batch:true, cap:2, flex:true,
  ing:[["pork",100],["kimchi",80]], rice:0.5, conds:["torigara","sesame"],
  steps:[PLATE_RICE,"Spread {80 g} kimchi over the cooking plate, lay {100 g} pork over it in loose single slices, and sprinkle {1 tsp} chicken stock powder on top. Keep it as flat as you can — piled food cooks unevenly and can boil over.","Plate in, lid down, white rice. When it beeps, lift the plate straight out and check the pork: no pink anywhere.","Tip everything on the plate, juices included, onto the rice and fold it through with the paddle.","{5 ml} sesame oil over the top. A dab of belachan works."]},
 {id:"takikomi", tier:"B", plate:true, n:"Chicken & mushroom mazegohan", jp:"鶏ときのこの混ぜご飯", gear:["rice"], time:"7 min prep", ready:60, eff:1, batch:true, cap:2, freeze:"press into balls while warm and freeze",
  ing:[["chicken",80],["shimeji",50],["carrot",0.3]], rice:0.5, conds:["mentsuyu"],
  steps:[PLATE_RICE,"Cut {80 g} chicken into 2 cm pieces. Cut the base off {50 g} shimeji and tear it apart. Slice {0.3 carrot} into thin half-moons.","Spread chicken, shimeji and carrot over the cooking plate in one layer and spoon {15 ml} mentsuyu over. Plate in, lid down, white rice.","When it beeps, lift the plate straight out and cut a thick piece of chicken: no pink. Tip it all, juices included, over the rice, add {15 ml} more mentsuyu, and fold it through.","Rest 5 min with the lid open a crack. Leftovers: press into balls while warm, wrap, freeze."]},
 {id:"tomatorice", tier:"B", plate:true, n:"Tomato & tuna mazegohan", jp:"トマトとツナの混ぜご飯", gear:["rice"], time:"5 min prep", ready:55, eff:1, batch:true, cap:2, keep:3, freeze:"freezes well in portions",
  ing:[["tomato",1],["tuna",0.5],["onion",0.25]], rice:0.5, conds:["torigara","soy","pepper"],
  steps:[PLATE_RICE,"Core {1 tomato|tomatoes} by cutting a small cone out of the stem end and sit it on the cooking plate. Scatter {0.5 tuna can|tuna cans}, drained, and {0.25 onion}, diced, around it, then {1 tsp} chicken stock powder over everything.","Plate in, lid down, white rice.","When it beeps, lift the plate straight out and tip it onto the rice — juices and all — smashing the tomato into the rice with the paddle as you fold.","Season with {5 ml} soy sauce and black pepper. Freezes well in portions."]},
 {id:"afsalmon", tier:"C", n:"Air-fryer salmon set", jp:"焼き鮭定食", gear:["air","rice"], time:"3 min work", ready:18, eff:0, batch:false, cap:2,
  ing:[["salmon",1],["fbroc",80]], rice:0.5, conds:["mayo"],
  steps:["Preheat 3 min at 180 °C. Then {1 salted salmon fillet|salted salmon fillets} into the basket, skin side down, not touching. No oil, no seasoning — 塩鮭 is already salted.","10–12 min. Done when the thickest part flakes apart when pushed with a fork — check through the window, because opening the drawer pauses the timer and drops the heat.","For the last 5 min, drop {80 g} frozen broccoli in beside it.","Plate with rice and a dab of Kewpie. The laziest real meal in Japan."]},
 {id:"afteriyaki", tier:"C", n:"Air-fryer teriyaki chicken", jp:"照り焼きチキン", gear:["air","rice"], time:"5 min work", ready:30, eff:1, batch:true, cap:2, freeze:"freeze raw in the marinade",
  ing:[["chicken",150],["fbroc",80]], rice:0.5, conds:["soy","mirin","garlic"],
  steps:["Cut {150 g} chicken thigh into big chunks, 4 or 5 from each 150 g.","Marinade: {15 ml} soy sauce + {15 ml} mirin + {1 tsp} garlic paste. Toss the chicken in it — 10 min minimum, overnight is better. Extra portions can go into freezer bags now.","Preheat 3 min at 180 °C. Chicken in a single layer, skin up, 15 min total. Two servings fills the 4.2 L basket; a third would stack and steam.","At the 10-minute mark, scatter {80 g} frozen broccoli around the chicken, straight from frozen.","Done when the juices run clear when you poke the thickest piece (or 75 °C inside). Serve with rice."]},
 {id:"karaage", tier:"C", n:"Air-fryer karaage", jp:"唐揚げ", gear:["air","rice"], time:"10 min work", ready:40, eff:1, batch:true, cap:2, freeze:"freeze raw in the marinade",
  ing:[["chicken",150],["cabbage",50]], rice:0.5, conds:["soy","garlic","ginger","katakuriko","oil"],
  steps:["Cut {150 g} chicken thigh into 4 cm chunks — keep the skin on.","Marinade: {15 ml} soy sauce + {1 tsp} each garlic and ginger paste. 15 min minimum. Extra portions freeze raw in the marinade, in bags; thaw overnight in the fridge.","Tip {15 g} potato starch onto a plate. Roll each chunk until it is dusted white on every side.","Pat {5 ml} oil over the dusted pieces with your fingers — never aerosol spray, it strips the ceramic coating. Dry starch stays pale and floury.","Preheat 3 min at 190 °C. Single layer with gaps: 8 min, flip every piece, 5 more min. Golden outside, juices clear inside = done. Two servings is the honest limit of the 4.2 L basket.","Serve with {50 g} shredded cabbage and rice. Squeeze of mayo optional but encouraged."]},
 {id:"afroast", tier:"C", n:"Air-fryer chicken & potato roast", jp:"鶏とじゃがいものバスケットロースト", gear:["air"], time:"5 min work", ready:35, eff:1, batch:true, cap:2, freeze:"freeze raw in the marinade",
  ing:[["chicken",150],["potato",0.7],["onion",0.3]], conds:["oil","soy","pepper"],
  steps:["Cut {150 g} chicken thigh into big chunks, {0.7 potato|potatoes} into 2 cm cubes and {0.3 onion} into thick wedges. Leave the potato skin on — it is where the crisp comes from.","In a bowl, toss it all with {5 ml} oil, {15 ml} soy sauce and a heavy grind of black pepper. Coat the potato properly or it turns leathery.","Preheat 3 min at 200 °C. Tip everything in as one layer — two servings is the limit of the 4.2 L basket.","200 °C for 20 min. Pull the basket out at the 10-minute mark and shake it once, then watch the potato edges go gold through the window.","Done when a chopstick slides into a potato and the chicken juices run clear. No rice needed, the potato is the carb — and the basket is the only thing to wash."]},
 {id:"afbreast", tier:"C", n:"Air-fryer pepper chicken breast", jp:"鶏むね肉の胡椒焼き", gear:["air","rice"], time:"3 min work", ready:22, eff:1, batch:true, cap:2,
  ing:[["chickenbreast",150],["fbroc",80]], rice:0.5, conds:["oil","pepper","soy"],
  steps:["Cut {150 g} chicken breast into 3 cm slabs. Thick pieces stay juicy; thin ones turn to chalk.","Rub the pieces with {5 ml} oil and a lot of black pepper. That is the entire prep.","Preheat 3 min at 180 °C. Breast in one layer, 12 min, flipping once at 6 min. 180 °C and not 200 °C — breast is lean and high heat dries it out.","Cut into the thickest slab to check: no pink anywhere and the juices run clear (75 °C inside). Thicker pieces want another 2–3 min.","Scatter {80 g} frozen broccoli around it for the last 5 min, straight from the freezer.","Rest 3 min before slicing, then {5 ml} soy sauce over the top. Serve with rice."]},
 {id:"afkatsu", tier:"C", n:"Air-fryer chicken katsu", jp:"鶏カツ", gear:["air","rice"], time:"10 min work", ready:30, eff:1, batch:true, cap:1, freeze:"freeze breaded, uncooked",
  ing:[["chicken",150],["egg",0.5],["cabbage",50]], rice:0.5, conds:["katakuriko","panko","oil","mayo","soy"],
  steps:["Butterfly {150 g} chicken thigh open so it lies flat and even. Even thickness is what makes or breaks a katsu.","Set out three stations: potato starch on a plate, a beaten egg in a bowl, {30 g} panko on a second plate. Dust with starch, dip in egg, then press the panko on hard — pressing is what stops it falling off in the basket.","Pat {5 ml} oil over the crumbs with your fingers until no white powder is left. Never aerosol spray: it strips the ceramic coating, and dry panko stays pale.","Preheat 3 min at 190 °C. One cutlet, flat, with nothing touching it: 8 min, flip, 5 min more. Breaded food needs the basket to itself — a second serving is a second round.","Done when the crumb is deep gold and the juices run clear where you cut into the thickest part (75 °C inside). Pale crumb means it needs longer, not hotter.","Slice into 2 cm strips, {50 g} shredded cabbage alongside, rice. Mayo and soy sauce mixed 1:1 is a passable tonkatsu sauce."]},
 {id:"afgyoza", tier:"C", n:"Air-fryer frozen gyoza set", jp:"冷凍餃子（エアフライヤー）", gear:["air","rice"], time:"5 min work", ready:15, eff:0, batch:false, cap:1, keep:3,
  ing:[["gyoza",300],["cabbage",50]], rice:0.5, conds:["oil","soy","sesame"],
  steps:["Preheat 3 min at 190 °C. {12 frozen gyoza|frozen gyoza} straight from the freezer into the basket, flat side down, in one layer with gaps. No thawing, no water. Twelve is what one layer holds, so a second serving is a second round.","Wipe {5 ml} oil over the tops so the wrappers blister instead of drying out.","10 min. No flipping, no steaming step, no pan to scrub.","From minute 8, watch through the window: done when the wrappers are blistered gold and the edges have gone crisp.","Dip: {15 ml} soy sauce + a drop of sesame oil, and belachan if you want fire. {50 g} shredded cabbage and rice on the side."]},
 {id:"aftofu", tier:"C", n:"Air-fryer crispy tofu with ponzu", jp:"揚げ出し豆腐風", gear:["air","rice"], time:"5 min work", ready:25, eff:1, batch:false, cap:2,
  ing:[["tofu",1],["negi",0.2]], after:["negi"], rice:0.5, conds:["katakuriko","oil","ponzu","sesame"],
  steps:["Press {1 block|blocks} of firm tofu: wrap in kitchen paper, sit a plate on top, leave it 10 min. Wet tofu steams, pressed tofu crisps.","Cut each block into 8 cubes and roll them in {15 g} potato starch until dusted white on every side. Handle them like eggs, they break.","Preheat 3 min at 200 °C. Cubes in one layer, not touching, with {5 ml} oil patted over the tops.","200 °C for 12 min, shaking the basket gently at the 8-minute mark.","Golden and firm outside means done. Onto rice, ponzu poured over, sliced green onion and a drop of sesame oil on top."]},
 {id:"nabe", tier:"D", n:"Chicken mizutaki nabe", jp:"水炊き鍋", gear:["pot"], time:"20 min", ready:25, eff:1, kettle:true, batch:true, liquid:250, capMax:2,
  ing:[["chicken",150],["cabbage",150],["tofu",0.5],["shimeji",50]], rice:0.5, conds:["dashi","ponzu"],
  steps:["Cut {150 g} chicken into chunks, {150 g} cabbage into big squares and {0.5 tofu block|tofu blocks} into large cubes, and tear apart {50 g} shimeji.","Pot: {250 ml} water + {1 tsp} hondashi. Bring to a boil.","Chicken in first. 5 min, spooning off the foam that rises.","Everything else on top — the cabbage piles high and collapses as it cooks. Lid on, medium, 8–10 min until the cabbage is soft.","Pour some ponzu into a small bowl and dip each bite. Night two: drop cooked rice and a beaten egg into the leftover broth, 3 min = zōsui."]},
 {id:"tompasta", tier:"D", n:"One-pot tomato bacon pasta", jp:"ワンポットトマトパスタ", gear:["pot"], time:"15 min", ready:20, eff:1, kettle:true, batch:false, liquid:250, capMax:2, keep:1,
  ing:[["pasta",100],["bacon",50],["cantomato",200],["onion",0.3]], conds:["torigara","garlic","oil"],
  steps:["Cut {50 g} bacon into strips and dice {0.3 onion}.","Pot on medium, 5 ml (1 tsp) oil. Bacon, onion and {1 tsp} garlic paste, fry 2 min.","Add {200 g} canned tomato, {250 ml} water and {1 tsp} chicken stock powder. Bring to a boil.","Snap {100 g} pasta in half and push it in. Stir every 2 min or so — one-pot pasta sticks if ignored.","Simmer about 10 min (check 1 min before the packet time) until the pasta is done and the sauce clings. Taste; add salt if flat. Eat it now — it does not reheat well."]},

/* ============ PHYSICAL LIMITS ============
   Every cap below is a physical claim, derived here or asserted in test.js — never a wish. */
/* The 18 cm pot, measured 17 Sep 2026: three 500 ml jugs + 100 ml fills it to 1.5 cm below
   the rim (8.1 cm deep). 1.5 cm is the headroom a simmer needs, so this is the working volume. */
const POT_ML = 1600;
/* Tiger JAJ-A550 manual: rice limits by menu (P.30), cook-in extras about 70 g a cup or less
   (P.7), plate runs 0.5–1 go on the white menu only (P.19), simmer between the 1 and 3 marks
   (P.17), and the finishing times by menu (P.9). */
const COOKER = { white:3, takikomi:2, risotto:1, chahan:2, plateMax:1, plateMin:0.5, gPerCup:70,
  simmerMinMl:400, simmerMaxMl:1100, whiteMin:"42–52", quickMin:"20–40" };
const PLATE_G = 220;      /* what spreads in one layer on the cooking plate, per serving (estimate) */
const BASKET_CM2 = 315;   /* floor of the 4.2 L air-fryer basket */
/* floor space one serving takes laid out with gaps — the basket cap is checked against it */
const AIR_CM2 = {afsalmon:140, afteriyaki:140, karaage:140, afroast:150, afbreast:110, afkatsu:200, afgyoza:300,
  aftofu:120, afmiso:140, afmeatball:90, afhamburg:100, afnasu:150, afonigiri:80, aftebasaki:300};
/* grams per piece, for anything the pantry counts in pieces */
const PC_G = {onion:200, carrot:150, potato:150, tomato:120, negi:100, cucumber:100, egg:60, tofu:350,
  salmon:80, tuna:70, sardine:100, nasu:80};
const gramsOf = (id,q) => ING[id].u==="g" ? q : q*(PC_G[id]||100);
const loadOf = r => r.ing.filter(([id])=>!(r.after||[]).includes(id)).reduce((a,[id,q])=>a+gramsOf(id,q),0);
RECIPES.forEach(r=>{
  if (r.gear.includes("pot")) {
    r.potMl = Math.round(loadOf(r) + (r.liquid||0));
    r.cap = Math.max(1, Math.min(r.capMax||4, Math.floor(POT_ML / r.potMl)));
  }
  if (AIR_CM2[r.id]) r.cm2 = AIR_CM2[r.id];
});
/* where the rice for a dish comes from: the dish itself, a separate cooker run, or nothing */
const riceKind = r => !r.rice ? "none" : (r.cookin || r.plate) ? "self" : r.cooked ? "cooked" : "side";

/* ============ SCALED STEP TEXT ============ */
const FRAC = [[0,""],[1/4,"¼"],[1/3,"⅓"],[1/2,"½"],[2/3,"⅔"],[3/4,"¾"],[1,""]];
function fmtCount(v){
  let whole = Math.floor(v + 1e-9), rest = v - whole, best = FRAC[0], d = 9;
  FRAC.forEach(f=>{ const dd = Math.abs(rest - f[0]); if (dd < d - 1e-9) { d = dd; best = f; } });
  if (best[0] === 1) { whole += 1; best = FRAC[0]; }
  if (!whole && !best[1]) return "¼";
  return (whole ? String(whole) : "") + best[1];
}
function fmtQty(v, unit, plural){
  if (unit === "g") return (v >= 20 ? Math.round(v/5)*5 : Math.round(v)) + " g";
  if (unit === "ml") {
    const ml = v >= 10 ? Math.round(v/5)*5 : Math.round(v);
    if (ml <= 60 && ml % 15 === 0) return ml+" ml ("+(ml/15)+" tbsp)";
    if (ml <= 15 && ml % 5 === 0) return ml+" ml ("+(ml/5)+" tsp)";
    return ml+" ml";
  }
  if (unit === "tsp") return (v >= 3 && Math.abs(v/3 - Math.round(v/3)) < 1e-9) ? (v/3)+" tbsp" : fmtCount(v) + " tsp";
  /* nobody beats one and a half eggs: past one, eggs round up to whole */
  if (unit === "egg" && v > 1.01) v = Math.ceil(v - 0.01);
  return fmtCount(v) + " " + (v > 1.01 ? (plural || unit+"s") : unit);
}
/* {150 g}  {15 ml}  {1 tsp}  {0.5 onion}  {1 potato|potatoes} — multiplied by n servings */
function scaleText(s, n){
  return s.replace(/\{([\d.]+) ([^}|]+?)(?:\|([^}]+))?\}/g, (m, q, unit, plural)=>fmtQty(parseFloat(q)*n, unit, plural));
}
function stepText(r, i, n){ return scaleText(r.steps[i], n || 1); }

const EAT_OUT = 1000;
const GEARLABEL = {rice:"rice cooker", pot:"pot", pan:"pan", air:"air fryer"};
/* The shelf staples. A bottle of any of these is a one-time buy that lasts months, so the
   planner must not keep asking for them — see the seeding step in the state block. */
const SHELF_SEED = ["soy","mirin","sake","mentsuyu","sesame","torigara","dashi","miso",
  "mayo","garlic","ginger","oil","katakuriko","panko","pepper","ponzu"];
/* Selection weighting. The air fryer and the rice cooker cost real money; the pot did not,
   and left to itself the planner reached for the pot nearly every time. */
const APPLIANCE_BIAS = 2.4;
const BATCH_BIAS = 2.5;   /* when one dish has to cover 3+ meals, batchable dishes matter more */
const REPEAT_DAMP = 0.25; /* a dish picked in the last few rolls has to fight to come back */
const RECENT_KEEP = 12;
const isApplianceDish = r => r.gear.includes("air") || r.cookin === true || r.plate === true || r.simmer === true;
const yen = x => (x<0?"−":"")+"¥"+Math.abs(Math.round(x)).toLocaleString();
const rec = id => RECIPES.find(r=>r.id===id);
const baseMeat = r => (r.ing.find(([id])=>ING[id].cat==="meat")||[null])[0];
/* cooked meat and fish get 3 days, everything else 4; a dish meant to be eaten now says so */
const keepDaysOf = r => r.keep ? r.keep : ingsOf(r).some(([id])=>ING[id].cat==="meat") ? 3 : 4;
const cap1 = s => s.charAt(0).toUpperCase()+s.slice(1);
/* Protein swaps are between WHOLE cuts only. Ground pork is not a substitute for thigh chunks
   (meatballs and soboro cannot be made from chunks without a grinder) and chunks are not a
   substitute for mince, so mince dishes are not flex at all.
   Every entry must exist in ING — a stale key here poisons S.protein and blanks the app. */
const MEATCYCLE = ["chicken","pork"];
function ingsOf(r){ return r.ing.map(([id,q])=> (r.flex && S.protein && S.protein[r.id] && id===baseMeat(r)) ? [S.protein[r.id],q] : [id,q]); }
const EFFORTS = [
  {k:0, jp:"2分", en:"Zero effort", sub:"Open a can, or boil one pot."},
  {k:1, jp:"15分", en:"Something quick", sub:"One pot, one wash."},
  {k:2, jp:"45分", en:"Batch day", sub:"Cook once, eat three or four times."}
];

/* ============ STATE (persisted) ============ */
let S = {};
try { S = JSON.parse(localStorage.getItem("lmp")||"{}"); } catch(e) { S = {}; }
if (typeof S !== "object" || S === null || Array.isArray(S)) S = {};
const isObj = x => x && typeof x === "object" && !Array.isArray(x);
S.owned = isObj(S.owned) ? S.owned : {};
S.locked = Array.isArray(S.locked) ? S.locked : [];
S.recent = Array.isArray(S.recent) ? S.recent.filter(x=>typeof x==="string" && !!rec(x)).slice(0,RECENT_KEEP) : [];
S.bought = isObj(S.bought) ? S.bought : {};
/* a swap must be a whole cut on a dish that allows it — mince and whole cuts are different dishes */
S.protein = isObj(S.protein) ? Object.fromEntries(Object.entries(S.protein).filter(([k,v])=>typeof v==="string" && ING[v] && MEATCYCLE.includes(v) && rec(k) && rec(k).flex)) : {};
/* every field the log renderer touches is checked here: a bad entry used to brick the app on every load */
S.log = Array.isArray(S.log) ? S.log.filter(l=>isObj(l) && typeof l.d==="string" && Number.isFinite(l.spent) && Number.isFinite(l.meals)) : [];
S.N = Number.isInteger(S.N) && S.N>=1 && S.N<=14 ? S.N : 7;
S.v = [1,2,3].includes(S.v) ? S.v : 2;
S.tab = ["tonight","week","shop","save"].includes(S.tab) ? S.tab
  : (S.tab==="plan" ? "week" : "tonight"); /* migrate from the old tab set: plan->week, cook/anything else->tonight */
S.price = isObj(S.price) ? Object.fromEntries(Object.entries(S.price).filter(([k,v])=>ING[k] && typeof v==="number" && isFinite(v) && v>=0)) : {};
S.mugi = S.mugi === true;
/* The shelf used to start at {oil:true} and nothing ever filled it in, so the Shop tab kept
   billing a full pantry of condiments as one-time purchases, week after week, for bottles
   bought months ago. Seed the staples once. Only keys that were never set are touched, so a
   condiment deliberately marked as run out stays marked. */
if (S.shelfSeeded !== true) {
  SHELF_SEED.forEach(k=>{ if (S.owned[k] === undefined) S.owned[k] = true; });
  S.shelfSeeded = true;
  try { localStorage.setItem("lmp", JSON.stringify(S)); } catch(e) {}
}

function setTab(t){ S.tab=t; save(); render(); try{ scrollTo(0,0); }catch(e){} }
function stepMeals(d){
  S.N = Math.min(14, Math.max(1, S.N+d)); save();
  if (!S.plan) { render(); return; }
  /* reshuffle when short-week mode would exclude something already picked, or when there are
     now more dishes than meals — otherwise a dish ends up at ×0 servings and ¥0 of groceries */
  const mustReshuffle = (S.N<=2 && S.plan.some(id=>{ const r = rec(id); return r && r.batch; }))
    || S.plan.length > S.N;
  plan(mustReshuffle ? true : "keep");
}
function setVariety(v){ S.v=v; save(); plan(true); }
function eligible(){ return RECIPES; }
/* Max-batch mode used to sort the pool by capacity and take the top, which meant it only ever
   returned the nine cap-4 pot and pan dishes — the appliances were structurally unreachable and
   every roll looked like the last one. Capacity still matters (it decides how many rounds you
   cook), so it stays as a weight rather than a ranking, alongside an appliance bias and a damper
   on anything picked recently. */
function dishWeight(r, v, wantBatch){
  let w = isApplianceDish(r) ? APPLIANCE_BIAS : 1;
  if (wantBatch && r.batch) w *= BATCH_BIAS;
  if (v===1) w *= (r.cap || 1);
  if (S.recent.includes(r.id)) w *= REPEAT_DAMP;
  return w;
}
function pickWeighted(pool, k, v, wantBatch){
  const rest = pool.slice(), out = [];
  while (out.length < k && rest.length) {
    const weights = rest.map(r=>dishWeight(r, v, wantBatch));
    const total = weights.reduce((a,b)=>a+b, 0);
    let x = Math.random() * total, i = 0;
    while (i < rest.length-1 && x > weights[i]) { x -= weights[i]; i++; }
    out.push(rest.splice(i,1)[0]);
  }
  return out;
}
function plan(reshuffle){
  const N = S.N, v = S.v;
  const short = N<=2;
  const k = short ? N : v===1 ? 1 : v===2 ? Math.min(3, Math.max(2, Math.ceil(N/3))) : Math.min(N, 6);
  let pool = eligible();
  if (short) pool = pool.filter(r=>!r.batch);
  else if (v===1) pool = pool.filter(r=>r.batch);
  const locked = pool.filter(r=>S.locked.includes(r.id)).slice(0,k);
  let picks = [...locked];
  let undid = false, prevPlan = null;
  if (reshuffle!=="keep" || !S.plan) {
    if (S.plan) { prevPlan = { plan:[...S.plan], bought:{...S.bought} }; undid = true; }
    S.bought = {};
    const rest = pool.filter(r=>!picks.some(p=>p.id===r.id));
    picks = picks.concat(pickWeighted(rest, k - picks.length, v, N/k>=3));
    S.plan = picks.map(r=>r.id);
    S.recent = [...S.plan, ...S.recent.filter(id=>!S.plan.includes(id))].slice(0, RECENT_KEEP);
    U.heroIdx = 0; /* a new week means the old "Nah" position means nothing */
  }
  save(); render();
  if (undid) flash("New week generated", ()=>{ S.plan=prevPlan.plan; S.bought=prevPlan.bought; save(); render(); });
}
function swap(id){
  let pool = eligible().filter(r=>!S.plan.includes(r.id));
  if (S.N<=2) pool = pool.filter(r=>!r.batch);
  else if (S.v===1) pool = pool.filter(r=>r.batch);
  if (!pool.length) return;
  const nu = pickWeighted(pool, 1, S.v, false)[0]; /* a swap should favour the appliances too */
  const prevPlan = [...S.plan], prevLocked = [...S.locked];
  S.plan = S.plan.map(x=>x===id?nu.id:x);
  S.locked = S.locked.filter(x=>x!==id);
  save(); render();
  flash("Swapped in "+nu.n, ()=>{ S.plan=prevPlan; S.locked=prevLocked; save(); render(); });
}

/* ---- tonight: effort + hero ---- */

/* an unplanned dish starts at the fewest servings that make sense on its gear */
function defaultServ(r){ return Math.max(1, r.minServ || 1); }

/* ---- sheet ---- */
function openSheet(rid){ U.sheet = rid; render(); }

/* ---- cook mode ----
   step 0 is "before you start": servings, rounds, and what the rice cooker should be doing.
   Steps 1..n are the recipe with every braced quantity scaled to the servings in this round. */
function startCook(rid, serv){
  const r = rec(rid); if (!r) return;
  clearTimeout(U._toastTimer); U.toast = null;
  U.sheet=null; U.cook=rid; U.step=0; U.round=1; U.serv=Math.max(defaultServ(r), serv||1); render();
}

function cookServ(d){

  U.serv = Math.min(8, Math.max(defaultServ(r), U.serv + d)); render();

/* servings cooked in round k of this session: full rounds first, the remainder last */
function roundServ(r, total, k){
  const n = roundsFor(r, total); if (n === 1) return total;
  return Math.max(1, Math.min(r.cap, total - r.cap*(k-1)));
}
/* Air-fryer rounds share the prep: cutting, marinating and coating happen once for the whole
   batch, and only the basket steps (from the preheat on) repeat per round. Other gear repeats
   the whole recipe, because a pan or pot round is the recipe. Index is 0-based. */
function cookFrom(r){ const i = r.gear.includes("air") ? r.steps.findIndex(s=>/Preheat/.test(s)) : 0; return Math.max(0, i); }
function stepServ(r, i){ return i < cookFrom(r) ? U.serv : roundServ(r, U.serv, U.round); }
function prevStep(){
  if (U.round>1 && U.step===cookFrom(rec(U.cook))+1) { U.round--; U.step = rec(U.cook).steps.length; }
  else if (U.step>0) U.step--;
  else U.cook=null;
  render();
}
function nextStep(){
  const r = rec(U.cook); if (!r) { U.cook=null; render(); return; }
  if (U.step < r.steps.length) { U.step++; render(); return; }
  const rounds = roundsFor(r, U.serv);
  if (U.round < rounds) { U.round++; U.step = cookFrom(r)+1; render(); return; }
  const kd = keepDaysOf(r);
  const msg = "Done. " + (kd===1 ? "Eat it now." : "Leftovers keep "+kd+" days"+(r.freeze?" · "+r.freeze:"")+".");
  U.cook=null; U.step=0; U.round=1; U.effort=null; U.heroIdx=0;
  save(); render();
  flash(msg);
}

/* ============ DERIVED ============ */
function compute(){
  if (!S.plan) return null;
  const picks = S.plan.map(id=>rec(id)).filter(Boolean);
  if (!picks.length) return null;
  const N = S.N, servings = {};
  picks.forEach((r,i)=>{ servings[r.id] = Math.floor(N/picks.length) + (i < N%picks.length ? 1 : 0); });
  /* An even split ignores the gear: 7 meals over curry (3 a pot) and karaage (2 a basket) came
     out 4/3, which is two rounds of each. Move servings from a dish that overflows its gear to
     one with room, so the week cooks in as few rounds as the gear allows. */
  const rnd = r => Math.ceil(servings[r.id] / (r.cap || 2));
  const total = () => picks.reduce((a,r)=>a+rnd(r), 0);
  for (let pass=0, better=true; better && pass<40; pass++) {
    better = false;
    picks.forEach(a=>picks.forEach(b=>{
      if (a===b || servings[a.id]<=1) return;
      const before = total(); servings[a.id]--; servings[b.id]++;
      if (total() < before) better = true; else { servings[a.id]++; servings[b.id]--; }
    }));
  }
  const g = {}; let riceGo = 0, mugiCups = 0, sideCups = 0;
  picks.forEach(r=>{
    const s = servings[r.id];
    riceGo += (r.rice||0)*s;
    if (riceKind(r)==="side" || riceKind(r)==="cooked") sideCups += r.rice*s;
    if (S.mugi && !r.cookin) mugiCups += (r.rice||0)*s;
    ingsOf(r).forEach(([id,q])=>{ g[id]=(g[id]||0)+q*s; });
  });
  if (mugiCups > 0) g.mugi = (g.mugi||0) + mugiCups*50;
  /* rice was never costed at all, so the grocery total ran ~20% light and the savings
     headline ran the same amount heavy. Set its price to 0 in Shop while a gifted bag lasts. */
  if (riceGo > 0) g.rice = (g.rice||0) + Math.round(riceGo*150);
  let food = 0;
  const rows = Object.entries(g).map(([id,q])=>{
    const it = ING[id];
    const buy = it.u==="pc" ? Math.ceil(q) : Math.ceil(q/50)*50;
    const cost = buy*priceOf(id); food += cost;
    return {id, cat:it.cat, n:it.n, jp:it.jp, disp: it.u==="pc" ? buy+(buy>1?" pcs":" pc") : buy+" g", cost};
  });
  const needed = [...new Set(picks.flatMap(r=>r.conds))];
  return {picks, servings, N, rows, food, riceGo, sideCups, mugiCups, needed};
}

/* A week is only 2–3 dishes, so it usually cannot answer all three effort questions —
   61% of generated weeks contain no zero-effort dish at all. Tonight therefore falls back
   to the rest of the roster rather than answering "zero effort" with a 30-minute stew.
   Off-plan dishes are always ranked last and always labelled, because they have not been
   shopped for. The order is stable for a given week so the suggestion does not move
   under you between renders, but differs from week to week. */
function planSeed(){
  const s = (S.plan||[]).join(",") + "|" + S.N + "|" + S.v;
  let h = 0;
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function rotated(list, salt){
  if (list.length < 2) return list;
  const k = (planSeed()+salt) % list.length;
  return list.slice(k).concat(list.slice(0,k));
}
function candidates(c){
  const eff = U.effort;
  const planned = c ? c.picks : [];
  const inPlan = planned.filter(r=>r.eff<=eff).map(r=>({kind:"cook", r, eff:r.eff, serv:c.servings[r.id]}));
  const offPlan = rotated(RECIPES.filter(r=>r.eff===eff && !planned.some(p=>p.id===r.id)), eff)
    .map(r=>({kind:"offplan", r, eff:r.eff}));
  if (eff===2) {
    /* asked for a batch day: answer with an anchor. If the week has none, an off-plan
       anchor is a better answer than a 12-minute pan dish — batching is the whole request. */
    const anchors = inPlan.filter(o=>o.r.eff===2);
    const others = inPlan.filter(o=>o.r.eff!==2);
    return [...anchors, ...offPlan, ...others];
  }
  /* asked for something easy: the plan first, hardest first, then the roster */
  return [...inPlan.sort((a,b)=>b.eff-a.eff), ...offPlan];
}
function roundsFor(r, s){ return (!r.cap || s <= r.cap) ? 1 : Math.ceil(s / r.cap); }
function roundsLabel(r, s){
  const n = roundsFor(r, s);
  if (n === 1) return "one go";
  return n + " rounds";
}
/* minutes to the table; side rice is its own clock, so it is named rather than added in */
function readyLabel(r){ return "ready ~"+r.ready+" min"+(riceKind(r)==="side" ? " + rice" : ""); }
function capLabel(r){
  if (!r.cap) return "no limit";
  return r.cap + " a round";
}
function gearTips(r, s){
  const t = [];
  const cp = r.cap;
  if (cp && s>cp) t.push(cp===1
    ? "This dish only works one serving at a time — do "+s+" quick rounds back-to-back."
    : "×"+s+" servings won't fit in one go — cook "+Math.ceil(s/cp)+" rounds of ~"+cp+".");
  if (r.crowd) t.push("Doing 2+ servings at once? Split into rounds — a crowded 26 cm pan steams instead of sears.");
  if (r.plate) t.push("Cooking plate: plain rice underneath only, food spread out rather than piled, and lift the plate out when it beeps — never keep warm with it in. Tiger caps the rice at 1 go with the plate in: half a cup a serving, two servings a run.");
  if (r.minServ && s < r.minServ) t.push("The simmer menu needs at least "+r.minServ+" servings in the pot, or it sits under the bottom mark and can boil over.");
  return t;
}

/* what the other appliances do while a batch anchor cooks — the whole point of a cook day */
function pairingFor(r, c, riceRun){
  const bits = [];
  const busyCooker = r.simmer || r.cookin || r.plate;
  if (riceKind(r) === "cooked") bits.push("It wants day-old rice, so cook "+Math.round(r.rice*c.servings[r.id]*2)/2+" cups the day before and keep them in the fridge.");
  else if (busyCooker) bits.push("It has the rice cooker for ~"+r.ready+" min, so any rice for the week goes in before it.");
  else if (riceRun > 0) bits.push("Put "+riceRun+" cup"+(riceRun>1?"s":"")+" of rice on first ("+COOKER.whiteMin+" min), then start prepping — they finish together.");
  const prep = c.picks.filter(p=>p!==r && p.gear.includes("air") && /raw/.test(p.freeze||""));
  if (prep.length && !r.gear.includes("air")) bits.push("While it simmers, marinate the "+prep[0].n.replace(/^Air-fryer /,"")+" and bag it for later in the week.");
  return bits.join(" ");
}
function rhythmHTML(c){
  const bat = c.picks.filter(r=>r.batch && c.servings[r.id]>=3);
  const quick = c.picks.filter(r=>!bat.includes(r));
  const rounds = r => { if (!r.cap || c.servings[r.id]<=r.cap) return " One go.";
    return r.cap===1 ? " One serving per run, so "+c.servings[r.id]+" quick rounds back to back."
      : " Your gear fits ~"+r.cap+" per run — "+Math.ceil(c.servings[r.id]/r.cap)+" rounds back to back."; };
  /* side rice: cooked in 3-cup runs, the first alongside Sunday's anchor, the rest Wednesday's */
  const side = Math.ceil(c.sideCups*2)/2;
  const runs = side ? Math.ceil(side/COOKER.white) : 0;
  const run1 = Math.min(side, COOKER.white), run2 = Math.max(0, side-run1);
  const rows = [];
  if (bat[0]) rows.push(["日 SUN", "All "+c.servings[bat[0].id]+" servings of "+bat[0].n+" ("+GEARLABEL[bat[0].gear[0]]+")."+rounds(bat[0])+" "+pairingFor(bat[0], c, run1)+(bat[0].freeze?" "+cap1(bat[0].freeze)+".":"")]);
  if (bat[1]) rows.push(["水 WED", "Top up with "+bat[1].n+" ("+GEARLABEL[bat[1].gear[0]]+")."+rounds(bat[1])+" "+pairingFor(bat[1], c, run2)]);
  bat.slice(2).forEach(r=>rows.push(["ALSO", "Batch "+r.n+" ("+c.servings[r.id]+" servings)."+rounds(r)]));
  quick.forEach(r=>rows.push([r.time.replace(" min"," MIN").toUpperCase(), r.n+" × "+c.servings[r.id]+", cooked fresh — "+(r.batch?"batchable, but at this size fresher is easier":"too quick to be worth batching")+"."+rounds(r)]));
  const own = c.picks.filter(r=>riceKind(r)==="self").map(r=>r.n);
  let riceTxt = side
    ? side+" cooker cup"+(side>1?"s":"")+" of side rice ("+Math.round(side*150)+" g dry). The JAJ-A550 takes 3 a run"
      + (runs>1 ? ", so "+runs+" runs: "+run1+" with Sunday's cook, "+run2+" with Wednesday's" : ", so one run")
      + ". Freeze what you will not eat in 2 days — the 355 ml pots or flat in bags, 3 min in the microwave."
    : "No side rice this week.";
  if (own.length) riceTxt += " "+own.join(", ")+(own.length>1?" cook":" cooks")+" its own rice, on a separate run.";
  if (S.mugi && c.mugiCups>0) riceTxt += " Mochi-mugi on: add "+Math.round(c.mugiCups*50)+" g barley across the plain rice (50 g per cup) plus 100 ml extra water per cup, same cycle. Seasoned-rice dishes stay white.";
  rows.push(["米 RICE", riceTxt]);
  let h = '<div class="bigrow" style="margin:38px 0 4px;align-items:center"><h3 class="sectionlabel">The rhythm</h3>'
    + '<button class="mugitoggle'+(S.mugi?" on":"")+'" data-k="mugi" onclick="toggleMugi()" aria-pressed="'+S.mugi+'" title="Barley into the plain rice at 3:1 — 50 g per cooker-cup, about ¥20 a serving, ten times the fibre. Same cycle, same effort.">mochi-mugi '+(S.mugi?"ON":"OFF")+'</button></div>'
    + '<div class="dividerlist">';
  rows.forEach(([when,what])=>{ h += '<div class="schedrow"><div class="schedwhen jpx">'+when+'</div><div class="schedwhat">'+what+'</div></div>'; });
  h += '</div>';
  h += rulesHTML();
  return h;
}

}
function renderTabBar(c){
  const TABS = [["tonight","今夜","Tonight"],["week","献立","Week"],["shop","買物","Shop"],["save","貯金","Saved"]];
  const shopDone = c ? c.rows.filter(r=>S.bought[r.id]).length : 0;
  document.getElementById("tabbar").innerHTML = TABS.map(([t,jp,en])=>{
    let badge = "";
    if (t==="shop" && c && shopDone) badge = " "+shopDone+"/"+c.rows.length;
    return '<button class="tabbtn'+(S.tab===t?" on":"")+'" data-k="tab'+t+'"'+(S.tab===t?' aria-current="page"':"")
      + ' onclick="setTab(\''+t+'\')"><span class="tabjp" lang="ja">'+jp+'</span><span class="taben">'+en+badge+'</span></button>';
  }).join("");
}
function toastHTML(){
  if (!U.toast) return {show:false, html:""};
  let h = '<span>'+U.toast.msg+'</span>';
  if (U.toast.undo) h += '<button data-k="toastundo" onclick="runToastUndo()">Undo</button>';
  return {show:true, html:h};
}

/* ============ TOP-LEVEL RENDER ============ */
function render(){
  const ae = document.activeElement;
  const fk = ae && ae.dataset ? ae.dataset.k : null;
  /* tabs are replaced wholesale via innerHTML, which wipes anything half-typed.
     Keep the field being typed in, and always keep the free-text spend box. */
  const typedVal = (ae && ae.tagName==="INPUT" && fk) ? ae.value : null;
  const spentEl = document.getElementById("spentInput");
  const spentVal = spentEl ? spentEl.value : null;
  const c = compute();
  document.getElementById("tab-tonight").innerHTML = tonightHTML(c);
  document.getElementById("tab-week").innerHTML = weekHTML(c);
  document.getElementById("tab-shop").innerHTML = shopHTML(c);
  document.getElementById("tab-save").innerHTML = saveHTML();
  renderTabBar(c);
  ["tonight","week","shop","save"].forEach(t=>{
    document.getElementById("tab-"+t).className = "wrap tab"+(S.tab===t?" on":"");
  });
  const sh = sheetHTML(c);
  const sheetEl = document.getElementById("sheet-overlay");
  sheetEl.innerHTML = sh.html;
  sheetEl.classList.toggle("show", sh.show);
  const ck = cookHTML();
  const cookEl = document.getElementById("cook-overlay");
  cookEl.innerHTML = ck.html;
  cookEl.classList.toggle("show", ck.show);
  const ts = toastHTML();
  const toastEl = document.getElementById("toast");
  toastEl.innerHTML = ts.html;
  toastEl.classList.toggle("show", ts.show);
  document.querySelectorAll(".jp,.jpx").forEach(el=>el.setAttribute("lang","ja"));

  /* an overlay is modal: the page behind it takes no focus, no pointer, no scroll */
  const overlaid = sh.show || ck.show;
  ["main","tabbar"].forEach(id=>{
    const el = document.getElementById(id); if (!el) return;
    if (overlaid) el.setAttribute("inert",""); else el.removeAttribute("inert");
  });
  document.body.classList.toggle("noscroll", overlaid);
  document.body.classList.toggle("cooking", ck.show);

  /* put back what the user had typed, then where they were */
  if (U._clearSpent) { U._clearSpent = false; }
  else if (spentVal) { const el = document.getElementById("spentInput"); if (el) el.value = spentVal; }
  if (fk) {
    const el = document.querySelector('[data-k="'+fk+'"]');
    if (el) {
      if (typedVal !== null && el.tagName==="INPUT") el.value = typedVal;
      if (el.focus) el.focus();
    }
  }
  /* opening an overlay moves focus into it, or keyboard users stay stranded behind it */
  if (overlaid) {
    const box = ck.show ? cookEl : sheetEl;
    if (!box.contains(document.activeElement)) {
      const first = box.querySelector("button,input,[tabindex]");
      if (first && first.focus) first.focus();
    }
  }
}
/* Escape backs out of whatever is on top */
if (typeof document !== "undefined") {
  document.addEventListener("keydown", e=>{
    if (e.key !== "Escape") return;
    if (U.cook) { quitCook(); }
    else if (U.sheet) { closeSheet(); }
  });
}

/* last resort: a corrupt save must never leave a blank app with no way back, and must never
   leave one that fails again on every reload — so each attempt throws away strictly more */
try { render(); } catch (e) {
  delete S.plan; S.protein = {}; S.bought = {}; S.tab = "tonight";
  S.log = S.log.filter(l=>l && typeof l.d==="string" && Number.isFinite(l.spent) && Number.isFinite(l.meals));
  save();
  try { render(); } catch (e2) {
    try { localStorage.removeItem("lmp"); } catch (e3) {}
    S = {owned:{oil:true}, locked:[], bought:{}, protein:{}, log:[], recent:[], N:7, v:2, tab:"tonight", price:{}, mugi:false};
    U = { effort:null, heroIdx:0, sheet:null, cook:null, step:0, serv:1, round:1, priceAll:false, toast:null, _toastTimer:null };
    try { render(); } catch (e4) {
      document.getElementById("tab-tonight").className = "wrap tab on";
      document.getElementById("tab-tonight").innerHTML = '<div class="emptycard">Something went wrong, so your saved week was cleared. Reload and tap Generate my week.</div>';
    }
  }
}
</script>
