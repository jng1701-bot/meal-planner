<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meals">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
<title>Lazy Meal Planner</title>
<meta name="description" content="One pot, one pan, a rice cooker and a 4.2 L air fryer: how much effort have you got tonight? Plan a week, shop at LIFE, cook it in as few rounds as the gear allows, and see what you save.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f141a; --ink:#eef2f5; --sub:#c3cfd9; --muted:#8b99a6; --muted2:#7d8b99; --dim:#74848f; --faint:#7a8896;
  --mint:#7fd4a8; --warm:#e8825a; --warmsoft:#f0c3ad;
  --line:rgba(255,255,255,.09); --line3:rgba(255,255,255,.16);
  --condoff:#76848f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;
  font:16px/1.5 "Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}
body.noscroll{overflow:hidden;position:fixed;left:0;right:0;bottom:0}
.nowrap{white-space:nowrap}
:lang(ja){line-break:strict}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
h1,h2,h3{margin:0;font-size:inherit;font-weight:inherit}
a{color:var(--mint)}
button{font-family:inherit}
::-webkit-scrollbar{width:0}
@keyframes lmpUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lmpIn{from{opacity:0}to{opacity:1}}
@keyframes lmpSheet{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 22px 34px;display:none}
.wrap.on{display:block;animation:lmpIn .22s ease both}

.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.eyebrow.mint{color:var(--mint)}
.bigrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--dim)}
.kicker.mint{color:var(--mint)}
.sectionlabel{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.bignum{font-size:52px;line-height:.9;font-weight:900;letter-spacing:-.04em}
.bignum.mint{color:var(--mint);font-size:56px;letter-spacing:-.045em}
.bignumlabel{font-size:13px;color:var(--muted2);font-weight:500;margin-top:6px}
.subline{font-size:13px;color:var(--muted2);font-weight:500;margin-top:8px}
.footnote{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.55;color:var(--muted2)}
.emptynote{border-top:1px solid var(--line);padding:34px 0;font-size:14.5px;color:var(--muted2);line-height:1.6}
.emptycard{text-align:center;color:var(--muted2);padding:44px 16px;font-size:15px;line-height:1.6}
.jp{color:var(--muted2)}

.hlist{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.hlist.row3,.hlist.row2{flex-direction:row}
/* structural only — never set background/color here, or it out-specifies .cta/.varon/.stepbtn/.logbtn */
.hlist>button{flex:1;border:none;cursor:pointer;font-family:inherit}

/* ---- tonight: effort picker ---- */
.hero1{font-size:38px;line-height:1.07;font-weight:900;letter-spacing:-.03em;margin-top:6px}
.effrow{display:flex;align-items:center;gap:18px;padding:20px 4px;text-align:left;width:100%;background:var(--bg);color:var(--ink);min-height:44px}
.effrow:active{background:#151d25}
.effjp{font-size:26px;font-weight:900;color:var(--mint);min-width:62px;letter-spacing:-.02em}
.effbody{flex:1;min-width:0;display:flex;flex-direction:column}
.effen{font-size:19px;font-weight:700;color:var(--ink)}
.effsub{font-size:13.5px;color:var(--muted2);margin-top:2px}
.arrow{color:var(--faint);font-size:20px}
.setupline{font-size:15px;color:var(--sub);line-height:1.6;margin-top:16px}
.setupline.mint{color:var(--mint)}
.setupline.warm{color:var(--warmsoft)}
body.cooking #toast{bottom:calc(128px + env(safe-area-inset-bottom))}

/* ---- tonight: answered ---- */
.backlink{background:none;border:none;color:var(--muted2);font-size:13px;font-weight:700;padding:10px 2px;margin-left:-2px;cursor:pointer;letter-spacing:.04em;min-height:44px;display:inline-flex;align-items:center}
.hero2{font-size:36px;line-height:1.06;font-weight:900;letter-spacing:-.03em;margin-top:8px}
.herojp{font-size:15px;margin-top:6px;font-weight:500}
.herowhy{font-size:15px;color:var(--sub);margin-top:20px;line-height:1.55;max-width:320px}
.herocta{margin-top:26px}
.herocta.hlist{flex-direction:row}
.cta{background:var(--mint);color:#0f141a;border:none;padding:17px 8px;font-size:16px;font-weight:900;cursor:pointer;letter-spacing:-.01em;width:100%}
.herocta .cta{flex:2}
.nah{background:var(--bg);color:var(--sub);border:none;padding:17px 20px;font-size:15px;font-weight:700;cursor:pointer;flex:1;white-space:nowrap}
.altrow{display:flex;align-items:center;gap:14px;padding:15px 4px;text-align:left;width:100%;background:var(--bg);color:var(--ink);min-height:44px}
.altrow:active{background:#151d25}
.altbody{flex:1;min-width:0;display:flex;flex-direction:column}
.altn{font-size:16px;font-weight:700;color:var(--ink)}
.altmeta{font-size:12.5px;color:var(--muted2);margin-top:1px}
.altbadge{font-size:12px;font-weight:700}
.altbadge.muted{color:var(--muted2)}

/* ---- week ---- */
.stepbtn{width:46px;height:46px;font-size:24px;font-weight:700;color:var(--mint);background:var(--bg)}
.varon{background:var(--ink);color:#0f141a;padding:12px 6px;font-size:12.5px;font-weight:700;line-height:1.3}
.varon:disabled,.varoff:disabled{opacity:.45;cursor:default}
#spentInput::placeholder{color:var(--muted)}
.varoff{background:var(--bg);color:var(--muted2);padding:12px 6px;font-size:12.5px;font-weight:700;line-height:1.3}
.ghostbtn{width:100%;margin-top:14px;background:none;border:1px solid var(--line3);color:var(--ink);padding:15px;font-size:15px;font-weight:700;cursor:pointer}
.ghostbtn:active{background:#151d25}
.ghostbtn.small{width:auto;margin-top:10px;padding:10px 14px;font-size:13.5px;min-height:44px}
.dividerlist{display:flex;flex-direction:column}
.dishrow{border-top:1px solid var(--line);padding:16px 0;display:flex;gap:14px;align-items:flex-start}
.dishnum{font-size:12px;font-weight:900;color:var(--muted2);padding-top:5px;min-width:16px}
.dishmain{flex:1;min-width:0}
.dishopen{background:none;border:none;padding:2px 0;text-align:left;cursor:pointer;display:block;width:100%;min-height:44px}
.dishname{display:block;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.dishjp{display:block;font-size:12.5px;margin-top:1px}
.dishmeta{font-size:12px;color:var(--muted);margin-top:8px;font-weight:500}
.dishacts{display:flex;gap:10px;margin-top:4px}
.dishacts button{background:none;border:none;padding:12px 10px;margin-left:-10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted2);white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
.dishserv{font-size:20px;font-weight:900;color:var(--mint);letter-spacing:-.02em}
.mugitoggle{background:none;border:1px solid var(--line3);color:var(--muted2);font-size:12px;font-weight:700;padding:10px;cursor:pointer;min-height:44px}
.mugitoggle.on{color:var(--mint);border-color:var(--mint)}
.schedrow{border-top:1px solid var(--line);padding:15px 0;display:flex;gap:16px}
.schedwhen{min-width:74px;font-size:12.5px;font-weight:900;color:var(--mint);letter-spacing:.02em;padding-top:2px}
.schedwhat{flex:1;font-size:14px;line-height:1.55;color:var(--sub)}

/* ---- shop ---- */
.progtrack{height:3px;background:var(--line);margin-top:18px}
.progfill{height:3px;background:var(--mint);transition:width .3s ease}
.clearlink{background:none;border:none;color:var(--muted2);font-size:12.5px;font-weight:700;padding:12px 0;cursor:pointer;min-height:44px}
.ghead2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:26px 0 2px}
.shoprow{width:100%;border:none;border-top:1px solid var(--line);background:none;display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer;text-align:left}
.shopline{display:flex;align-items:center;border-top:1px solid var(--line)}
.shopline .shoprow{border-top:none;flex:1;min-width:0}
.havechip{flex:0 0 auto;min-height:44px;margin-left:10px;padding:0 10px;background:none;border:1px solid var(--line3);color:var(--muted2);font-size:12px;font-weight:700;cursor:pointer}
.checkbox{width:20px;height:20px;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;color:#0f141a;font-size:12px;font-weight:900;flex:0 0 20px}
.checkbox.on{border-color:var(--mint);background:var(--mint)}
.shopmain{flex:1;min-width:0}
.shopn{display:block;font-size:15.5px;font-weight:700;color:var(--ink)}
.shopn.strike{text-decoration:line-through}
.shopjp{display:block;font-size:12px;margin-top:1px}
.shopamt{text-align:right}
.shopqty{display:block;font-size:14px;font-weight:700;color:var(--sub)}
.shopcost{display:block;font-size:12px;color:var(--muted2)}
details.detailsblock{margin-top:24px}
details.detailsblock summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;color:var(--ink);cursor:pointer;list-style:none;font-size:14.5px;border-top:1px solid var(--line);padding-top:18px}
details.detailsblock summary::-webkit-details-marker{display:none}
details.detailsblock summary::after{content:"▾";color:var(--muted2);font-size:13px;flex:0 0 auto}
details.detailsblock[open] summary::after{content:"▴"}
.detailsnote{color:var(--muted2);font-size:13px;line-height:1.55;margin:10px 0}
.pricerow{display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px;border-bottom:1px solid var(--line);padding:6px 0}
.pricerow:last-of-type{border-bottom:none}
.pricename{flex:1;min-width:0}
.priceunit{color:var(--muted2);font-size:12.5px;white-space:nowrap}
.pricerow input{width:82px;min-height:44px;background:var(--bg);border:1px solid var(--line3);color:var(--ink);font:15px inherit;padding:4px 8px;border-radius:0}

/* ---- shelf ---- */
.condgrid{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border-top:1px solid var(--line);padding-top:1px}
.condbtn{background:var(--bg);border:none;padding:13px;cursor:pointer;color:var(--condoff);font-size:13px;font-weight:700;flex:1 1 auto;min-height:44px}
.condbtn.on{color:var(--mint)}
.condbtn.fr1{color:var(--mint)}
.condbtn .frq{display:block;font-size:12px;font-weight:500;color:var(--sub);margin-top:2px}
/* ---- saved ---- */
.hlist.row2 input{flex:1;min-width:0;background:var(--bg);border:none;box-shadow:inset 0 -1px 0 var(--line3);color:var(--ink);font:700 17px inherit;padding:15px 14px;outline:none}
.hlist.row2 input:focus-visible{outline:2px solid var(--mint);outline-offset:-2px}
.logbtn{background:var(--bg);border:none;color:var(--mint);font-size:14px;font-weight:900;padding:15px 20px;cursor:pointer;white-space:nowrap}
.logrow2{border-top:1px solid var(--line);padding:14px 0;display:flex;align-items:center;gap:12px}
.logd{font-size:12.5px;color:var(--muted2);min-width:44px;font-weight:700}
.logspent{font-size:14px;color:var(--sub);min-width:56px;font-weight:700}
.logbar{flex:1;height:6px;background:rgba(255,255,255,.07);display:block}
.logbar>span{display:block;height:6px;background:var(--mint)}
.logsaved{font-size:14px;font-weight:900;color:var(--mint)}
.logdel{background:none;border:none;color:var(--muted2);font-size:15px;cursor:pointer;padding:0;min-width:44px;min-height:44px}

/* ---- tab bar ---- */
nav#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;border-top:1px solid var(--line);
  background:rgba(15,20,26,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding-bottom:env(safe-area-inset-bottom);z-index:10;max-width:560px;margin:0 auto}
.tabbtn{flex:1;background:none;border:none;padding:11px 2px 15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.tabbtn.on{color:var(--mint)}
.tabjp{font-size:15px;font-weight:700;line-height:1}
.taben{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* ---- sheet ---- */
#sheet-overlay{position:fixed;inset:0;background:rgba(7,9,11,.7);display:none;align-items:flex-end;z-index:30}
#sheet-overlay.show{display:flex;animation:lmpIn .2s ease both}
.sheetcard{width:100%;max-width:560px;margin:0 auto;max-height:82vh;overflow-y:auto;background:#0f141a;
  border-top:1px solid var(--line3);padding:22px 22px calc(34px + env(safe-area-inset-bottom));
  animation:lmpSheet .3s cubic-bezier(.2,.8,.2,1) both}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.sheettitle{min-width:0}
.sheetname{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.sheetjp{font-size:13.5px;margin-top:3px}
.closeb{background:none;border:none;color:var(--muted2);font-size:20px;cursor:pointer;padding:0;line-height:1;min-width:44px;min-height:44px;margin:-12px -12px 0 0;display:inline-flex;align-items:center;justify-content:center}
.sheetfacts{display:flex;flex-wrap:wrap;gap:14px 20px;margin-top:20px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.factv{font-size:16px;font-weight:900;color:var(--ink);letter-spacing:-.01em}
.factk{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-top:3px}
.sheetwarn{margin-top:16px;padding-left:12px;border-left:2px solid var(--warm);font-size:13.5px;line-height:1.55;color:var(--warmsoft)}
.sheeting{font-size:14.5px;line-height:1.65;color:var(--sub);margin-top:8px}
.sheetconds{font-size:13px;line-height:1.6;color:var(--muted2);margin-top:8px}
.srclink{color:var(--sub);text-decoration:underline;text-underline-offset:3px;display:inline-block;padding:12px 0}
.flexbtn{min-height:44px;margin-top:16px;background:none;border:1px solid var(--line3);color:var(--ink);padding:11px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.sheetcard>.cta{margin-top:24px}

/* ---- cook mode ---- */
#cook-overlay{position:fixed;inset:0;background:#0f141a;display:none;flex-direction:column;z-index:40;overflow:hidden}
#cook-overlay.show{display:flex;animation:lmpIn .2s ease both}
.cookhead{padding:calc(20px + env(safe-area-inset-top)) 22px 0;display:flex;align-items:center;gap:14px}
.quitb{background:none;border:none;color:var(--muted2);font-size:13px;font-weight:700;cursor:pointer;padding:0 12px 0 0;min-height:44px;min-width:44px}
.stepdots{flex:1;display:flex;gap:4px}
.stepdots .dot{width:auto;flex:1;height:3px;border-radius:0;background:var(--line3)}
.stepdots .dot.on{background:var(--mint)}
.wakeb{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;padding:0 0 0 12px;white-space:nowrap;min-height:44px}
.wakeb.on{color:var(--mint)}
.cookbody{flex:1;overflow-y:auto;padding:34px 22px 22px}
.stepcount{font-size:13px;font-weight:700;color:var(--muted);margin-top:18px;letter-spacing:.04em}
.steptext{font-size:22px;line-height:1.45;font-weight:500;letter-spacing:-.01em;margin-top:10px}
.portstepper{display:flex;align-items:center;gap:1px;margin-top:28px;background:var(--line3)}
.portstepper button{width:56px;height:56px;background:#0f141a;border:none;color:var(--mint);font-size:26px;font-weight:700;cursor:pointer}
.portval{flex:1;background:#0f141a;height:56px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.cookfoot{background:#0f141a;padding-bottom:calc(34px + env(safe-area-inset-bottom))}
.cookfoot.hlist{flex-direction:row;padding-top:1px}
.backb{background:#0f141a;border:none;color:var(--muted2);padding:19px 24px;font-size:15px;font-weight:700;cursor:pointer}
.cookfoot .cta{flex:1;padding:19px}

/* ---- toast ---- */
#toast{position:fixed;left:22px;right:22px;bottom:calc(100px + env(safe-area-inset-bottom));max-width:516px;margin:0 auto;
  background:var(--ink);color:#0f141a;padding:13px 16px;font-size:13.5px;font-weight:700;display:none;
  align-items:center;justify-content:space-between;gap:12px;z-index:50}
#toast.show{display:flex;animation:lmpUp .2s ease both}
#toast button{background:none;border:none;color:inherit;font:900 13px inherit;cursor:pointer;text-decoration:underline;white-space:nowrap;min-height:44px;min-width:44px;padding:0 6px}

button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
</style>
</head>
<body>
<noscript><p style="padding:24px;text-align:center">This app needs JavaScript to run — please enable it.</p></noscript>

<h1 class="vh">Lazy Meal Planner</h1>
<main id="main">
<div class="wrap tab" id="tab-tonight"></div>
<div class="wrap tab" id="tab-week"></div>
<div class="wrap tab" id="tab-shop"></div>
<div class="wrap tab" id="tab-save"></div>
</main>

<nav id="tabbar" aria-label="Sections"></nav>
<div id="sheet-overlay" role="dialog" aria-modal="true" aria-label="Dish details" onclick="if(event.target===this){ if (U.fridge) closeFridge(); else closeSheet(); }"></div>
<div id="cook-overlay" role="dialog" aria-modal="true" aria-label="Cook mode"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ CONDIMENT CORE ============ */
const CONDS = {
  soy:{n:"Soy sauce",jp:"国産しょうゆ（濃口）",p:322}, mirin:{n:"Mirin",jp:"本みりん 1L",p:416},
  sake:{n:"Cooking sake",jp:"料理酒 1L",p:225}, mentsuyu:{n:"Mentsuyu (triple-strength)",jp:"めんつゆ 3倍濃縮",p:330},
  sesame:{n:"Sesame oil",jp:"ごま油",p:376},
  torigara:{n:"Chicken stock powder",jp:"がらスープの素 200g",p:538}, dashi:{n:"Hondashi",jp:"ほんだし",p:350},
  miso:{n:"Miso",jp:"味噌",p:425},
  mayo:{n:"Kewpie mayo",jp:"マヨネーズ",p:280}, garlic:{n:"Garlic paste",jp:"おろし生にんにく お徳用",p:376},
  ginger:{n:"Ginger paste",jp:"おろし生しょうが お徳用",p:376}, oil:{n:"Cooking oil",jp:"サラダ油",p:450},
  katakuriko:{n:"Potato starch",jp:"片栗粉",p:200},
  panko:{n:"Panko breadcrumbs",jp:"パン粉",p:150},
  pepper:{n:"Black pepper",jp:"朝岡 黒胡椒 中荒 35g",p:594},
  ponzu:{n:"Ponzu",jp:"ポン酢",p:342},
  cheese:{n:"Grated parmesan",jp:"粉チーズ",p:320},
  salt:{n:"Salt",jp:"塩",p:110},
  /* added with the 25 Sep 2026 roster: shelf estimates until a receipt pins them */
  consomme:{n:"Consommé granules",jp:"コンソメ（顆粒）",p:300},
  ketchup:{n:"Ketchup",jp:"ケチャップ",p:250},
  chilipowder:{n:"Chili powder",jp:"チリパウダー",p:300},
  oyster:{n:"Oyster sauce",jp:"オイスターソース",p:300},
  /* both come from Singapore/Malaysia, not LIFE — prices are rough jar estimates, only shown if one runs out */
  belachan:{n:"Belachan chilli",jp:"ブラチャン（サンバル）",p:700},
  chinchalok:{n:"Chinchalok",jp:"チンチャロク",p:600}
};
/* Bought by the bag, not the week: a 5 kg sack lasts a month or two, so rice and barley sit on
   the shelf like a condiment and only reach the list once marked out. */

  src:["クラシル","https://www.kurashiru.com/recipe_cards/e7237f9b-b9ed-40cb-b28e-8af05005ecd1"],

  steps:["The cooker is busy for about 1½ hours with this. Want rice with it? Cook it first and set it aside, or use frozen rice.","A {100 g} pork shoulder block, patted dry, into the cooker with {15 ml} soy sauce, {15 ml} mirin, {15 ml} sake, {50 ml} water, 1 tsp each garlic and ginger paste, and the green top of a green onion.","Check the level: everything must sit between the white-rice 1 and 3 marks on the inner pot. Under the bottom mark it can boil over; over the top one it will not cook through.","Press the simmer menu and set the timer to 60 min. No roux, no starch, no thickener of any kind — they catch on the bottom.","When it beeps, cut the thickest part: no pink, juices clear. Rest it in the sauce 10 min, then slice 5 mm thick. Keeps 3 days in its sauce.","At each meal: slices over rice with sauce, sliced green onion and {0.5 cucumber|cucumbers}; 80 g frozen spinach, 600 W for 2 min, squeezed, with a drop of sesame oil."]},
 {id:"rcrisotto", tier:"B", cookin:true, menu:"risotto", n:"Rice-cooker mushroom & spinach risotto", jp:"炊飯器リゾット", gear:["rice"], time:"5 min prep", ready:40, eff:1, batch:false, cap:1, keep:1,
  src:["クラシル","https://www.kurashiru.com/recipes/325a2113-637b-4418-bccf-22322147e389"],
  ing:[["shimeji",40],["bacon",30],["fspinach",70]], after:["fspinach"], rice:1, conds:["consomme","cheese","pepper","oil"],
  steps:["Rinse {150 g} rice once, quickly — risotto keeps some starch — and put it straight into the cooker without leaving it to drain.","Add {30 g} bacon in strips, {40 g} shimeji torn apart, {1 tsp} consommé granules and {5 ml} oil, then water to the risotto line for 1 cup. The risotto menu takes 1 cup at most, so this is one serving a run.","Press the risotto menu (about 30 min).","When it beeps, stir in {70 g} frozen spinach, {15 g} grated parmesan and a hard grind of black pepper. Cheese goes in now and not before — dairy in the cycle catches on the bottom and can foam over.","Lid down 5 min so the spinach heats through, then stir and eat straight away."]},
 {id:"rcchahan", tier:"B", cookin:true, menu:"chahan", n:"Rice-cooker chahan", jp:"炊飯器チャーハン", gear:["rice"], time:"5 min prep", ready:45, eff:1, batch:false, cap:2,
  src:["クラシル","https://www.kurashiru.com/recipes/cc6a8bf5-e28a-4e3a-9245-7cc05a0ca0e2"],
  ing:[["bacon",40],["fveg",30],["egg",1],["negi",0.3],["fbroc",60]], after:["egg","negi","fbroc"], rice:1, conds:["torigara","soy","sesame","pepper"],
  steps:["Rinse {150 g} rice, drain, into the cooker. Water to the fried-rice line — chahan wants drier rice than usual.","Stir in {1 tsp} chicken stock powder and {5 ml} soy sauce. Scatter {40 g} bacon in strips and {30 g} frozen mixed veg on top. Press the fried rice menu.","While it cooks (about 40 min), beat {1 egg|eggs} and slice {0.3 green onion|green onions}.","When it beeps, pour the raw egg straight over the hot rice and fold it through fast with the paddle. The residual heat sets it into threads.","{5 ml} sesame oil, black pepper and the green onion. Lid down 3 min. Meanwhile {60 g} frozen broccoli in a covered bowl, 600 W for 2 min, on the side."]},

 /* ---------- C · air fryer: protein and vegetables in the same basket ---------- */
 {id:"afroast", tier:"C", n:"Air-fryer chicken, potato & broccoli roast", jp:"鶏とじゃがいものバスケットロースト", gear:["air"], time:"8 min work", ready:45, eff:1, batch:true, cap:2, freeze:"freeze the chicken raw in the marinade",
  src:["The Dinner Bite","https://thedinnerbite.com/air-fryer-chicken-thighs-and-potatoes/"],
  ing:[["chicken",150],["potato",1.5],["onion",0.5],["fbroc",80]], conds:["oil","soy","pepper","salt"],
  steps:["Cut {1.5 potato|potatoes} into 3 cm chunks, skin on, and {0.5 onion} into thick wedges. Toss them in a bowl with {5 ml} oil and a pinch of salt — coat the potato properly or it turns leathery.","Cut {150 g} chicken thigh into big chunks and toss with {15 ml} soy sauce and a heavy grind of black pepper. Extra portions can go into a freezer bag raw now.","Preheat 3 min at 200 °C. Potato and onion in first, one layer, 10 min — potato needs a head start the chicken does not.","Shake, push the potato to the edges and put the chicken in the middle, skin up. 200 °C for 12 min.","Scatter {80 g} frozen broccoli into the gaps, straight from the bag, and give it 7 more min.","Done when a chopstick slides into a potato and the chicken juices run clear at the thickest piece. No rice — the potato is the carb, and the basket is the only thing to wash."]},
 {id:"afteriyaki", tier:"C", n:"Air-fryer teriyaki chicken & onion", jp:"照り焼きチキン", gear:["air","rice"], time:"5 min work", ready:30, eff:1, batch:true, cap:2, freeze:"freeze raw in the marinade",
  src:["COSORI","https://vesync.jp/pages/recipes-prole-bite-sized-teriyaki-chicken"],
  ing:[["chicken",150],["onion",0.5],["fbroc",100]], rice:0.5, conds:["soy","mirin","garlic","oil"],
  steps:["Cut {150 g} chicken thigh into big chunks, 4 or 5 from each 150 g.","Marinade: {15 ml} soy sauce + {15 ml} mirin + {1 tsp} garlic paste. Toss the chicken in it — 10 min minimum, overnight is better. Extra portions can go into freezer bags now.","Cut {0.5 onion} into thick wedges and rub with {5 ml} oil. Preheat 3 min at 190 °C. Chicken skin up and onion around it, one layer, 8 min.","Shake, then scatter {100 g} frozen broccoli into the gaps straight from the bag. 7 more min.","Done when the juices run clear when you poke the thickest piece (or 75 °C inside). Spoon the basket juices over the chicken and rice."]},
 {id:"karaage", tier:"C", n:"Air-fryer karaage with kabocha", jp:"唐揚げとかぼちゃ", gear:["air","rice"], time:"10 min work", ready:45, eff:1, batch:true, cap:2, freeze:"freeze raw in the marinade",
  src:["Toco's Kitchen","https://tocos-kitchen.com/japanese-style-fried-chicken-made-with-air-fryer/"],
  ing:[["chicken",150],["fkabocha",100],["cabbage",60]], rice:0.5, conds:["soy","garlic","ginger","katakuriko","oil","mayo"],
  steps:["Cut {150 g} chicken thigh into 4 cm chunks — keep the skin on. Marinade: {15 ml} soy sauce + {1 tsp} each garlic and ginger paste, 15 min minimum. Extra portions freeze raw in the marinade, in bags.","Tip {15 g} potato starch onto a plate and roll each chunk until it is dusted white on every side. Pat {5 ml} oil over the dusted pieces with your fingers — never aerosol spray, it strips the ceramic coating.","Preheat 3 min at 190 °C. {100 g} frozen kabocha in first, straight from the bag, 6 min — it needs a head start.","Push the kabocha to one side. Chicken in one layer with gaps: 8 min, flip every piece, 5 more min. Golden outside, juices clear inside = done.","Serve with {60 g} shredded cabbage and rice. Squeeze of mayo optional but encouraged."]},
 {id:"afsalmon", tier:"C", n:"Air-fryer salmon, kabocha & broccoli", jp:"焼き鮭とかぼちゃ", gear:["air","rice"], time:"3 min work", ready:22, eff:0, batch:false, cap:2,
  src:["COSORI","https://vesync.jp/blogs/recipes/4-ways-to-grill-fish"],
  ing:[["salmon",1],["fkabocha",80],["fbroc",80]], rice:0.5, conds:["mayo","oil"],
  steps:["Preheat 3 min at 190 °C. {80 g} frozen kabocha in, straight from the bag, with a drop of oil patted on. 5 min.","Push it aside and lay {1 salted salmon fillet|salted salmon fillets} skin side down, not touching. No seasoning — 塩鮭 is already salted.","10 min. For the last 5, drop {80 g} frozen broccoli into the gaps.","Done when the thickest part of the salmon flakes apart under a fork — check through the window, because opening the drawer pauses the timer. Rice and a dab of Kewpie."]},
 {id:"afbreast", tier:"C", n:"Air-fryer chicken breast with peppers", jp:"鶏むね肉と野菜の胡椒焼き", gear:["air","rice"], time:"5 min work", ready:25, eff:1, batch:true, cap:2,
  src:["COSORI","https://vesync.jp/pages/recipes-lite-2l-chickenandvegetablebarbecue"],
  ing:[["chickenbreast",150],["piman",1],["onion",0.5],["fbroc",60]], rice:0.5, conds:["oil","pepper","soy","salt"],
  steps:["Cut {150 g} chicken breast into 3 cm slabs — thick pieces stay juicy; thin ones turn to chalk. Cut {1 green pepper|green peppers} into strips and {0.5 onion} into wedges.","Toss it all with {5 ml} oil, a pinch of salt and a lot of black pepper.","Preheat 3 min at 180 °C. Everything in one layer, 12 min, shaking once at 6 min. 180 °C and not 200 °C — breast is lean and high heat dries it out.","Scatter {60 g} frozen broccoli into the gaps for the last 5 min.","Cut into the thickest slab: no pink and the juices run clear (75 °C inside). Rest 3 min, then {5 ml} soy sauce over the lot."]},
 {id:"afmiso", tier:"C", n:"Air-fryer miso chicken & cabbage", jp:"鶏の味噌漬け焼きとキャベツ", gear:["air","rice"], time:"5 min work", ready:40, eff:1, batch:true, cap:2, flex:true, freeze:"freeze raw in the marinade",
  src:["NHK きょうの料理","https://www.kyounoryouri.jp/recipe/41054_鶏のみそ漬け焼き&小松菜の蒸し焼き.html"],
  ing:[["chicken",150],["cabbage",120],["fbroc",60]], rice:0.5, conds:["miso","mirin","sake","garlic","oil"],
  steps:["Cut {150 g} chicken thigh into big chunks. Marinade: {18 g} miso (1 tbsp for each 18 g), {15 ml} mirin, {15 ml} sake and {1 tsp} garlic paste, mixed smooth before the chicken goes in. 15 min minimum, overnight is better.","Cut {120 g} cabbage into one thick wedge, core left on so it holds together, and rub {5 ml} oil over the cut faces.","Wipe most of the marinade off the chicken. Miso left thick on the surface burns black long before the middle is done.","Preheat 3 min at 180 °C, not hotter — miso has sugar in it. Cabbage wedge and chicken in one layer, 15 min, turning the cabbage once. {60 g} frozen broccoli into the gaps for the last 5 min.","Done when the juices run clear at the thickest piece and the cabbage edges are charred and sweet."]},
 {id:"afmeatball", tier:"C", n:"Air-fryer pork meatballs & kabocha", jp:"肉団子とかぼちゃ", gear:["air","rice"], time:"10 min work", ready:30, eff:1, batch:true, cap:2, minServ:2, freeze:"freeze raw or cooked",
  src:["Ajinomoto Park","https://park.ajinomoto.co.jp/recipe/card/709554/"],
  ing:[["gpork",120],["onion",0.25],["egg",0.5],["piman",1],["fkabocha",80]], rice:0.5, conds:["katakuriko","ginger","soy","mirin","sesame"],
  steps:["Mix {120 g} ground pork, {0.25 onion} diced very small, {0.5 egg|eggs} beaten, {10 g} potato starch, {1 tsp} ginger paste and {5 ml} soy sauce. Mix with one hand until sticky.","Roll into {6 ball|balls} about 3 cm across. Wet hands stop the mix sticking to you. Cut {1 green pepper|green peppers} into big pieces.","Preheat 3 min at 190 °C. {80 g} frozen kabocha in first, 5 min.","Add the balls and green pepper in one layer with gaps, drop to 180 °C, 12 min, shaking once at the halfway mark.","Cut one open: no pink at the centre. Glaze while hot with {15 ml} mirin and {5 ml} soy sauce stirred together, plus a drop of sesame oil."]},
 {id:"afhamburg", tier:"C", n:"Air-fryer hamburg steak & veg", jp:"ハンバーグと焼き野菜", gear:["air","rice"], time:"12 min work", ready:35, eff:1, batch:true, cap:2, minServ:2, freeze:"freeze the raw patties",
  src:["なかしー様","https://nakashisama.com/nonfryer-hamburg-recipe/"],
  ing:[["gpork",130],["onion",0.25],["egg",0.5],["fkabocha",80],["fbroc",60]], rice:0.5, conds:["panko","pepper","oil","ketchup","salt"],
  steps:["Dice {0.25 onion} small and soften it 2 min in the microwave, then let it cool. Warm onion cooks the egg in the mix and the patty turns crumbly.","Mix {130 g} ground pork with the cooled onion, {0.5 egg|eggs} beaten, {15 g} panko, a pinch of salt and a lot of black pepper. Work it until tacky, then throw it between your hands a few times to knock the air out.","Shape into {1 oval|ovals} about 2 cm thick with a dent pressed into the middle, so each rises flat instead of into a ball.","Preheat 3 min at 180 °C. Patties in with {80 g} frozen kabocha around them, brush the tops with {5 ml} oil, 10 min. Add {60 g} frozen broccoli, 6 more min.","Done when the juices run clear when pressed at the centre (75 °C). Rest 3 min. Sauce: {15 g} ketchup warmed with a splash of the basket juices."]},
 {id:"afkatsu", tier:"C", n:"Air-fryer chicken katsu", jp:"鶏カツ", gear:["air","rice"], time:"10 min work", ready:30, eff:1, batch:true, cap:1, freeze:"freeze breaded, uncooked",
  src:["COSORI","https://vesync.jp/blogs/recipes/tonkatsu"],
  ing:[["chicken",150],["egg",0.5],["cabbage",150]], rice:0.5, conds:["katakuriko","panko","oil","mayo","soy"],
  steps:["Butterfly {150 g} chicken thigh open so it lies flat and even. Even thickness is what makes or breaks a katsu.","Set out three stations: potato starch on a plate, a beaten egg in a bowl, {30 g} panko on a second plate. Dust with starch, dip in egg, then press the panko on hard — pressing is what stops it falling off in the basket.","Pat {5 ml} oil over the crumbs with your fingers until no white powder is left. Never aerosol spray: it strips the ceramic coating, and dry panko stays pale.","Preheat 3 min at 190 °C. One cutlet, flat, with nothing touching it: 8 min, flip, 5 min more. Breaded food needs the basket to itself — a second serving is a second round.","Done when the crumb is deep gold and the juices run clear where you cut into the thickest part (75 °C inside).","Slice into 2 cm strips over a big pile of {150 g} shredded cabbage — that pile is half the meal, not a garnish. Mayo and soy sauce mixed 1:1 is a passable tonkatsu sauce."]},
 {id:"aftofu", tier:"C", n:"Air-fryer crispy tofu & mushrooms", jp:"揚げ出し豆腐風", gear:["air","rice"], time:"5 min work", ready:25, eff:1, batch:false, cap:2, keep:1,
  src:["ROOMIE","https://www.roomie.jp/2021/04/893059/"],
  ing:[["tofu",0.5],["shimeji",60],["piman",1],["negi",0.2]], after:["negi"], rice:0.5, conds:["katakuriko","oil","ponzu","sesame"],
  steps:["Press {0.5 tofu block|tofu blocks} of firm tofu: wrap in kitchen paper, sit a plate on top, leave it 10 min. Wet tofu steams, pressed tofu crisps.","Cut into 3 cm cubes and roll them in {10 g} potato starch until dusted white on every side. Handle them like eggs, they break. Tear {60 g} shimeji apart and cut {1 green pepper|green peppers} into strips.","Preheat 3 min at 200 °C. Tofu in one layer, not touching, with {5 ml} oil patted over the tops; mushrooms and pepper in the gaps.","200 °C for 12 min, shaking the basket gently at the 8-minute mark.","Golden and firm outside means done. Onto rice, ponzu poured over, {0.2 green onion|green onions} sliced and a drop of sesame oil on top. Eat it tonight — it softens in the fridge."]},
 {id:"afgyoza", tier:"C", n:"Air-fryer frozen gyoza set", jp:"冷凍餃子（エアフライヤー）", gear:["air","rice"], time:"5 min work", ready:15, eff:0, batch:false, cap:1, keep:3,
  ing:[["gyoza",300],["cabbage",100]], rice:0.5, conds:["oil","soy","sesame","belachan"],
  steps:["Preheat 3 min at 190 °C. {12 frozen gyoza|frozen gyoza} straight from the freezer into the basket, flat side down, in one layer with gaps. No thawing, no water. Twelve is what one layer holds, so a second serving is a second round.","Wipe {5 ml} oil over the tops so the wrappers blister instead of drying out.","10 min. From minute 8, watch through the window: done when the wrappers are blistered gold and the edges have gone crisp.","Dip: {15 ml} soy sauce + a drop of sesame oil, and belachan if you want fire. {100 g} shredded cabbage alongside, rice."]},
 {id:"aftebasaki", tier:"C", n:"Air-fryer tebasaki wings", jp:"手羽先の塩焼き", gear:["air","rice"], time:"5 min work", ready:30, eff:1, batch:true, cap:1, freeze:"freeze raw and seasoned",
  src:["COSORI","https://vesync.jp/pages/recipe-tebashiochickenwings"],
  ing:[["tebasaki",200],["cabbage",150]], rice:0.5, conds:["pepper","oil","soy","salt"],
  steps:["Take {200 g} chicken wings, about 5 — LIFE wings run 35–45 g each. Pat them properly dry with kitchen paper: wet skin steams instead of crisping.","A pinch of salt, a heavy grind of black pepper, and {5 ml} oil rubbed over with your fingers. Never aerosol spray, it strips the ceramic coating.","Preheat 3 min at 190 °C. Wings in one layer, not touching — about 5 is what the basket floor holds, so a second serving is a second round. 12 min, then flip each one and give it 8 more.","Done when the skin is taut and browned and the juices run clear where the wing meets the joint.","Over a pile of {150 g} shredded cabbage, with rice and a drop of soy sauce."]},

 /* ---------- D · one pot, quick ---------- */
 {id:"belachan", tier:"D", n:"Belachan poached chicken breast", jp:"よだれ鶏（ベラチャン）", gear:["pot"], time:"10 min", ready:35, eff:1, batch:true, liquid:500, capMax:2, freeze:"slices freeze well",
  src:["クラシル","https://www.kurashiru.com/recipes/5b9ba2ea-36e1-4e67-bb56-36a655ec4b75"],
  ing:[["chickenbreast",150],["cucumber",0.5],["tomato",1],["negi",0.2]], after:["cucumber","tomato","negi"], rice:0.5, conds:["sesame","soy","ginger","belachan"],
  steps:["Lay {150 g} chicken breast in the pot in one layer — two breasts is what the floor holds. Add cold water to cover by 2 cm, {1 tsp} ginger paste and the green tops of a green onion.","Bring it to a boil, then turn the heat OFF completely and put the lid on. Leave it 15 min. Poaching off-heat is the whole trick — breast turns dry and stringy the moment it actually boils.","Check the thickest part is white all the way through. Lift it out, rest 5 min, slice 1 cm thick across the grain.","Sauce: {1 tsp} belachan + {15 ml} soy sauce + {5 ml} sesame oil, mixed in a small bowl.","At each meal: over rice with {0.5 cucumber|cucumbers} and {1 tomato|tomatoes}, sliced, and the white of the green onion. Keeps 3 days and is good cold. Keep the poaching water: that is chicken stock."]},
 {id:"nabe", tier:"D", n:"Chicken mizutaki nabe", jp:"水炊き鍋", gear:["pot"], time:"20 min", ready:25, eff:1, kettle:true, batch:true, liquid:250, capMax:2,
  src:["白ごはん.com","https://www.sirogohan.com/recipe/mizutaki/"],
  ing:[["chicken",150],["cabbage",150],["tofu",0.5],["shimeji",50]], rice:0.5, conds:["dashi","ponzu"],
  steps:["Cut {150 g} chicken into chunks, {150 g} cabbage into big squares and {0.5 tofu block|tofu blocks} into large cubes, and tear apart {50 g} shimeji.","Pot: {250 ml} water + {1 tsp} hondashi. Bring to a boil.","Chicken in first. 5 min, spooning off the foam that rises.","Half the cabbage in, lid on, 3 min until it collapses — then the rest of the cabbage, the tofu and the shimeji. Lid on, medium, 8 min until the cabbage is soft.","Pour some ponzu into a small bowl and dip each bite. Night two: drop cooked rice and a beaten egg into the leftover broth, 3 min = zōsui."]},
 {id:"udon", tier:"D", n:"One-pot pork & spinach udon", jp:"肉うどん", gear:["pot"], time:"8 min", ready:8, eff:0, kettle:true, batch:false, liquid:400, capMax:2, keep:1,
  src:["白ごはん.com","https://www.sirogohan.com/recipe/nikuudon/"],
  ing:[["udon",200],["egg",1],["pork",60],["fspinach",80],["negi",0.2]], after:["negi"], conds:["mentsuyu"],
  steps:["Pot: {350 ml} water + {50 ml} mentsuyu. Bring to a boil.","Add {60 g} thin pork slices, 1 min, skim any foam.","{1 frozen udon block|frozen udon blocks} and {80 g} frozen spinach straight in — no thawing. 2 min, loosening the udon with chopsticks as it softens.","Crack in {1 egg|eggs}, do NOT stir, lid on, heat OFF, wait 1 min — you get a just-set egg.","{0.2 green onion|green onions} sliced on top, eat from the pot."]},
 {id:"tompasta", tier:"D", n:"One-pot tomato bacon pasta", jp:"ワンポットトマトパスタ", gear:["pot"], time:"15 min", ready:20, eff:1, kettle:true, batch:false, liquid:250, capMax:2, keep:1,
  src:["DELISH KITCHEN","https://delishkitchen.tv/recipes/243717004802916649"],
  ing:[["pasta",100],["bacon",40],["cantomato",200],["onion",0.25],["fspinach",50]], conds:["consomme","garlic","oil","salt"],
  steps:["Cut {40 g} bacon into strips and dice {0.25 onion}.","Pot on medium, 5 ml (1 tsp) oil. Bacon, onion and {1 tsp} garlic paste, fry 2 min.","Add {200 g} canned tomato, {250 ml} water and {1 tsp} consommé granules. Bring to a boil.","Snap {100 g} pasta in half and push it in. Stir every 2 min or so — one-pot pasta sticks if ignored.","Simmer about 10 min (check 1 min before the packet time). Stir in {50 g} frozen spinach for the last 2 min. Taste; salt if flat. Eat it now — it does not reheat well."]},
 {id:"wafupasta", tier:"D", n:"One-pot wafū chicken & mushroom pasta", jp:"和風きのこパスタ", gear:["pot"], time:"15 min", ready:18, eff:1, kettle:true, batch:false, liquid:330, capMax:2, keep:1,
  src:["クラシル","https://www.kurashiru.com/recipes/47a765c7-c57f-4ade-b061-5394238a179b"],
  ing:[["pasta",100],["chicken",100],["shimeji",80],["onion",0.25],["fspinach",50]], conds:["mentsuyu","garlic","oil"],
  steps:["Cut {100 g} chicken into small pieces, slice {0.25 onion} thin, cut the base off {80 g} shimeji and tear it apart.","Pot on medium, 5 ml (1 tsp) oil. Chicken 2 min, then the onion, shimeji and {1 tsp} garlic paste for 2 min until the mushrooms soften.","Add {300 ml} water + {30 ml} mentsuyu. Boil, then add {100 g} pasta snapped in half.","Stir every couple of minutes for ~10 min until the liquid is almost fully absorbed — what remains IS the sauce.","Stir in {50 g} frozen spinach for the last 2 min. Eat from the pot, now."]},

 /* ---------- E · emergency: cupboard and fridge-door meals ---------- */
 {id:"chinchalok", tier:"E", n:"Chinchalok omelette don", jp:"チンチャロクオムレツ丼", gear:["pan","rice"], time:"7 min", ready:7, eff:1, batch:false, cap:1, keep:1,
  ing:[["egg",3],["negi",0.2],["tomato",1],["cucumber",0.5]], rice:0.5, conds:["oil","chinchalok","belachan"],
  steps:["Beat {3 egg|eggs} with {1 tsp} chinchalok and {0.2 green onion|green onions}, sliced. NO extra salt — chinchalok brings plenty.","Pan on medium-high with 15 ml (1 tbsp) oil. Give it a full minute to get properly hot — the egg should sizzle on contact.","Pour in. Wait 10 seconds, then drag the edges toward the middle with the spatula, tilting the pan so raw egg fills the gaps. 3–4 drags total.","When the top is still slightly glossy, stop — slide it out over rice. It finishes cooking from its own heat.","{1 tomato|tomatoes} and {0.5 cucumber|cucumbers}, sliced, on the side. Belachan for fire."]},
 {id:"iwashi", tier:"E", n:"Iwashi kabayaki don", jp:"いわし蒲焼き丼", gear:["rice"], time:"2 min", ready:2, eff:0, batch:false, cap:2, keep:1,
  src:["DELISH KITCHEN","https://delishkitchen.tv/recipes/147602560105054682"],
  ing:[["sardine",1],["negi",0.2],["cabbage",100]], rice:0.5, conds:["mayo"],
  steps:["Hot rice into a bowl — about 165 g cooked per serving.","Open {1 can|cans} of grilled sardine and tip it over the rice, sauce included. The sauce IS the seasoning, so do not drain it.","{0.2 green onion|green onions} sliced on top, and a dab of Kewpie if you want it richer.","{100 g} shredded cabbage alongside — the pre-shredded bag is fine. No pan, no heat."]},
 {id:"tunamayo", tier:"E", n:"Tuna-mayo don (zero cook)", jp:"ツナマヨ丼", gear:["rice"], time:"2 min", ready:2, eff:0, batch:false, keep:1,
  src:["クラシル","https://www.kurashiru.com/recipes/94668315-7387-424e-afe1-a04c4f3cdbee"],
  ing:[["tuna",1],["negi",0.2],["cabbage",100]], rice:0.5, conds:["mayo","soy"],
  steps:["Hot rice into a bowl — about 165 g cooked per serving.","Open {1 tuna can|tuna cans} and press the lid down over the sink to drain the liquid out.","Mix the tuna with {15 ml} mayo + {5 ml} soy sauce right in the can or a small bowl.","Pile onto the rice with {0.2 green onion|green onions} sliced on top and {100 g} shredded cabbage alongside."]},

 /* ---------- F · the 26 cm pan ---------- */

/* ============ SCALED STEP TEXT ============ */
const FRAC = [[0,""],[1/4,"¼"],[1/3,"⅓"],[1/2,"½"],[2/3,"⅔"],[3/4,"¾"],[1,""]];
function fmtCount(v){
  let whole = Math.floor(v + 1e-9), rest = v - whole, best = FRAC[0], d = 9;
  FRAC.forEach(f=>{ const dd = Math.abs(rest - f[0]); if (dd < d - 1e-9) { d = dd; best = f; } });
  if (best[0] === 1) { whole += 1; best = FRAC[0]; }
  if (!whole && !best[1]) return "¼";
  return (whole ? String(whole) : "") + best[1];
}
function fmtQty(v, unit, plural){
  if (unit === "g") return (v >= 20 ? Math.round(v/5)*5 : Math.round(v)) + " g";
  if (unit === "ml") {
    const ml = v >= 10 ? Math.round(v/5)*5 : Math.round(v);
    if (ml <= 60 && ml % 15 === 0) return ml+" ml ("+(ml/15)+" tbsp)";
    if (ml <= 15 && ml % 5 === 0) return ml+" ml ("+(ml/5)+" tsp)";
    return ml+" ml";
  }
  if (unit === "tsp") return (v >= 3 && Math.abs(v/3 - Math.round(v/3)) < 1e-9) ? (v/3)+" tbsp" : fmtCount(v) + " tsp";
  /* nobody beats one and a half eggs: past one, eggs round up to whole */
  if (unit === "egg" && v > 1.01) v = Math.ceil(v - 0.01);
  return fmtCount(v) + " " + (v > 1.01 ? (plural || unit+"s") : unit);
}
/* {150 g}  {15 ml}  {1 tsp}  {0.5 onion}  {1 potato|potatoes} — multiplied by n servings */
function scaleText(s, n){
  return s.replace(/\{([\d.]+) ([^}|]+?)(?:\|([^}]+))?\}/g, (m, q, unit, plural)=>fmtQty(parseFloat(q)*n, unit, plural));
}
function stepText(r, i, n){ return scaleText(r.steps[i], n || 1); }

  S.price = isObj(S.price) ? Object.fromEntries(Object.entries(S.price).filter(([k,v])=>ING[k] && typeof v==="number" && isFinite(v) && v>=0)) : {};

     condiment deliberately marked as run out stays marked. */

    SHELF_SEED.forEach(k=>{ if (S.owned[k] === undefined) S.owned[k] = true; });

  /* rice and barley used to be billed every week by the gram; they are bag stock, seeded as in */
  if (S.stockSeeded !== true) {
    Object.keys(STOCK).forEach(k=>{ if (S.owned[k] === undefined) S.owned[k] = true; });

  if (S.owned.salt === undefined) S.owned.salt = true;

/* how many dishes a week of N meals gets at each variety setting */

/* what a dish needs to qualify for this week: short weeks cook fresh; max batch needs a batchable
   dish; and when one dish covers more meals than it keeps, it must freeze */
function fitsWeek(r, N, v){
  const k = dishCount(N, v), per = Math.ceil(N / k);
  if (N<=2 && r.batch) return false;
  if (N>2 && v===1 && !r.batch) return false;
  if (per > keepDaysOf(r) && !r.freeze) return false;
  if (r.minServ && per < r.minServ) return false;

/* Everything a roll changes, so one Undo puts all of it back: the plan alone used to be restored,

function restore(snap){ Object.assign(S, JSON.parse(JSON.stringify(snap))); if (!S.plan) delete S.plan; save(); render(); }

    || S.plan.some(id=>{ const r = rec(id); return !r || !fitsWeek(r, S.N, S.v); });
  if (mustReshuffle && shopped()) {
    /* keep the shopped dishes and spread the new count over them; replanning is his call */

function setVariety(v){

/* Max-batch mode used to sort the pool by capacity and take the top, which meant it only ever

   cook), so it stays as a weight rather than a ranking, alongside an appliance bias and a damper
   on anything picked recently. */
function dishWeight(r, v, wantBatch){
  let w = isApplianceDish(r) ? APPLIANCE_BIAS : 1;
  if (wantBatch && r.batch) w *= BATCH_BIAS;
  if (v===1) w *= (r.cap || 1);
  if (S.recent.includes(r.id)) w *= REPEAT_DAMP;
  /* each thing in the fridge the dish uses multiplies it, so a dish that clears two leftovers
     beats one that clears one */
  ingsOf(r).forEach(([id])=>{ if (S.carry[id] && S.carry[id].q >= (ING[id].u==="pc" ? 0.25 : 30)) w *= carryBoost(id); });

    let x = Math.random() * total, i = 0;

/* What the old week left over. Ticked rows were bought; a list with no ticks at all was shopped

     A settled entry is arithmetic, not something he told the fridge check, so it loses f. */
  if (prev && shopped) Object.entries(prev.req).forEach(([id,req])=>{
    const row = prev.rows.find(r=>r.id===id);

/* ---- the weekly fridge check ---- */

function plan(reshuffle, fridgeStated, snap){
  const N = S.N, v = S.v;
  const k = dishCount(N, v);
  const pool = RECIPES.filter(r=>fitsWeek(r, N, v));
  const locked = pool.filter(r=>S.locked.includes(r.id)).slice(0,k);
  const benched = S.locked.map(rec).filter(r=>r && !locked.includes(r));
  let picks = [...locked];
  const before = snap || snapshot();
  let undid = false;
  if (reshuffle!=="keep" || !S.plan) {
    if (S.plan || before.plan) {
      undid = true;
      /* the fridge check has just said what is actually there, which beats any arithmetic */
      if (!fridgeStated && S.plan) S.carry = settledCarry();
    }
    /* one dish is built around each perishable the fridge check reported, before the rest are drawn */
    const urgency = id => carryBoost(id) + (S.carry[id].q >= ((FRIDGE_Q[id]||[0,Infinity])[1]) ? 0.5 : 0);
    Object.keys(S.carry).filter(mustUse).sort((a,b)=>urgency(b)-urgency(a)).forEach(id=>{
      if (picks.length >= k || picks.some(p=>ingsOf(p).some(([i])=>i===id))) return;
      const cand = pool.filter(r=>!picks.includes(r) && ingsOf(r).some(([i])=>i===id));
      if (cand.length) picks.push(pickWeighted(cand, 1, v, N/k>=3)[0]);
    });
    const rest = pool.filter(r=>!picks.some(p=>p.id===r.id));
    picks = picks.concat(pickWeighted(rest, k - picks.length, v, N/k>=3));
    S.plan = picks.map(r=>r.id);

    S.bought = Object.fromEntries(Object.entries(S.bought).filter(([id,v])=>v && onList.has(id)));
    S.recent = [...S.plan, ...S.recent.filter(id=>!S.plan.includes(id))].slice(0, RECENT_KEEP);
    U.heroIdx = 0; /* a new week means the old "Nah" position means nothing */
    S.planDate = localDate();
  }
  save(); render();

    const kept = Object.keys(S.bought).length, note = [];
    if (kept) note.push(kept+" basket tick"+(kept>1?"s":"")+" kept");

  }
}

/* ---- cook mode ----

/* ============ DERIVED ============ */
function compute(){
  if (!S.plan) return null;
  const picks = S.plan.map(id=>rec(id)).filter(Boolean);
  if (!picks.length) return null;
  const N = S.N, servings = {};
  picks.forEach((r,i)=>{ servings[r.id] = Math.floor(N/picks.length) + (i < N%picks.length ? 1 : 0); });
  /* An even split ignores the gear: 7 meals over curry (3 a pot) and karaage (2 a basket) came

  /* a dish with a minimum fill (the simmer menu) takes at least that many, from the others */
  picks.forEach(r=>{ while (r.minServ && servings[r.id] < r.minServ) {
    const donor = picks.filter(o=>o!==r && servings[o.id] > Math.max(1, o.minServ||1)).sort((a,b)=>servings[b.id]-servings[a.id])[0];
    if (!donor) break; servings[donor.id]--; servings[r.id]++; } });

  for (let pass=0, better=true; better && pass<40; pass++) {
    better = false;
    picks.forEach(a=>picks.forEach(b=>{
      if (a===b || servings[a.id]<=Math.max(1, a.minServ||1)) return;
      /* never push a non-freezer past what it keeps */
      if (!b.freeze && servings[b.id]+1 > keepDaysOf(b)) return;
      const before = total(); servings[a.id]--; servings[b.id]++;

    }));
  }
  const g = {}; let riceGo = 0, mugiCups = 0, sideCups = 0;
  picks.forEach(r=>{
    const s = servings[r.id];
    riceGo += (r.rice||0)*s;
    if (riceKind(r)==="side" || riceKind(r)==="cooked") sideCups += r.rice*s;
    if (S.mugi && !r.cookin) mugiCups += (r.rice||0)*s;

  });
  let food = 0;
  /* a piece already in the fridge comes off the count before rounding; q is what is left to buy,
     req the whole requirement, so a roll can work out the new leftover */
  const rows = Object.entries(g).map(([id,req])=>{
    const it = ING[id];
    const have = S.carry[id] ? S.carry[id].q : 0;
    const q = Math.max(0, req - have);
    if (have && q <= 0.05) return null;
    const buy = it.u==="pc" ? Math.ceil(q) : Math.ceil(q/50)*50;
    const cost = buy*priceOf(id); food += cost;
    /* meat and fish trays are sold by weight, not in 50 g steps: pick trays adding up to at least this */
    return {id, cat:it.cat, n:it.n, jp:it.jp, q, req, buy, have, cost,
      disp: it.u==="pc" ? buy+(buy>1?" pcs":" pc")+(have?" · have "+frac(have):"") : (have ? "buy "+(it.cat==="meat"?"at least ":"")+buy+" g · have "+Math.round(have)+" of "+Math.round(req) : (it.cat==="meat" ? "at least "+buy+" g" : buy+" g"))};
  }).filter(Boolean);
  /* rice and barley are bag stock (see STOCK): they join the shelf top-up, never the weekly rows */
  const needed = [...new Set([...picks.flatMap(r=>r.conds), ...(riceGo>0?["rice"]:[]), ...(mugiCups>0?["mugi"]:[])])];
  /* every piece requirement, covered or not, so a roll can settle the leftover ledger */
  const pcReq = Object.fromEntries(Object.entries(g).filter(([id])=>ING[id].u==="pc"));
  return {picks, servings, N, rows, food, riceGo, sideCups, mugiCups, needed, pcReq, req:g};
}

/* A week is only 2–3 dishes, so it usually cannot answer all three effort questions —
   61% of generated weeks contain no zero-effort dish at all. Tonight therefore falls back
   to the rest of the roster rather than answering "zero effort" with a 30-minute stew.
   Off-plan dishes are always ranked last and always labelled, because they have not been
   shopped for. The order is stable for a given week so the suggestion does not move
   under you between renders, but differs from week to week. */
function planSeed(){
  const s = (S.plan||[]).join(",") + "|" + S.N + "|" + S.v;
  let h = 0;
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function rotated(list, salt){
  if (list.length < 2) return list;
  const k = (planSeed()+salt) % list.length;
  return list.slice(k).concat(list.slice(0,k));
}
function candidates(c){
  const eff = U.effort;
  const planned = c ? c.picks : [];
  const done = cookedNow();
  const doneIds = new Set(done.map(x=>x.r.id));
  /* what is already cooked is the easiest answer there is — and is not offered for cooking again */
  const reheats = eff===2 ? [] : done.map(({r,e})=>({kind:"reheat", r, eff:0, serv:1, d:e.d}));
  const inPlan = planned.filter(r=>r.eff<=eff && !doneIds.has(r.id)).map(r=>({kind:"cook", r, eff:r.eff, serv:sessionServ(r, c)}));
  /* within a tier, dishes that are actually on the table soon come first — "something quick" at
     7:30 pm should not lead with an hour in the rice cooker */
  const soonCut = eff===0 ? 20 : eff===1 ? 35 : 999;
  const offAll = RECIPES.filter(r=>r.eff===eff && !planned.some(p=>p.id===r.id));
  const offPlan = [...rotated(offAll.filter(r=>r.ready<=soonCut), eff), ...rotated(offAll.filter(r=>r.ready>soonCut), eff+7)]
    .map(r=>({kind:"offplan", r, eff:r.eff}));
  if (eff===2) {
    /* asked for a batch day: answer with an anchor. If the week has none, an off-plan
       anchor is a better answer than a 12-minute pan dish — batching is the whole request. */
    const anchors = inPlan.filter(o=>o.r.eff===2);
    const others = inPlan.filter(o=>o.r.eff!==2);
    return [...anchors, ...offPlan, ...others];
  }
  /* asked for something easy: the boxes, then the plan soonest-on-the-table first, then the roster */
  return [...reheats, ...inPlan.sort((a,b)=>readyTotal(a.r, a.serv)-readyTotal(b.r, b.serv)), ...offPlan];
}
function roundsFor(r, s){ return (!r.cap || s <= r.cap) ? 1 : Math.ceil(s / r.cap); }
function roundsLabel(r, s){
  const n = roundsFor(r, s);
  if (n === 1) return "one go";
  return n + " rounds";
}
/* minutes to the table; side rice is its own clock, so it is named rather than added in */
function readyLabel(r, s){ return "ready ~"+readyTotal(r, s||1)+" min"+(riceKind(r)==="side" ? " + rice" : ""); }
/* every extra round adds its cooking time: a basket cycle for the air fryer, the whole dish otherwise */
function readyTotal(r, s){
  const extra = roundsFor(r, s) - 1;
  return r.ready + extra * (r.gear.includes("air") ? 15 : r.ready);
}
function capLabel(r){
  if (!r.cap) return "no limit";
  return r.cap + " a round";
}
function gearTips(r, s){
  const t = [];
  const cp = r.cap;
  if (cp && s>cp) t.push(cp===1
    ? "This dish only works one serving at a time — do "+s+" quick rounds back-to-back."
    : "×"+s+" servings won't fit in one go — cook "+Math.ceil(s/cp)+" rounds of ~"+cp+".");
  if (r.crowd && s >= 3) t.push("Three or more servings: split into rounds — a crowded 26 cm pan steams instead of sears.");
  if (r.plate) t.push(PLATE_RULE);
  if (r.minServ && s < r.minServ) t.push("The simmer menu needs at least "+r.minServ+" servings in the pot, or it sits under the bottom mark and can boil over.");
  return t;
}

function pairingFor(r, c, riceRun){

/* ============ TOP-LEVEL RENDER ============ */
function render(){
  if (STALE && !U.cook && !U.sheet && !U.fridge) { try { location.reload(); return; } catch(e) {} }
  const ae = document.activeElement;
  const fk = ae && ae.dataset ? ae.dataset.k : null;
  /* tabs are replaced wholesale via innerHTML, which wipes anything half-typed.
     Keep the field being typed in, and always keep the free-text spend box. */
  const typedVal = (ae && ae.tagName==="INPUT" && fk) ? ae.value : null;
  const spentEl = document.getElementById("spentInput");
  const spentVal = spentEl ? spentEl.value : null;
  pruneCarry();
  const c = compute();
  document.getElementById("tab-tonight").innerHTML = tonightHTML(c);
  document.getElementById("tab-week").innerHTML = weekHTML(c);
  document.getElementById("tab-shop").innerHTML = shopHTML(c);
  document.getElementById("tab-save").innerHTML = saveHTML();
  renderTabBar(c);
  ["tonight","week","shop","save"].forEach(t=>{
    document.getElementById("tab-"+t).className = "wrap tab"+(S.tab===t?" on":"");
  });
  const sh = sheetHTML(c);
  const sheetEl = document.getElementById("sheet-overlay");
  sheetEl.innerHTML = sh.html;
  sheetEl.classList.toggle("show", sh.show);
  sheetEl.setAttribute("aria-label", U.fridge ? "What's in the fridge?" : "Dish details");
  const ck = cookHTML();
  const cookEl = document.getElementById("cook-overlay");
  cookEl.innerHTML = ck.html;
  cookEl.classList.toggle("show", ck.show);
  const ts = toastHTML();
  const toastEl = document.getElementById("toast");
  toastEl.innerHTML = ts.html;
  toastEl.classList.toggle("show", ts.show);
  document.querySelectorAll(".jp,.jpx").forEach(el=>el.setAttribute("lang","ja"));

  /* an overlay is modal: the page behind it takes no focus, no pointer, no scroll */
  const overlaid = sh.show || ck.show;
  ["main","tabbar"].forEach(id=>{
    const el = document.getElementById(id); if (!el) return;
    if (overlaid) el.setAttribute("inert",""); else el.removeAttribute("inert");
  });
  /* position:fixed stops the page scrolling behind an overlay, but on its own it also jumps the
     page to the top: pin it at the current offset and put the scroll back when the overlay goes */
  if (overlaid && !U.overlaid) {
    U.scrollY = window.scrollY || 0;
    /* fk is what had focus before this render replaced the tabs — the opener */
    if (!U.returnK && fk) U.returnK = fk;
    document.body.style.top = -U.scrollY+"px";
  }
  document.body.classList.toggle("noscroll", overlaid);
  if (!overlaid && U.overlaid) {
    document.body.style.top = "";
    try { window.scrollTo(0, U.scrollY); } catch(e) {}
    /* focus goes back to whatever opened the overlay, not to <body> */
    const back = U.returnK && document.querySelector('[data-k="'+U.returnK+'"]');
    U.returnK = null;
    if (back && back.focus) back.focus();
  }
  U.overlaid = overlaid;
  document.body.classList.toggle("cooking", ck.show);

  /* put back what the user had typed, then where they were */
  if (U._clearSpent) { U._clearSpent = false; }
  else if (spentVal) { const el = document.getElementById("spentInput"); if (el) el.value = spentVal; }
  if (fk) {
    const el = document.querySelector('[data-k="'+fk+'"]');
    if (el) {
      if (typedVal !== null && el.tagName==="INPUT") el.value = typedVal;
      if (el.focus) el.focus();
    }
  }
  /* opening an overlay moves focus into it, or keyboard users stay stranded behind it */
  if (overlaid) {
    const box = ck.show ? cookEl : sheetEl;
    if (!box.contains(document.activeElement)) {
      const first = box.querySelector("button,input,[tabindex]");
      if (first && first.focus) first.focus();
    }
  }
}
if (typeof document !== "undefined") {

    if (e.key !== "lmp") return;
    const typing = document.activeElement && document.activeElement.tagName === "INPUT";
    if (!U.cook && !U.sheet && !U.fridge && !typing) location.reload(); else STALE = true;

    if (U.cook) { quitCook(); }
    else if (U.fridge) { closeFridge(); }
    else if (U.sheet) { closeSheet(); }
  });
}

/* last resort: a corrupt save must never leave a blank app with no way back, and must never
   leave one that fails again on every reload — so each attempt throws away strictly more */
try { render(); } catch (e) {
  delete S.plan; S.protein = {}; S.bought = {}; S.tab = "tonight";
  save();
  try { render(); } catch (e2) {
    try { localStorage.removeItem("lmp"); } catch (e3) {}
    /* the same sanitiser as boot, from nothing: seeded shelf, empty ledger, no plan */
    loadState({}); U = freshU();
    try { render(); } catch (e4) {
      document.getElementById("tab-tonight").className = "wrap tab on";
      document.getElementById("tab-tonight").innerHTML = '<div class="emptycard">Something went wrong, so your saved week was cleared. Reload and tap Generate my week.</div>';
    }
  }
}
</script>
</body>
</html>
